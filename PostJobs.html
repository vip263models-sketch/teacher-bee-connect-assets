<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TeacherBee Connect - Manage Jobs</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* CORE STYLES */
    :root {
      --primary-navy: #0A192F; --navy-light: #172A45; --accent-yellow: #FFD700; --yellow-hover: #E5C100;
      --bg-color: #F8F9FA; --surface-white: #FFFFFF; --text-main: #111827; --text-muted: #6B7280;
      --border-color: #E5E7EB; --error-red: #EF4444; --success-green: #10B981;
      --radius-lg: 16px; --radius-md: 8px; --shadow-sm: 0 1px 2px rgba(0,0,0,0.05); --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; }
    h1, h2, h3, h4 { color: var(--primary-navy); font-weight: 700; margin-bottom: 0.5rem; }
    p { color: var(--text-muted); line-height: 1.5; }

    /* The header and sidebar CSS remains so the injected components style perfectly */
    header { background-color: var(--primary-navy); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow-md); }
    .brand-logo { display: flex; align-items: center; gap: 0.5rem; text-decoration: none; color: var(--surface-white); font-weight: 700; font-size: 1.25rem; }
    .brand-logo i { color: var(--accent-yellow); font-size: 1.5rem; }
    .recruiter-badge { background: rgba(255, 215, 0, 0.2); color: var(--accent-yellow); padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; margin-left: 10px; }

    .btn { padding: 0.75rem 1.5rem; border-radius: var(--radius-md); font-weight: 600; font-size: 0.95rem; cursor: pointer; border: none; transition: all 0.2s ease; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; text-decoration: none; }
    .btn-primary { background-color: var(--accent-yellow); color: var(--primary-navy); }
    .btn-primary:hover { background-color: var(--yellow-hover); }
    .btn-danger { background-color: #FEE2E2; color: var(--error-red); padding: 0.5rem 1rem; }
    .btn-small { padding: 0.4rem 0.8rem; font-size: 0.85rem; }
    .btn-block { width: 100%; }
    
    .form-group { margin-bottom: 1.25rem; }
    .form-label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.5rem; color: var(--primary-navy); }
    .form-input, .form-select { width: 100%; padding: 0.85rem 1rem; border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 1rem; outline: none; transition: 0.2s; background: var(--surface-white); color: var(--text-main); }
    .form-input:focus, .form-select:focus { border-color: var(--primary-navy); box-shadow: 0 0 0 3px rgba(10, 25, 47, 0.1); }
    .grid-2-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    .app-container { display: flex; flex: 1; max-width: 1200px; margin: 0 auto; width: 100%; padding: 2rem; gap: 2rem; align-items: flex-start; }
    
    /* Sidebar CSS */
    .sidebar { width: 250px; display: flex; flex-direction: column; gap: 0.5rem; position: sticky; top: 100px; height: fit-content; }
    .sidebar-item { padding: 1rem; border-radius: var(--radius-md); color: var(--primary-navy); font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 1rem; transition: all 0.2s; text-decoration: none; }
    .sidebar-item:hover { background-color: var(--bg-color); }
    .sidebar-item.active { background-color: var(--primary-navy); color: var(--accent-yellow); }

    .content-area { flex: 1; display: flex; flex-direction: column; gap: 1.5rem; padding-bottom: 2rem; min-width: 0; }
    
    .card { background: var(--surface-white); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 1.5rem; box-shadow: var(--shadow-sm); margin-bottom: 1.5rem; }

    /* Job Management List */
    .job-list-item { display: flex; justify-content: space-between; align-items: center; padding: 1rem; border: 1px solid var(--border-color); border-radius: var(--radius-md); margin-bottom: 1rem; }
    .job-status-toggle { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: var(--text-muted); }

    /* Rich Text Editor */
    .editor-toolbar { display: flex; gap: 0.5rem; padding: 0.5rem; background: var(--bg-color); border: 1px solid var(--border-color); border-bottom: none; border-radius: var(--radius-md) var(--radius-md) 0 0; }
    .editor-toolbar button { background: none; border: none; cursor: pointer; padding: 0.5rem; border-radius: 4px; color: var(--primary-navy); }
    .editor-toolbar button:hover { background: var(--border-color); }
    .rich-editor { min-height: 200px; padding: 1rem; border: 1px solid var(--border-color); border-radius: 0 0 var(--radius-md) var(--radius-md); background: var(--surface-white); outline: none; overflow-y: auto; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 25, 47, 0.8); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 1rem; }
    .modal-overlay.active { display: flex; animation: fadeIn 0.2s; }
    .modal-content { background: var(--surface-white); width: 100%; max-width: 600px; border-radius: var(--radius-lg); padding: 2rem; position: relative; max-height: 90vh; overflow-y: auto; }
    .close-modal { position: absolute; top: 1rem; right: 1rem; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-muted); transition: color 0.2s; }
    .close-modal:hover { color: var(--primary-navy); }

    #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
    .toast { padding: 1rem 1.25rem; border-radius: var(--radius-md); color: var(--surface-white); font-weight: 600; font-size: 0.9rem; box-shadow: var(--shadow-md); animation: slideIn 0.3s ease forwards; display: flex; align-items: center; gap: 10px; }
    .toast.success { background-color: var(--success-green); }
    .toast.error { background-color: var(--error-red); }
    .toast.info { background-color: var(--primary-navy); color: var(--accent-yellow); }

    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    @media (max-width: 768px) {
      .app-container { padding: 1rem; padding-bottom: 85px; }
      .grid-2-col { grid-template-columns: 1fr; }
      .sidebar { position: fixed; bottom: 0; left: 0; width: 100%; height: 70px; background: var(--primary-navy); display: flex; flex-direction: row; justify-content: space-between; align-items: center; padding: 0 0.5rem; z-index: 999; top: auto; }
      .sidebar-item { flex: 1; flex-direction: column; padding: 0.5rem; font-size: 0.7rem; gap: 0.2rem; border-radius: 8px; text-align: center; color: var(--surface-white); }
      .sidebar-item.active { background: transparent; color: var(--accent-yellow); }
      .hide-mobile { display: none !important; }
      .job-list-item { flex-direction: column; align-items: flex-start; gap: 1rem; }
    }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, updateDoc, getDoc, serverTimestamp, collection, query, where, getDocs, onSnapshot, addDoc, orderBy, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBMKjt1RUZXVxTmadiCqKhNbzSPsNUDxV8",
      authDomain: "teacherbee-connect.firebaseapp.com",
      projectId: "teacherbee-connect",
      storageBucket: "teacherbee-connect.firebasestorage.app",
      messagingSenderId: "345613317767",
      appId: "1:345613317767:web:555713e479f9837e84aa22"
    };

    const app = initializeApp(firebaseConfig);
    window.auth = getAuth(app);
    window.db = getFirestore(app);
    window.fb = { doc, setDoc, updateDoc, getDoc, serverTimestamp, collection, query, where, getDocs, onSnapshot, addDoc, orderBy, deleteDoc, signOut };
    setPersistence(window.auth, browserLocalPersistence);

    let isRedirecting = false;

    onAuthStateChanged(window.auth, async (user) => {
      if (user) {
        const docRef = doc(window.db, "users", user.uid);
        const docSnap = await getDoc(docRef);
        
        if (docSnap.exists()) {
          const data = docSnap.data();
          if (data.role !== 'recruiter') {
            if (!isRedirecting) { isRedirecting = true; window.location.href = 'index.html'; }
            return;
          }

          window.currentUser = { uid: user.uid, ...data };
          let name = data.name || user.email.split('@')[0];
          let avatar = data.avatarUrl || "https://ui-avatars.com/api/?name=" + name + "&background=0A192F&color=FFD700";
          
          // These elements will be inside our injected header
          const navName = document.getElementById('nav-display-name');
          const navAvatar = document.getElementById('nav-avatar-img');
          if(navName) navName.innerText = name;
          if(navAvatar) navAvatar.src = avatar;

          window.setupRealtimeJobs();
        }
      } else {
        window.location.href = 'index.html';
      }
    });
  </script>
</head>
<body>

  <div id="toast-container"></div>

  <!-- INJECT HEADER HERE -->
  <div id="header-placeholder"></div>

  <div class="app-container">
    
    <!-- INJECT SIDEBAR HERE -->
    <div id="sidebar-placeholder"></div>

    <main class="content-area">
      <section id="jobs-view">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
          <h2>My Job Postings</h2>
          <button class="btn btn-primary" onclick="openJobEditor()"><i class="fa-solid fa-plus"></i> Post New Job</button>
        </div>

        <div class="card" id="recruiter-jobs-container" style="display:flex; flex-direction:column; gap:1rem;">
          <div style="text-align:center; padding: 3rem; color:var(--text-muted);" id="empty-jobs">
            <i class="fa-solid fa-briefcase" style="font-size: 3rem; margin-bottom: 1rem;"></i>
            <p>You haven't posted any jobs yet.</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- JOB CREATION MODAL -->
  <div class="modal-overlay" id="job-editor-modal">
    <div class="modal-content">
      <button class="close-modal" onclick="closeJobEditor()">&times;</button>
      <h2 id="job-modal-title">Create Job Posting</h2>
      
      <div class="form-group">
        <label class="form-label">Job Title</label>
        <input type="text" id="job-title" class="form-input" placeholder="e.g. Online English Tutor (K-12)">
      </div>
      
      <div class="grid-2-col">
        <div class="form-group">
          <label class="form-label">Location / Setup</label>
          <input type="text" id="job-loc" class="form-input" placeholder="e.g. Remote, Beijing, etc.">
        </div>
        <div class="form-group">
          <label class="form-label">Compensation / Pay</label>
          <input type="text" id="job-pay" class="form-input" placeholder="e.g. $20/hr">
        </div>
      </div>
      
      <div class="form-group">
        <label class="form-label">Job Type</label>
        <select id="job-type" class="form-select">
          <option value="Full Time">Full Time</option>
          <option value="Part Time">Part Time</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Job Description</label>
        <div class="editor-toolbar">
          <button type="button" onclick="document.execCommand('bold', false, null)"><i class="fa-solid fa-bold"></i></button>
          <button type="button" onclick="document.execCommand('italic', false, null)"><i class="fa-solid fa-italic"></i></button>
          <button type="button" onclick="document.execCommand('insertUnorderedList', false, null)"><i class="fa-solid fa-list-ul"></i></button>
        </div>
        <div class="rich-editor" id="job-desc" contenteditable="true" placeholder="Enter job requirements, schedules, and details here..."></div>
      </div>

      <button class="btn btn-primary btn-block" id="btn-save-job" onclick="saveJobPost()">Publish Job to Teachers</button>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwNnQ_Z0j9L5KU12ONFIsRVA2NnFDEna6TU4_-Tr1WaZQmNIdT0WL0A5WC0gsLxqvlj/exec";

    window.showToast = function(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-check' : 'fa-exclamation'}"></i> ${message}`;
      container.appendChild(toast);
      setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3500);
    };

    window.handleLogout = function() {
      if(window.auth && window.fb) window.fb.signOut(window.auth);
      window.location.href = 'index.html';
    };

    window.setupRealtimeJobs = function() {
      const jobsQuery = window.fb.query(window.fb.collection(window.db, "jobs"), window.fb.where("recruiterId", "==", window.currentUser.uid));
      
      window.fb.onSnapshot(jobsQuery, (snapshot) => {
        const container = document.getElementById('recruiter-jobs-container');
        document.getElementById('empty-jobs').style.display = 'none';
        container.innerHTML = '';
        
        if (snapshot.empty) {
          container.innerHTML = `
            <div style="text-align:center; padding: 3rem; color:var(--text-muted);" id="empty-jobs">
              <i class="fa-solid fa-briefcase" style="font-size: 3rem; margin-bottom: 1rem;"></i>
              <p>You haven't posted any jobs yet.</p>
            </div>`;
          return;
        }

        snapshot.forEach((docSnap) => {
          const job = { id: docSnap.id, ...docSnap.data() };
          
          const html = `
            <div class="job-list-item" style="background:var(--surface-white);">
              <div>
                <h3 style="margin-bottom:0.2rem; font-size:1.1rem; color:var(--primary-navy);">${job.title}</h3>
                <div class="job-status-toggle">
                   <span style="color:var(--success-green); font-weight:600;"><i class="fa-solid fa-circle" style="font-size:0.6rem;"></i> Live</span>
                   <span>|</span>
                   <span>${job.type || 'Full Time'}</span>
                   <span>|</span>
                   <span>${job.pay || 'Negotiable'}</span>
                </div>
              </div>
              <div style="display:flex; gap:0.5rem;">
                <button class="btn btn-danger btn-small" onclick="deleteJob('${job.id}')"><i class="fa-solid fa-trash"></i> Remove</button>
              </div>
            </div>
          `;
          container.insertAdjacentHTML('beforeend', html);
        });
      });
    };

    window.openJobEditor = function() {
      document.getElementById('job-editor-modal').classList.add('active');
      document.getElementById('job-title').value = '';
      document.getElementById('job-loc').value = '';
      document.getElementById('job-pay').value = '';
      document.getElementById('job-desc').innerHTML = '';
    };

    window.closeJobEditor = function() { 
      document.getElementById('job-editor-modal').classList.remove('active'); 
    };

    window.saveJobPost = async function() {
      const title = document.getElementById('job-title').value;
      if(!title) { showToast("Job Title is required", "error"); return; }
      const btn = document.getElementById('btn-save-job');
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Publishing...';
      
      const jobData = {
         title: title,
         location: document.getElementById('job-loc').value,
         pay: document.getElementById('job-pay').value,
         type: document.getElementById('job-type').value,
         description: document.getElementById('job-desc').innerHTML,
         recruiterId: window.currentUser.uid,
         companyName: window.currentUser.name,
         createdAt: window.fb.serverTimestamp()
      };

      try {
        await window.fb.addDoc(window.fb.collection(window.db, "jobs"), jobData);
        showToast("Job live! Teachers can now apply.", "success");
        closeJobEditor();
      } catch(e) {
        showToast("Failed to post job.", "error");
      } finally {
        btn.innerHTML = 'Publish Job to Teachers';
      }
    };

    window.deleteJob = async function(jobId) {
      if(confirm("Are you sure you want to remove this job posting?")) {
        try {
          await window.fb.deleteDoc(window.fb.doc(window.db, "jobs", jobId));
          showToast("Job removed.", "info");
        } catch(e) { showToast("Error deleting job.", "error"); }
      }
    };
  </script>
</body>
</html>
