<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Course Manager · TeacherBee Connect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --primary: #4F46E5; --primary-hover: #4338CA; --primary-light: #EEF2FF;
      --surface: #FFFFFF; --surface-alt: #F8FAFC; --bg-color: #F1F5F9;
      --text-main: #0F172A; --text-secondary: #334155; --text-muted: #64748B;
      --border: #E2E8F0; --danger: #EF4444; --success: #10B981;
      --radius-sm: 10px; --radius-md: 16px; --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
      --shadow-md: 0 8px 30px rgba(0,0,0,0.08);
      --transition: 0.15s ease;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--bg-color); color: var(--text-main); min-height: 100vh; line-height: 1.5; }
    .container { max-width: 1440px; margin: 0 auto; padding: 2rem 1.5rem; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
    .header h1 { font-size: 1.75rem; font-weight: 700; display: flex; align-items: center; gap: 0.75rem; }
    .badge-unread { background: var(--danger); color: #fff; border-radius: 20px; padding: 0.2rem 0.7rem; font-size: 0.75rem; font-weight: 700; margin-left: 0.5rem; display: none; }
    .badge-unread.visible { display: inline-flex; }
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 2rem; flex-wrap: wrap; }
    .tab {
      padding: 0.8rem 1.5rem; border-radius: var(--radius-sm); font-weight: 500; font-size: 0.95rem;
      cursor: pointer; border: 1.5px solid var(--border); background: var(--surface);
      color: var(--text-secondary); display: inline-flex; align-items: center; gap: 0.5rem;
      transition: var(--transition); white-space: nowrap;
    }
    .tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .tab:hover:not(.active) { background: var(--surface-alt); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .btn {
      padding: 0.7rem 1.4rem; border-radius: var(--radius-sm); font-weight: 500; font-size: 0.9rem;
      cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 0.5rem;
      transition: var(--transition); text-decoration: none;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
    .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text-secondary); }
    .btn-outline:hover { background: var(--surface-alt); }
    .btn-danger { background: #FEF2F2; color: var(--danger); }
    .btn-danger:hover { background: var(--danger); color: #fff; }
    .btn-sm { padding: 0.4rem 0.9rem; font-size: 0.8rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.75rem; }
    .course-card {
      background: var(--surface); border-radius: var(--radius-md); border: 1px solid var(--border);
      box-shadow: var(--shadow-sm); overflow: hidden; display: flex; flex-direction: column;
      transition: var(--transition);
    }
    .course-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
    .course-card img { width: 100%; height: 160px; object-fit: cover; }
    .card-body { padding: 1.5rem; flex: 1; display: flex; flex-direction: column; }
    .card-body h3 { font-weight: 700; margin-bottom: 0.35rem; font-size: 1.25rem; }
    .badge {
      display: inline-block; padding: 0.25rem 0.75rem; border-radius: 20px;
      font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .badge-workshop { background: #EEF2FF; color: var(--primary); }
    .badge-tefl { background: #D1FAE5; color: #065F46; }
    .card-actions { display: flex; gap: 0.5rem; margin-top: 1.25rem; flex-wrap: wrap; }

    /* Modals */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15,23,42,0.65); backdrop-filter: blur(4px);
      z-index: 1000; display: none; justify-content: center; align-items: flex-start;
      padding: 2rem 1rem; overflow-y: auto;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--surface); border-radius: var(--radius-md); max-width: 720px; width: 100%;
      padding: 2.5rem; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.15); margin: auto;
    }
    .modal-close { position: absolute; top: 1.25rem; right: 1.25rem; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-muted); }
    .modal-close:hover { color: var(--text-main); }

    .form-group { margin-bottom: 1.4rem; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.3px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 0.85rem 1rem; border: 1.5px solid var(--border);
      border-radius: var(--radius-sm); font-size: 0.95rem; background: var(--surface-alt);
      font-family: inherit; transition: var(--transition);
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,0.08); background: #fff;
    }
    .editor-toolbar { display: flex; gap: 0.4rem; margin-bottom: 0.7rem; flex-wrap: wrap; }
    .editor-toolbar button {
      background: var(--surface-alt); border: 1px solid var(--border); border-radius: 6px;
      padding: 0.45rem 0.7rem; cursor: pointer; font-size: 0.9rem; font-weight: 500; transition: var(--transition);
    }
    .editor-toolbar button:hover { background: var(--primary-light); }
    .editor-content {
      border: 1.5px solid var(--border); border-radius: var(--radius-sm); min-height: 180px;
      padding: 1rem; background: white; outline: none; font-size: 1rem; line-height: 1.6;
    }

    /* Attachment row (compact) */
    .attachment-row {
      display: flex; align-items: center; gap: 0.5rem; background: var(--surface-alt);
      padding: 0.5rem 0.8rem; border-radius: var(--radius-sm); margin-bottom: 0.5rem;
      border: 1px solid var(--border); flex-wrap: wrap;
    }
    .attachment-row .file-icon { color: var(--text-muted); }
    .attachment-row input.rename {
      width: 120px; padding: 0.4rem; border: 1px solid var(--border); border-radius: 4px; font-size: 0.8rem;
    }
    .attachment-row input.instruction {
      flex: 1; padding: 0.4rem; border: 1px solid var(--border); border-radius: 4px; font-size: 0.8rem;
    }
    .attachment-row .btn-sm { padding: 0.2rem 0.5rem; }

    .quiz-builder { background: var(--surface-alt); border-radius: var(--radius-sm); padding: 1.5rem; margin: 1.25rem 0; }
    .quiz-question { margin-bottom: 1.2rem; border-left: 4px solid var(--primary); padding: 0.9rem; background: #fff; border-radius: 0 8px 8px 0; }
    .module-list { display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem; }
    .module-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 1.25rem; display: flex; justify-content: space-between; align-items: center;
      transition: var(--transition);
    }
    .module-card:hover { box-shadow: var(--shadow-sm); }

    /* Payments cards */
    .payments-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.5rem; }
    .payment-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);
      padding: 1.5rem; box-shadow: var(--shadow-sm);
    }
    .payment-card .customer-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
    .payment-card .avatar {
      width: 48px; height: 48px; border-radius: 50%; background: var(--primary-light);
      display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--primary); overflow: hidden;
    }
    .payment-card .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .status-badge { display: inline-block; padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
    .status-pending { background: #FEF3C7; color: #92400E; }
    .status-approved { background: #D1FAE5; color: #065F46; }
    .status-rejected { background: #FEE2E2; color: #991B1B; }

    /* Preview modals (inbox style) */
    .preview-modal {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75); z-index: 10000; align-items: center; justify-content: center; flex-direction: column;
    }
    .preview-modal.active { display: flex; }
    .preview-modal-content {
      background: #fff; border-radius: 12px; width: 90vw; height: 90vh;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .preview-modal-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 20px; border-bottom: 1px solid var(--border);
      background: var(--primary); color: #fff;
    }
    .preview-modal-header h3 { font-size: 1rem; }
    .preview-modal-header button { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }
    .preview-modal-iframe { flex: 1; border: none; }
    .image-modal {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.9); z-index: 10001; flex-direction: column; align-items: center; justify-content: center;
    }
    .image-modal.active { display: flex; }
    .image-modal-img { max-width: 90vw; max-height: 80vh; border-radius: 8px; }

    .toast-container { position: fixed; top: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 12px; }
    .toast { padding: 14px 24px; border-radius: 10px; color: #fff; font-weight: 500; font-size: 0.9rem; animation: slideIn 0.3s; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
    .toast.success { background: #059669; }
    .toast.error { background: #DC2626; }
    .toast.info { background: #1E293B; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    @media (max-width: 768px) {
      .container { padding: 1rem; }
      .modal { padding: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1><i class="fa-solid fa-chalkboard-user" style="color:var(--primary);"></i> Course Manager</h1>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="courses"><i class="fa-solid fa-list"></i> Courses <span class="badge-unread" id="courses-badge">0</span></div>
      <div class="tab" data-tab="builder" id="builder-tab" style="display:none;"><i class="fa-solid fa-puzzle-piece"></i> Module Builder</div>
      <div class="tab" data-tab="payments"><i class="fa-solid fa-file-invoice-dollar"></i> Payments <span class="badge-unread" id="payments-badge">0</span></div>
    </div>

    <!-- COURSES TAB -->
    <div class="tab-content active" id="content-courses">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
        <h2 style="font-size:1.5rem; font-weight:700;">All Courses</h2>
        <button class="btn btn-primary" onclick="openCreateModal()"><i class="fa-solid fa-plus"></i> New Course</button>
      </div>
      <div class="grid" id="courses-grid"></div>
    </div>

    <!-- MODULE BUILDER TAB -->
    <div class="tab-content" id="content-builder">
      <div style="display:flex; align-items:center; gap:1rem; margin-bottom:1.5rem;">
        <button class="btn btn-outline" onclick="switchTab('courses')"><i class="fa-solid fa-arrow-left"></i> Back</button>
        <h2 id="builder-course-title" style="font-size:1.5rem; font-weight:700;">Module Builder</h2>
      </div>
      <button class="btn btn-primary" onclick="openModuleModal()"><i class="fa-solid fa-plus"></i> Add Module</button>
      <div class="module-list" id="modules-list"></div>
    </div>

    <!-- PAYMENTS TAB -->
    <div class="tab-content" id="content-payments">
      <h2 style="font-size:1.5rem; font-weight:700; margin-bottom:1.5rem;">Course Payments</h2>
      <div style="display:flex; gap:1rem; margin-bottom:1.5rem; flex-wrap:wrap;">
        <select id="filter-type" onchange="renderPayments()" style="padding:0.7rem 1rem; border:1.5px solid var(--border); border-radius:var(--radius-sm);">
          <option value="all">All Types</option>
          <option value="workshop">Workshop</option>
          <option value="tefl">TEFL</option>
        </select>
        <select id="filter-status" onchange="renderPayments()" style="padding:0.7rem 1rem; border:1.5px solid var(--border); border-radius:var(--radius-sm);">
          <option value="pending" selected>Pending</option>
          <option value="all">All Status</option>
          <option value="approved">Approved</option>
          <option value="rejected">Rejected</option>
        </select>
      </div>
      <div class="payments-grid" id="payments-grid"></div>
    </div>

    <!-- CREATE/EDIT COURSE MODAL -->
    <div class="modal-overlay" id="course-modal">
      <div class="modal">
        <button class="modal-close" onclick="closeModal('course-modal')"><i class="fa-solid fa-times"></i></button>
        <h2 id="course-modal-title">Create Course</h2>
        <form id="course-form" onsubmit="return false;">
          <input type="hidden" id="course-id" />
          <div class="form-group"><label>Title *</label><input type="text" id="course-title" required /></div>
          <div class="form-group"><label>Category *</label><select id="course-category"><option value="workshop">Workshop</option><option value="tefl">TEFL</option></select></div>
          <div class="form-group"><label>Price (USD) *</label><input type="number" id="course-price" min="0" step="0.01" required /></div>
          <div class="form-group"><label>Description</label><textarea id="course-description" rows="3"></textarea></div>
          <div class="form-group">
            <label>Thumbnail</label>
            <input type="file" id="thumbnail-input" accept="image/*" onchange="uploadThumbnail(this)" />
            <div id="thumbnail-preview" style="margin-top:0.7rem; max-width:200px;"></div>
          </div>
          <div class="form-group"><label>Start Date</label><input type="date" id="course-start-date" /></div>
          <div class="form-group"><label>Status</label><select id="course-status"><option value="published">Published</option><option value="draft">Draft</option><option value="closed">Closed</option></select></div>
          <button type="button" class="btn btn-primary" style="width:100%;" onclick="saveCourse()">Save Course</button>
        </form>
      </div>
    </div>

    <!-- MODULE EDITOR MODAL -->
    <div class="modal-overlay" id="module-modal">
      <div class="modal" style="max-width:850px;">
        <button class="modal-close" onclick="closeModal('module-modal')"><i class="fa-solid fa-times"></i></button>
        <h2 id="module-modal-title">New Module</h2>
        <form id="module-form" onsubmit="return false;">
          <input type="hidden" id="module-id" />
          <div class="form-group"><label>Title *</label><input type="text" id="module-title" required /></div>
          <div class="form-group">
            <label>Content</label>
            <div class="editor-toolbar">
              <button type="button" onclick="formatDoc('bold')"><b>B</b></button>
              <button type="button" onclick="formatDoc('italic')"><i>I</i></button>
              <button type="button" onclick="formatDoc('underline')"><u>U</u></button>
              <button type="button" onclick="formatDoc('insertUnorderedList')">• List</button>
            </div>
            <div class="editor-content" id="module-content" contenteditable="true"></div>
          </div>
          <div class="form-group">
            <label>Attachments</label>
            <input type="file" id="module-attachment-input" onchange="uploadModuleFile(this)" multiple />
            <div id="module-attachments" style="margin-top:0.5rem;"></div>
          </div>
          <div class="quiz-builder">
            <h4>Quiz (optional)</h4>
            <div id="quiz-questions"></div>
            <button type="button" class="btn btn-outline" onclick="addQuizQuestion()"><i class="fa-solid fa-plus"></i> Add Question</button>
          </div>
          <button type="button" class="btn btn-primary" style="width:100%; margin-top:1rem;" onclick="saveModule()">Save Module</button>
        </form>
      </div>
    </div>

    <!-- COURSE PREVIEW MODAL (basic info) -->
    <div class="modal-overlay" id="course-preview-modal">
      <div class="modal" style="max-width:500px; text-align:center;">
        <button class="modal-close" onclick="closeModal('course-preview-modal')"><i class="fa-solid fa-times"></i></button>
        <img id="preview-thumb" src="" style="max-width:100%; border-radius:12px; margin-bottom:1rem;" />
        <h2 id="preview-title"></h2>
        <p style="color:var(--text-muted); margin:0.5rem 0;" id="preview-desc"></p>
        <p style="font-weight:700; font-size:1.2rem;">$<span id="preview-price"></span></p>
        <p id="preview-date" style="color:var(--text-secondary);"></p>
        <p><span class="status-badge" id="preview-status"></span></p>
      </div>
    </div>

    <!-- DOCUMENT PREVIEW MODAL (inbox) -->
    <div class="preview-modal" id="previewModal">
      <div class="preview-modal-content">
        <div class="preview-modal-header">
          <h3 id="previewModalTitle">Document Preview</h3>
          <button onclick="closePreviewModal()">&times;</button>
        </div>
        <iframe id="previewIframe" class="preview-modal-iframe" src="" allowfullscreen></iframe>
      </div>
    </div>

    <!-- IMAGE PREVIEW MODAL (inbox) -->
    <div class="image-modal" id="imageModal">
      <img id="imageModalImg" class="image-modal-img" src="" alt="" />
      <div style="margin-top:1.5rem; display:flex; gap:1rem;">
        <a id="imageModalDownload" class="btn btn-primary" href="#" download>Download</a>
        <button class="btn btn-outline" onclick="closeImageModal()" style="color:#fff; border-color:rgba(255,255,255,0.5);">Close</button>
      </div>
    </div>

    <div class="toast-container" id="toast-container"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, serverTimestamp, collection, addDoc, query, getDocs, orderBy, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBMKjt1RUZXVxTmadiCqKhNbzSPsNUDxV8",
      authDomain: "teacherbee-connect.firebaseapp.com",
      projectId: "teacherbee-connect",
      storageBucket: "teacherbee-connect.firebasestorage.app",
      messagingSenderId: "345613317767",
      appId: "1:345613317767:web:555713e479f9837e84aa22"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwNnQ_Z0j9L5KU12ONFIsRVA2NnFDEna6TU4_-Tr1WaZQmNIdT0WL0A5WC0gsLxqvlj/exec";

    let currentAdmin = null;
    let allCourses = [];
    let currentCourseId = null;
    let modules = [];
    let tempAttachments = [];
    let allPayments = [];
    const userCache = {};

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'admin.html'; return; }
      const adminDoc = await getDoc(doc(db, 'admins', user.uid));
      if (!adminDoc.exists()) { await signOut(auth); window.location.href = 'admin.html'; return; }
      currentAdmin = user;
      loadCourses();
      listenForPayments();
    });

    window.switchTab = (tabName) => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.querySelector(`.tab[data-tab="${tabName}"]`).classList.add('active');
      document.getElementById(`content-${tabName}`).classList.add('active');
      if (tabName === 'builder') loadModules();
      if (tabName === 'payments') renderPayments();
    };
    document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));

    // ────── COURSES ──────
    async function loadCourses() {
      const q = query(collection(db, 'courses'), orderBy('createdAt', 'desc'));
      const snap = await getDocs(q);
      allCourses = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderCoursesGrid();
    }

    function renderCoursesGrid() {
      const grid = document.getElementById('courses-grid');
      if (allCourses.length === 0) {
        grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:2rem;">No courses yet.</div>';
        return;
      }
      grid.innerHTML = allCourses.map(c => {
        const thumb = c.thumbnailUrl ? `<img src="${c.thumbnailUrl}" />` : '';
        const catBadge = c.category === 'tefl' ? 'badge-tefl' : 'badge-workshop';
        return `
          <div class="course-card">
            ${thumb}
            <div class="card-body">
              <span class="badge ${catBadge}">${c.category}</span>
              <h3>${escapeHTML(c.title)}</h3>
              <p style="color:var(--text-muted); font-size:0.9rem;">$${c.price} · ${c.enrolledCount || 0} enrolled</p>
              <div class="card-actions">
                <button class="btn btn-outline btn-sm" onclick="editCourse('${c.id}')">Edit</button>
                <button class="btn btn-primary btn-sm" onclick="openBuilder('${c.id}')">Modules</button>
                <button class="btn btn-outline btn-sm" onclick="previewCourse('${c.id}')"><i class="fa-solid fa-eye"></i> Preview</button>
                <button class="btn btn-danger btn-sm" onclick="deleteCourse('${c.id}')">Delete</button>
              </div>
            </div>
          </div>`;
      }).join('');
    }

    window.openCreateModal = () => {
      resetCourseForm();
      document.getElementById('course-modal-title').textContent = 'Create Course';
      document.getElementById('course-modal').classList.add('active');
    };
    window.editCourse = (courseId) => {
      const course = allCourses.find(c => c.id === courseId);
      if (!course) return;
      document.getElementById('course-modal-title').textContent = 'Edit Course';
      document.getElementById('course-id').value = courseId;
      document.getElementById('course-title').value = course.title || '';
      document.getElementById('course-category').value = course.category || 'workshop';
      document.getElementById('course-price').value = course.price || 0;
      document.getElementById('course-description').value = course.description || '';
      document.getElementById('course-status').value = course.status || 'published';
      document.getElementById('course-start-date').value = course.startDate ? course.startDate.toDate().toISOString().split('T')[0] : '';
      document.getElementById('thumbnail-preview').innerHTML = course.thumbnailUrl ? `<img src="${course.thumbnailUrl}" style="max-width:200px; border-radius:8px;" />` : '';
      document.getElementById('course-modal').classList.add('active');
    };
    function resetCourseForm() {
      document.getElementById('course-form').reset();
      document.getElementById('course-id').value = '';
      document.getElementById('thumbnail-preview').innerHTML = '';
    }
    window.closeModal = (modalId) => document.getElementById(modalId).classList.remove('active');

    // ────── THUMBNAIL UPLOAD (inbox logic) ──────
    window.uploadThumbnail = async (input) => {
      const file = input.files[0];
      if (!file) return;
      const toast = showToast(`Uploading ${file.name}…`, 'info');
      try {
        const uploaded = await uploadToDrive(file);
        document.getElementById('thumbnail-preview').innerHTML = `<img src="${uploaded.url}" style="max-width:200px; border-radius:8px;" />`;
        window._thumbUrl = uploaded.url;
        toast.remove();
        showToast('Thumbnail uploaded!', 'success');
      } catch (e) {
        toast.remove();
        showToast('Upload failed – please check your connection', 'error');
      }
      input.value = '';
    };

    // ────── MODULE FILE UPLOAD ──────
    window.uploadModuleFile = async (input) => {
      const files = input.files;
      if (!files.length) return;
      for (let file of files) {
        const toast = showToast(`Uploading ${file.name}…`, 'info');
        try {
          const uploaded = await uploadToDrive(file);
          tempAttachments.push({ ...uploaded, newName: file.name, instructions: '' });
          renderTempAttachments();
          toast.remove();
          showToast('Upload complete!', 'success');
        } catch (e) {
          toast.remove();
          showToast('Upload failed', 'error');
        }
      }
      input.value = '';
    };

    async function uploadToDrive(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = async (e) => {
          const payload = {
            action: 'uploadCertificate',
            fileName: file.name,
            mimeType: file.type || 'application/octet-stream',
            file: e.target.result
          };
          try {
            const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
            const data = await res.json();
            if (data.status === 'success' && data.certificates?.length > 0) {
              const cert = data.certificates[0];
              resolve({ url: cert.fileUrl || cert.url, driveId: cert.id, name: file.name });
            } else {
              reject(new Error(data.message || 'Upload failed'));
            }
          } catch (err) { reject(err); }
        };
        reader.onerror = () => reject(new Error('Read error'));
        reader.readAsDataURL(file);
      });
    }

    function renderTempAttachments() {
      const container = document.getElementById('module-attachments');
      container.innerHTML = tempAttachments.map((att, i) => `
        <div class="attachment-row">
          <i class="fa-solid fa-paperclip file-icon"></i>
          <span style="flex:1; word-break:break-all; font-size:0.9rem;">${escapeHTML(att.newName || att.name)}</span>
          <input type="text" class="rename" placeholder="Rename" value="${escapeHTML(att.newName || att.name)}" onchange="updateAttachmentName(${i}, this.value)" />
          <input type="text" class="instruction" placeholder="Instructions" value="${escapeHTML(att.instructions || '')}" onchange="updateAttachmentInstruction(${i}, this.value)" />
          <button class="btn btn-danger btn-sm" onclick="removeTempAttachment(${i})">✕</button>
        </div>
      `).join('');
    }
    window.updateAttachmentName = (i, val) => { if (tempAttachments[i]) tempAttachments[i].newName = val; };
    window.updateAttachmentInstruction = (i, val) => { if (tempAttachments[i]) tempAttachments[i].instructions = val; };
    window.removeTempAttachment = (i) => { tempAttachments.splice(i, 1); renderTempAttachments(); };

    // ────── SAVE COURSE ──────
    window.saveCourse = async () => {
      const title = document.getElementById('course-title').value.trim();
      const category = document.getElementById('course-category').value;
      const price = parseFloat(document.getElementById('course-price').value);
      const description = document.getElementById('course-description').value.trim();
      const status = document.getElementById('course-status').value;
      const startDate = document.getElementById('course-start-date').value;
      const thumbnailUrl = window._thumbUrl || document.querySelector('#thumbnail-preview img')?.src || '';
      if (!title || isNaN(price)) { showToast('Title and price required', 'error'); return; }
      const courseData = { title, category, price, description, thumbnailUrl, status, startDate: startDate ? new Date(startDate) : null, updatedAt: serverTimestamp() };
      const courseId = document.getElementById('course-id').value;
      try {
        if (courseId) {
          await updateDoc(doc(db, 'courses', courseId), courseData);
        } else {
          courseData.createdAt = serverTimestamp();
          courseData.enrolledCount = 0;
          const docRef = await addDoc(collection(db, 'courses'), courseData);
          document.getElementById('course-modal').classList.remove('active');
          openBuilder(docRef.id);
        }
        closeModal('course-modal');
        loadCourses();
        showToast('Course saved!', 'success');
      } catch (e) { showToast('Error saving course', 'error'); }
    };

    window.deleteCourse = async (courseId) => {
      if (!confirm('Delete course and all modules?')) return;
      await deleteDoc(doc(db, 'courses', courseId));
      loadCourses();
      showToast('Course deleted.', 'info');
    };

    // ────── COURSE PREVIEW (basic info only) ──────
    window.previewCourse = (courseId) => {
      const course = allCourses.find(c => c.id === courseId);
      if (!course) return;
      document.getElementById('preview-thumb').src = course.thumbnailUrl || '';
      document.getElementById('preview-title').textContent = course.title;
      document.getElementById('preview-desc').textContent = course.description || '';
      document.getElementById('preview-price').textContent = course.price;
      document.getElementById('preview-date').textContent = course.startDate ? 'Starts: ' + course.startDate.toDate().toLocaleDateString() : 'No start date';
      const statusEl = document.getElementById('preview-status');
      statusEl.textContent = course.status;
      statusEl.className = 'status-badge status-' + (course.status === 'published' ? 'approved' : course.status === 'draft' ? 'pending' : 'rejected');
      document.getElementById('course-preview-modal').classList.add('active');
    };

    // ────── MODULE BUILDER ──────
    window.openBuilder = async (courseId) => {
      currentCourseId = courseId;
      const course = allCourses.find(c => c.id === courseId);
      document.getElementById('builder-course-title').textContent = `Module Builder: ${course?.title || ''}`;
      document.getElementById('builder-tab').style.display = 'flex';
      switchTab('builder');
      await loadModules();
    };

    async function loadModules() {
      if (!currentCourseId) return;
      const q = query(collection(db, `courses/${currentCourseId}/modules`), orderBy('order', 'asc'));
      const snap = await getDocs(q);
      modules = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderModules();
    }

    function renderModules() {
      const container = document.getElementById('modules-list');
      if (modules.length === 0) {
        container.innerHTML = '<p style="color:var(--text-muted);">No modules yet.</p>';
        return;
      }
      container.innerHTML = modules.map((m, i) => `
        <div class="module-card">
          <div>
            <h3>Module ${i+1}: ${escapeHTML(m.title)}</h3>
            <p style="font-size:0.85rem; color:var(--text-muted);">${m.quiz?.length||0} quiz · ${m.attachments?.length||0} files</p>
          </div>
          <div style="display:flex; gap:0.5rem;">
            <button class="btn btn-outline btn-sm" onclick="editModule('${m.id}')">Edit</button>
            <button class="btn btn-danger btn-sm" onclick="deleteModule('${m.id}')">Delete</button>
          </div>
        </div>
      `).join('');
    }

    window.openModuleModal = (moduleId = null) => {
      document.getElementById('module-modal-title').textContent = moduleId ? 'Edit Module' : 'New Module';
      document.getElementById('module-form').reset();
      document.getElementById('module-id').value = moduleId || '';
      document.getElementById('module-content').innerHTML = '';
      document.getElementById('module-attachments').innerHTML = '';
      document.getElementById('quiz-questions').innerHTML = '';
      tempAttachments = [];

      if (moduleId) {
        const mod = modules.find(m => m.id === moduleId);
        if (mod) {
          document.getElementById('module-title').value = mod.title || '';
          document.getElementById('module-content').innerHTML = mod.content || '';
          if (mod.attachments) {
            tempAttachments = mod.attachments.map(a => ({ ...a, newName: a.name, instructions: a.instructions || '' }));
            renderTempAttachments();
          }
          if (mod.quiz) mod.quiz.forEach((q, qi) => renderQuizQuestion(q, qi));
        }
      }
      document.getElementById('module-modal').classList.add('active');
    };
    window.editModule = (moduleId) => openModuleModal(moduleId);

    window.formatDoc = (cmd) => { document.execCommand(cmd, false, null); document.getElementById('module-content').focus(); };

    // Quiz
    window.addQuizQuestion = () => renderQuizQuestion({ question: '', options: [''], correctIndex: 0 }, document.querySelectorAll('#quiz-questions .quiz-question').length);
    function renderQuizQuestion(q, index) {
      const container = document.getElementById('quiz-questions');
      const div = document.createElement('div');
      div.className = 'quiz-question';
      const radioName = `correct-${Date.now()}-${Math.random()}`;
      div.innerHTML = `
        <p><strong>Q${index+1}:</strong> <input type="text" class="quiz-q-input" value="${escapeHTML(q.question)}" placeholder="Question" /></p>
        <div class="quiz-options">
          ${q.options.map((opt, oi) => `
            <div class="quiz-option-row">
              <input type="text" class="quiz-opt-input" value="${escapeHTML(opt)}" placeholder="Option ${String.fromCharCode(65+oi)}" />
              <label><input type="radio" name="${radioName}" value="${oi}" ${oi === q.correctIndex ? 'checked' : ''} /> Correct</label>
            </div>
          `).join('')}
        </div>
        <div style="margin-top:0.5rem;">
          <button type="button" class="btn btn-outline btn-sm" onclick="addOptionToQuestion(this)">+ Option</button>
          <button type="button" class="btn btn-danger btn-sm" onclick="removeQuizQuestion(this)">Remove</button>
        </div>
      `;
      container.appendChild(div);
    }
    window.addOptionToQuestion = (btn) => {
      const qDiv = btn.closest('.quiz-question');
      const optionsDiv = qDiv.querySelector('.quiz-options');
      const radioName = qDiv.querySelector('input[type="radio"]').name;
      const optCount = optionsDiv.querySelectorAll('.quiz-opt-input').length;
      const row = document.createElement('div');
      row.className = 'quiz-option-row';
      row.innerHTML = `<input type="text" class="quiz-opt-input" placeholder="Option ${String.fromCharCode(65+optCount)}" /><label><input type="radio" name="${radioName}" value="${optCount}" /> Correct</label>`;
      optionsDiv.appendChild(row);
    };
    window.removeQuizQuestion = (btn) => btn.closest('.quiz-question').remove();

    window.saveModule = async () => {
      const title = document.getElementById('module-title').value.trim();
      const content = document.getElementById('module-content').innerHTML;
      if (!title) { showToast('Module title required', 'error'); return; }

      const quizQuestions = [];
      document.querySelectorAll('#quiz-questions .quiz-question').forEach(qDiv => {
        const question = qDiv.querySelector('.quiz-q-input')?.value.trim();
        const options = [...qDiv.querySelectorAll('.quiz-opt-input')].map(inp => inp.value.trim());
        const correctRadio = qDiv.querySelector('input[type="radio"]:checked');
        if (question && options.length) quizQuestions.push({ question, options, correctIndex: correctRadio ? parseInt(correctRadio.value) : 0 });
      });

      const moduleData = {
        title, content,
        attachments: tempAttachments.map(a => ({ name: a.newName || a.name, url: a.url, driveId: a.driveId, type: a.type, instructions: a.instructions })),
        quiz: quizQuestions,
        order: modules.length
      };

      try {
        const moduleId = document.getElementById('module-id').value;
        if (moduleId) {
          await updateDoc(doc(db, `courses/${currentCourseId}/modules`, moduleId), moduleData);
        } else {
          await addDoc(collection(db, `courses/${currentCourseId}/modules`), moduleData);
        }
        showToast('Module saved!', 'success');
        closeModal('module-modal');
        loadModules();
      } catch (e) { showToast('Error saving module', 'error'); }
    };

    window.deleteModule = async (moduleId) => {
      if (!confirm('Delete this module?')) return;
      await deleteDoc(doc(db, `courses/${currentCourseId}/modules`, moduleId));
      loadModules();
      showToast('Module deleted.', 'info');
    };

    // ────── PAYMENTS ──────
    function listenForPayments() {
      const q = query(collection(db, 'payments'), where('type', 'in', ['workshop', 'tefl']), orderBy('createdAt', 'desc'));
      onSnapshot(q, async (snap) => {
        allPayments = [];
        let pendingCount = 0;
        for (let docSnap of snap.docs) {
          const data = docSnap.data();
          if (!userCache[data.userId] && data.userId) {
            const userDoc = await getDoc(doc(db, 'users', data.userId));
            if (userDoc.exists()) userCache[data.userId] = userDoc.data();
          }
          if (!data.courseName && data.itemId) {
            const courseDoc = await getDoc(doc(db, 'courses', data.itemId));
            data.courseName = courseDoc.exists() ? courseDoc.data().title : 'Unknown';
          }
          allPayments.push({ id: docSnap.id, ...data });
          if (data.status === 'pending') pendingCount++;
        }
        updateBadges(pendingCount);
        if (document.getElementById('content-payments').classList.contains('active')) renderPayments();
      });
    }

    function updateBadges(count) {
      ['payments-badge','courses-badge'].forEach(id => {
        const el = document.getElementById(id);
        el.textContent = count;
        el.classList.toggle('visible', count > 0);
      });
    }

    function renderPayments() {
      const type = document.getElementById('filter-type').value;
      const status = document.getElementById('filter-status').value;
      let filtered = allPayments;
      if (type !== 'all') filtered = filtered.filter(p => p.type === type);
      if (status !== 'all') filtered = filtered.filter(p => p.status === status);
      const grid = document.getElementById('payments-grid');
      if (filtered.length === 0) {
        grid.innerHTML = '<p style="color:var(--text-muted);">No payments found.</p>';
        return;
      }
      grid.innerHTML = filtered.map(p => {
        const cust = p.customer || {};
        const user = userCache[p.userId] || {};
        const avatarUrl = user.avatarUrl;
        const initials = (cust.name || '?').charAt(0).toUpperCase();
        const avatarHTML = avatarUrl ? `<img src="${avatarUrl}" />` : initials;
        return `
          <div class="payment-card">
            <div class="customer-row">
              <div class="avatar">${avatarHTML}</div>
              <div>
                <strong>${escapeHTML(cust.name || 'N/A')}</strong>
                <div style="color:var(--text-muted); font-size:0.85rem;">${escapeHTML(cust.email || '')}</div>
              </div>
              <span class="status-badge status-${p.status}" style="margin-left:auto;">${p.status}</span>
            </div>
            <div style="margin:0.8rem 0;">
              <div><span style="color:var(--text-muted);">Invoice:</span> #${p.id.substring(0,8).toUpperCase()}</div>
              <div><span style="color:var(--text-muted);">Course:</span> ${escapeHTML(p.courseName || 'Loading...')}</div>
              <div><strong>$${p.amount || 0}</strong></div>
            </div>
            <div style="display:flex; gap:0.5rem;">
              ${p.status === 'pending' ? `<button class="btn btn-sm" style="background:var(--success); color:#fff;" onclick="approvePayment('${p.id}')">Approve</button><button class="btn btn-sm" style="background:var(--danger); color:#fff;" onclick="rejectPayment('${p.id}')">Reject</button>` : ''}
              <button class="btn btn-sm" style="color:var(--danger); border:1px solid var(--danger);" onclick="deletePayment('${p.id}')">Delete</button>
            </div>
          </div>
        `;
      }).join('');
    }

    window.approvePayment = async (paymentId) => {
      if (!confirm('Approve payment?')) return;
      const payment = allPayments.find(p => p.id === paymentId);
      if (!payment) return;
      await updateDoc(doc(db, 'payments', paymentId), { status: 'approved', approvedBy: currentAdmin.uid, approvedAt: serverTimestamp() });
      const enrollmentQuery = query(collection(db, 'course_enrollments'), where('paymentId', '==', paymentId));
      const enrollSnap = await getDocs(enrollmentQuery);
      enrollSnap.forEach(async (enrollmentDoc) => await updateDoc(doc(db, 'course_enrollments', enrollmentDoc.id), { status: 'active', activatedAt: serverTimestamp() }));
      if (payment.itemId) {
        const courseRef = doc(db, 'courses', payment.itemId);
        const courseSnap = await getDoc(courseRef);
        if (courseSnap.exists()) await updateDoc(courseRef, { enrolledCount: (courseSnap.data().enrolledCount||0) + 1 });
      }
      showToast('Payment approved!', 'success');
    };
    window.rejectPayment = async (paymentId) => {
      if (!confirm('Reject payment?')) return;
      await updateDoc(doc(db, 'payments', paymentId), { status: 'rejected', rejectedBy: currentAdmin.uid, rejectedAt: serverTimestamp() });
      showToast('Payment rejected.', 'info');
    };
    window.deletePayment = async (paymentId) => {
      if (!confirm('Delete invoice?')) return;
      await deleteDoc(doc(db, 'payments', paymentId));
      showToast('Invoice deleted.', 'success');
    };

    // ────── PREVIEW MODALS (inbox) ──────
    window.openPreviewModal = (url, fileName) => {
      document.getElementById('previewModalTitle').textContent = fileName || 'Document Preview';
      document.getElementById('previewIframe').src = url;
      document.getElementById('previewModal').classList.add('active');
    };
    window.closePreviewModal = () => {
      document.getElementById('previewIframe').src = '';
      document.getElementById('previewModal').classList.remove('active');
    };
    window.openImageModal = (downloadUrl, imageUrl) => {
      document.getElementById('imageModalImg').src = imageUrl;
      document.getElementById('imageModalDownload').href = downloadUrl;
      document.getElementById('imageModal').classList.add('active');
    };
    window.closeImageModal = () => {
      document.getElementById('imageModalImg').src = '';
      document.getElementById('imageModal').classList.remove('active');
    };

    function showToast(msg, type='info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = msg;
      container.appendChild(toast);
      setTimeout(() => { if (toast.parentNode) toast.remove(); }, 4000);
      return toast;
    }
    function escapeHTML(str) { const d = document.createElement('div'); d.textContent = str || ''; return d.innerHTML; }
  </script>
</body>
</html>
