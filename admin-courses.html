<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Course Manager · TeacherBee Connect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    /* ── Same variables and base styles as before ── */
    :root {
      --primary: #4F46E5; --primary-hover: #4338CA; --primary-light: #EEF2FF;
      --surface: #FFFFFF; --surface-alt: #F8FAFC; --bg-color: #F1F5F9;
      --text-main: #0F172A; --text-secondary: #334155; --text-muted: #64748B;
      --border: #E2E8F0; --danger: #EF4444; --success: #10B981; --warning: #F59E0B;
      --radius-sm: 10px; --radius-md: 16px;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.04); --shadow-md: 0 8px 30px rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif; background: var(--bg-color);
      color: var(--text-main); min-height: 100vh; line-height: 1.5; font-size: 1rem;
    }
    .container { max-width: 1440px; margin: 0 auto; padding: 2rem 1.5rem; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
    .header h1 { font-size: 1.75rem; font-weight: 700; display: flex; align-items: center; gap: 0.75rem; }
    .badge-unread { background: var(--danger); color: #fff; border-radius: 20px; padding: 0.2rem 0.7rem; font-size: 0.75rem; font-weight: 700; margin-left: 0.5rem; display: none; }
    .badge-unread.visible { display: inline-flex; }
    /* Tabs */
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 2rem; flex-wrap: wrap; }
    .tab {
      padding: 0.8rem 1.5rem; border-radius: var(--radius-sm); font-weight: 500; font-size: 0.95rem;
      cursor: pointer; border: 1.5px solid var(--border); background: var(--surface);
      color: var(--text-secondary); display: inline-flex; align-items: center; gap: 0.5rem; transition: 0.15s; white-space: nowrap;
    }
    .tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .tab:hover:not(.active) { background: var(--surface-alt); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    /* Buttons */
    .btn {
      padding: 0.7rem 1.4rem; border-radius: var(--radius-sm); font-weight: 500; font-size: 0.9rem;
      cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 0.5rem;
      transition: 0.15s; text-decoration: none;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
    .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text-secondary); }
    .btn-outline:hover { background: var(--surface-alt); }
    .btn-danger { background: #FEF2F2; color: var(--danger); }
    .btn-danger:hover { background: var(--danger); color: #fff; }
    .btn-approve { background: var(--success); color: #fff; }
    .btn-reject { background: var(--danger); color: #fff; }
    .btn-delete { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
    .btn-sm { padding: 0.4rem 0.9rem; font-size: 0.8rem; }
    /* Course grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.75rem; }
    .course-card {
      background: var(--surface); border-radius: var(--radius-md); border: 1px solid var(--border);
      box-shadow: var(--shadow-sm); overflow: hidden; display: flex; flex-direction: column; transition: 0.15s;
    }
    .course-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
    .course-card img { width: 100%; height: 160px; object-fit: cover; }
    .card-body { padding: 1.5rem; flex: 1; display: flex; flex-direction: column; }
    .card-body h3 { font-weight: 700; margin-bottom: 0.35rem; font-size: 1.25rem; }
    .badge {
      display: inline-block; padding: 0.25rem 0.75rem; border-radius: 20px;
      font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .badge-workshop { background: #EEF2FF; color: var(--primary); }
    .badge-tefl { background: #D1FAE5; color: #065F46; }
    .card-actions { display: flex; gap: 0.5rem; margin-top: 1.25rem; flex-wrap: wrap; }
    /* Modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15,23,42,0.65); backdrop-filter: blur(4px);
      z-index: 1000; display: none; justify-content: center; align-items: flex-start;
      padding: 2rem 1rem; overflow-y: auto;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--surface); border-radius: var(--radius-md); max-width: 720px; width: 100%;
      padding: 2.5rem; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.15); margin: auto;
    }
    .modal-close {
      position: absolute; top: 1.25rem; right: 1.25rem; background: none; border: none;
      font-size: 1.5rem; cursor: pointer; color: var(--text-muted); transition: 0.15s;
    }
    .modal-close:hover { color: var(--text-main); }
    .form-group { margin-bottom: 1.4rem; }
    .form-group label {
      display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem;
      color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.3px;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 0.85rem 1rem; border: 1.5px solid var(--border);
      border-radius: var(--radius-sm); font-size: 0.95rem; background: var(--surface-alt);
      font-family: inherit; transition: 0.15s;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none; border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79,70,229,0.08); background: #fff;
    }
    .editor-toolbar { display: flex; gap: 0.4rem; margin-bottom: 0.7rem; flex-wrap: wrap; }
    .editor-toolbar button {
      background: var(--surface-alt); border: 1px solid var(--border); border-radius: 6px;
      padding: 0.45rem 0.7rem; cursor: pointer; font-size: 0.9rem; font-weight: 500; transition: 0.15s;
    }
    .editor-toolbar button:hover { background: var(--primary-light); }
    .editor-content {
      border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      min-height: 180px; padding: 1rem; background: white;
      outline: none; font-size: 1rem; line-height: 1.6;
    }
    .attachments { display: flex; flex-direction: column; gap: 0.8rem; margin: 1rem 0; }
    .attachment-row {
      display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap;
      background: var(--surface-alt); padding: 0.6rem 0.9rem; border-radius: 6px;
      border: 1px solid var(--border);
    }
    .attachment-row .file-name { flex: 1; font-weight: 500; word-break: break-all; }
    .attachment-row input.attachment-instruction {
      flex: 2; padding: 0.5rem; border: 1px solid var(--border); border-radius: 4px;
      font-size: 0.85rem;
    }
    .quiz-builder { background: var(--surface-alt); border-radius: var(--radius-sm); padding: 1.5rem; margin: 1.25rem 0; }
    .quiz-question {
      margin-bottom: 1.2rem; border-left: 4px solid var(--primary); padding-left: 1rem;
      background: #fff; border-radius: 0 8px 8px 0; padding: 0.9rem;
    }
    .quiz-question input[type="text"] { width: 100%; margin-bottom: 0.4rem; padding: 0.5rem; border: 1px solid var(--border); border-radius: 4px; }
    .quiz-option-row { display: flex; align-items: center; gap: 0.5rem; margin: 0.3rem 0; }
    /* Module list */
    .module-list { display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem; }
    .module-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 1.25rem; display: flex; justify-content: space-between; align-items: center; transition: 0.15s;
    }
    .module-card:hover { box-shadow: var(--shadow-sm); }
    .module-card h3 { font-size: 1.1rem; margin-bottom: 0.25rem; }
    /* Payments */
    .filters { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .filters select { padding: 0.7rem 1rem; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-size: 0.95rem; background: var(--surface); min-width: 150px; }
    .payments-table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: var(--radius-sm); overflow: hidden; box-shadow: var(--shadow-sm); }
    .payments-table th { text-align: left; padding: 1rem 1.2rem; background: var(--surface-alt); color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }
    .payments-table td { padding: 1rem 1.2rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    .status-badge { display: inline-block; padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
    .status-pending { background: #FEF3C7; color: #92400E; }
    .status-approved { background: #D1FAE5; color: #065F46; }
    .status-rejected { background: #FEE2E2; color: #991B1B; }
    /* Toast */
    .toast-container { position: fixed; top: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 12px; }
    .toast { padding: 14px 24px; border-radius: 10px; color: #fff; font-weight: 500; font-size: 0.9rem; animation: slideIn 0.3s ease; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
    .toast.success { background: #059669; }
    .toast.error { background: #DC2626; }
    .toast.info { background: #1E293B; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    /* Preview modal for modules */
    .preview-modal {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8); z-index: 10000; align-items: center; justify-content: center; flex-direction: column;
    }
    .preview-modal.active { display: flex; }
    .preview-modal-content {
      background: #fff; border-radius: 12px; width: 90vw; max-width: 800px; max-height: 85vh;
      display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
    .preview-modal-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--primary); color: #fff; }
    .preview-modal-body { flex: 1; overflow-y: auto; padding: 2rem; }
    .preview-modal-body h2 { font-size: 1.5rem; margin-bottom: 1rem; }
    .preview-attachment-item { display: flex; align-items: center; gap: 0.5rem; background: var(--surface-alt); padding: 0.5rem 1rem; border-radius: 6px; margin: 0.5rem 0; }
    .image-modal {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.9); z-index: 10001; flex-direction: column; align-items: center; justify-content: center;
    }
    .image-modal.active { display: flex; }
    .image-modal-img { max-width: 90vw; max-height: 80vh; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1><i class="fa-solid fa-chalkboard-user" style="color:var(--primary);"></i> Course Manager</h1>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <div class="tab active" data-tab="courses"><i class="fa-solid fa-list"></i> Courses <span class="badge-unread" id="courses-badge">0</span></div>
      <div class="tab" data-tab="builder" id="builder-tab" style="display:none;"><i class="fa-solid fa-puzzle-piece"></i> Module Builder</div>
      <div class="tab" data-tab="payments"><i class="fa-solid fa-file-invoice-dollar"></i> Payments <span class="badge-unread" id="payments-badge">0</span></div>
    </div>

    <!-- Tab: Courses -->
    <div class="tab-content active" id="content-courses">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
        <h2 style="font-size:1.5rem; font-weight:700;">All Courses</h2>
        <button class="btn btn-primary" onclick="openCreateModal()"><i class="fa-solid fa-plus"></i> New Course</button>
      </div>
      <div class="grid" id="courses-grid"></div>
    </div>

    <!-- Tab: Module Builder -->
    <div class="tab-content" id="content-builder">
      <div style="display:flex; align-items:center; gap:1rem; margin-bottom:1.5rem;">
        <button class="btn btn-outline" onclick="switchTab('courses')"><i class="fa-solid fa-arrow-left"></i> Back to Courses</button>
        <h2 id="builder-course-title" style="font-size:1.5rem; font-weight:700;">Module Builder</h2>
      </div>
      <button class="btn btn-primary" onclick="openModuleModal()"><i class="fa-solid fa-plus"></i> Add Module</button>
      <div class="module-list" id="modules-list"></div>
    </div>

    <!-- Tab: Course Payments -->
    <div class="tab-content" id="content-payments">
      <h2 style="font-size:1.5rem; font-weight:700; margin-bottom:1.5rem;">Course Payments</h2>
      <div class="filters">
        <select id="filter-type" onchange="renderPayments()">
          <option value="all">All Types</option>
          <option value="workshop">Workshop</option>
          <option value="tefl">TEFL</option>
        </select>
        <select id="filter-status" onchange="renderPayments()">
          <option value="pending" selected>Pending</option>
          <option value="all">All Status</option>
          <option value="approved">Approved</option>
          <option value="rejected">Rejected</option>
        </select>
      </div>
      <div style="overflow-x:auto;">
        <table class="payments-table">
          <thead><tr><th>Invoice</th><th>Customer</th><th>Course</th><th>Amount</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="payments-tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- Create/Edit Course Modal -->
    <div class="modal-overlay" id="course-modal">
      <div class="modal">
        <button class="modal-close" onclick="closeModal('course-modal')"><i class="fa-solid fa-times"></i></button>
        <h2 id="course-modal-title" style="margin-bottom:1.5rem;">Create Course</h2>
        <form id="course-form" onsubmit="return false;">
          <input type="hidden" id="course-id" />
          <div class="form-group"><label>Course Title *</label><input type="text" id="course-title" required /></div>
          <div class="form-group"><label>Category *</label><select id="course-category" required><option value="workshop">Workshop</option><option value="tefl">TEFL</option></select></div>
          <div class="form-group"><label>Price (USD) *</label><input type="number" id="course-price" min="0" step="0.01" required /></div>
          <div class="form-group"><label>Short Description</label><textarea id="course-description" rows="3"></textarea></div>
          <div class="form-group">
            <label>Thumbnail Image (optional)</label>
            <input type="file" id="thumbnail-input" accept="image/*" onchange="uploadThumbnail(this)" />
            <input type="hidden" id="thumbnail-url" />
            <div id="thumbnail-preview" style="margin-top:0.7rem; max-width:200px;"></div>
            <!-- small progress container -->
            <div id="thumbnail-progress" style="display:none; margin-top:0.5rem; color:var(--text-muted);">
              <i class="fa-solid fa-spinner fa-spin"></i> Uploading…
            </div>
          </div>
          <div class="form-group"><label>Start Date (optional)</label><input type="date" id="course-start-date" /></div>
          <div class="form-group"><label>Status</label><select id="course-status"><option value="published">Published</option><option value="draft">Draft</option><option value="closed">Closed</option></select></div>
          <button type="button" class="btn btn-primary" style="width:100%; margin-top:0.5rem;" onclick="saveCourse()">Save Course</button>
        </form>
      </div>
    </div>

    <!-- Module Editor Modal -->
    <div class="modal-overlay" id="module-modal">
      <div class="modal" style="max-width:850px;">
        <button class="modal-close" onclick="closeModal('module-modal')"><i class="fa-solid fa-times"></i></button>
        <h2 id="module-modal-title" style="margin-bottom:1.5rem;">New Module</h2>
        <form id="module-form" onsubmit="return false;">
          <input type="hidden" id="module-id" />
          <div class="form-group"><label>Module Title *</label><input type="text" id="module-title" required /></div>
          <div class="form-group">
            <label>Content</label>
            <div class="editor-toolbar">
              <button type="button" onclick="formatDoc('bold')"><b>B</b></button>
              <button type="button" onclick="formatDoc('italic')"><i>I</i></button>
              <button type="button" onclick="formatDoc('underline')"><u>U</u></button>
              <button type="button" onclick="formatDoc('insertUnorderedList')">• List</button>
            </div>
            <div class="editor-content" id="module-content" contenteditable="true"></div>
          </div>
          <div class="form-group">
            <label>Attachments</label>
            <input type="file" id="module-attachment-input" onchange="uploadModuleFile(this)" multiple />
            <div id="module-upload-progress" style="display:none; margin:0.5rem 0; color:var(--text-muted);">
              <i class="fa-solid fa-spinner fa-spin"></i> Uploading…
            </div>
            <div id="module-attachments" class="attachments"></div>
          </div>
          <div class="quiz-builder">
            <h4 style="margin-bottom:1rem;">Quiz (optional)</h4>
            <div id="quiz-questions"></div>
            <button type="button" class="btn btn-outline" onclick="addQuizQuestion()"><i class="fa-solid fa-plus"></i> Add Question</button>
          </div>
          <button type="button" class="btn btn-primary" style="width:100%; margin-top:1rem;" onclick="saveModule()">Save Module</button>
        </form>
      </div>
    </div>

    <!-- Preview Module Modal (Teacher View) -->
    <div class="preview-modal" id="preview-module-modal">
      <div class="preview-modal-content">
        <div class="preview-modal-header">
          <h3 id="preview-module-title">Module Preview</h3>
          <button onclick="closePreviewModule()" style="background:none; border:none; color:#fff; font-size:1.5rem;">&times;</button>
        </div>
        <div class="preview-modal-body" id="preview-module-body">
          <!-- filled dynamically -->
        </div>
      </div>
    </div>

    <!-- Document/Image preview modals (from inbox) -->
    <div id="previewModal" class="preview-modal">
      <div class="preview-modal-content">
        <div class="preview-modal-header"><h3 id="previewModalTitle">Document Preview</h3><button onclick="closePreviewModal()" style="background:none; border:none; color:#fff; font-size:1.5rem;">&times;</button></div>
        <iframe id="previewIframe" class="preview-modal-iframe" src="" allowfullscreen style="flex:1; border:none;"></iframe>
      </div>
    </div>
    <div id="imageModal" class="image-modal">
      <img id="imageModalImg" class="image-modal-img" src="" alt="" />
      <div style="margin-top:1.5rem; display:flex; gap:1rem;">
        <a id="imageModalDownload" class="btn btn-primary" href="#" download>Download</a>
        <button class="btn btn-outline" onclick="closeImageModal()" style="color:#fff; border-color:rgba(255,255,255,0.5);">Close</button>
      </div>
    </div>

    <div class="toast-container" id="toast-container"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, serverTimestamp, collection, addDoc, query, getDocs, orderBy, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBMKjt1RUZXVxTmadiCqKhNbzSPsNUDxV8",
      authDomain: "teacherbee-connect.firebaseapp.com",
      projectId: "teacherbee-connect",
      storageBucket: "teacherbee-connect.firebasestorage.app",
      messagingSenderId: "345613317767",
      appId: "1:345613317767:web:555713e479f9837e84aa22"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const GAS_UPLOAD_URL = "https://script.google.com/macros/s/AKfycbwNnQ_Z0j9L5KU12ONFIsRVA2NnFDEna6TU4_-Tr1WaZQmNIdT0WL0A5WC0gsLxqvlj/exec";

    let currentAdmin = null;
    let allCourses = [];
    let currentCourseId = null;
    let currentModuleId = null;
    let modules = [];
    let tempAttachments = []; // will contain { name, url, driveId, type, instructions }
    let allPayments = [];
    const courseNameCache = {};

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'admin.html'; return; }
      const adminDoc = await getDoc(doc(db, 'admins', user.uid));
      if (!adminDoc.exists()) { await signOut(auth); window.location.href = 'admin.html'; return; }
      currentAdmin = user;
      loadCourses();
      listenForPayments();
    });

    // ────────────── TAB SWITCHING ──────────────
    window.switchTab = (tabName) => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.querySelector(`.tab[data-tab="${tabName}"]`).classList.add('active');
      document.getElementById(`content-${tabName}`).classList.add('active');
      if (tabName === 'builder') loadModules();
      if (tabName === 'payments') renderPayments();
    };
    document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));

    // ────────────── COURSES TAB ──────────────
    async function loadCourses() {
      const q = query(collection(db, 'courses'), orderBy('createdAt', 'desc'));
      const snap = await getDocs(q);
      allCourses = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderCoursesGrid();
    }

    function renderCoursesGrid() {
      const grid = document.getElementById('courses-grid');
      if (allCourses.length === 0) {
        grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:2rem; color:var(--text-muted);">No courses yet.</div>';
        return;
      }
      grid.innerHTML = allCourses.map(c => {
        const thumb = c.thumbnailUrl ? `<img src="${c.thumbnailUrl}" alt="" style="max-width:200px; height:auto;">` : '';
        const catBadge = c.category === 'tefl' ? 'badge-tefl' : 'badge-workshop';
        return `
          <div class="course-card">
            ${thumb}
            <div class="card-body">
              <span class="badge ${catBadge}">${c.category}</span>
              <h3>${escapeHTML(c.title)}</h3>
              <p style="color:var(--text-muted); font-size:0.9rem;">$${c.price} · ${c.enrolledCount || 0} enrolled</p>
              <div class="card-actions">
                <button class="btn btn-outline btn-sm" onclick="editCourse('${c.id}')">Edit</button>
                <button class="btn btn-primary btn-sm" onclick="openBuilder('${c.id}')">Modules</button>
                <button class="btn btn-danger btn-sm" onclick="deleteCourse('${c.id}')">Delete</button>
              </div>
            </div>
          </div>`;
      }).join('');
    }

    window.openCreateModal = () => {
      resetCourseForm();
      document.getElementById('course-modal-title').textContent = 'Create Course';
      document.getElementById('course-modal').classList.add('active');
    };

    window.editCourse = (courseId) => {
      const course = allCourses.find(c => c.id === courseId);
      if (!course) return;
      document.getElementById('course-modal-title').textContent = 'Edit Course';
      document.getElementById('course-id').value = courseId;
      document.getElementById('course-title').value = course.title || '';
      document.getElementById('course-category').value = course.category || 'workshop';
      document.getElementById('course-price').value = course.price || 0;
      document.getElementById('course-description').value = course.description || '';
      document.getElementById('course-status').value = course.status || 'published';
      document.getElementById('course-start-date').value = course.startDate ? course.startDate.toDate().toISOString().split('T')[0] : '';
      document.getElementById('thumbnail-url').value = course.thumbnailUrl || '';
      document.getElementById('thumbnail-preview').innerHTML = course.thumbnailUrl ? `<img src="${course.thumbnailUrl}" style="max-width:200px; height:auto; border-radius:8px;" />` : '';
      document.getElementById('course-modal').classList.add('active');
    };

    function resetCourseForm() {
      document.getElementById('course-form').reset();
      document.getElementById('course-id').value = '';
      document.getElementById('thumbnail-url').value = '';
      document.getElementById('thumbnail-preview').innerHTML = '';
      document.getElementById('thumbnail-progress').style.display = 'none';
    }

    window.closeModal = (modalId) => document.getElementById(modalId).classList.remove('active');

    // ────────────── UPLOAD WITH PROGRESS (using toast) ──────────────
    function uploadFileWithToast(file) {
      return new Promise((resolve, reject) => {
        const toastId = 'upload-' + Date.now();
        showToast(`Uploading ${file.name}…`, 'info', toastId);
        const reader = new FileReader();
        reader.onload = async (e) => {
          const payload = {
            action: 'uploadCertificate',
            fileName: file.name,
            mimeType: file.type || 'application/octet-stream',
            file: e.target.result
          };
          try {
            const res = await fetch(GAS_UPLOAD_URL, { method: 'POST', body: JSON.stringify(payload) });
            const data = await res.json();
            // remove progress toast
            const toastEl = document.getElementById(toastId);
            if (toastEl) toastEl.remove();
            if (data.status === 'success' && data.certificates?.length > 0) {
              const cert = data.certificates[data.certificates.length - 1];
              resolve({ url: cert.fileUrl || cert.url, driveId: cert.id, name: file.name });
            } else {
              reject(new Error(data.message || 'Upload failed'));
            }
          } catch (err) { reject(err); }
        };
        reader.onerror = () => reject(new Error('Read error'));
        reader.readAsDataURL(file);
      });
    }

    window.uploadThumbnail = async (input) => {
      const file = input.files[0];
      if (!file) return;
      // Show progress
      document.getElementById('thumbnail-progress').style.display = 'block';
      try {
        const uploaded = await uploadFileWithToast(file);
        document.getElementById('thumbnail-url').value = uploaded.url;
        document.getElementById('thumbnail-preview').innerHTML = `<img src="${uploaded.url}" style="max-width:200px; height:auto; border-radius:8px;" />`;
        showToast('Thumbnail uploaded!', 'success');
      } catch (e) {
        showToast('Upload error: ' + e.message, 'error');
      } finally {
        document.getElementById('thumbnail-progress').style.display = 'none';
      }
      input.value = '';
    };

    window.uploadModuleFile = async (input) => {
      const files = input.files;
      if (!files.length) return;
      document.getElementById('module-upload-progress').style.display = 'block';
      for (let file of files) {
        try {
          const uploaded = await uploadFileWithToast(file);
          // push with empty instructions
          tempAttachments.push({ ...uploaded, type: file.type.startsWith('image/') ? 'image' : 'file', instructions: '' });
          renderTempAttachments();
        } catch (e) {
          showToast('Upload failed: ' + e.message, 'error');
        }
      }
      document.getElementById('module-upload-progress').style.display = 'none';
      input.value = '';
    };

    function renderTempAttachments() {
      const container = document.getElementById('module-attachments');
      container.innerHTML = tempAttachments.map((att, i) => `
        <div class="attachment-row">
          <div class="file-name"><i class="fa-solid fa-paperclip"></i> ${escapeHTML(att.name)}</div>
          <input type="text" class="attachment-instruction" placeholder="Instructions (e.g., Watch this video)" value="${escapeHTML(att.instructions || '')}" onchange="updateAttachmentInstruction(${i}, this.value)" />
          <button type="button" class="btn btn-danger btn-sm" onclick="removeTempAttachment(${i})">✕</button>
        </div>
      `).join('');
    }

    window.updateAttachmentInstruction = (index, value) => {
      if (tempAttachments[index]) tempAttachments[index].instructions = value;
    };
    window.removeTempAttachment = (index) => {
      tempAttachments.splice(index, 1);
      renderTempAttachments();
    };

    // ────────────── SAVE COURSE ──────────────
    window.saveCourse = async () => {
      const title = document.getElementById('course-title').value.trim();
      const category = document.getElementById('course-category').value;
      const price = parseFloat(document.getElementById('course-price').value);
      const description = document.getElementById('course-description').value.trim();
      const status = document.getElementById('course-status').value;
      const startDate = document.getElementById('course-start-date').value;
      const thumbnailUrl = document.getElementById('thumbnail-url').value;
      if (!title || isNaN(price)) { showToast('Title and price are required', 'error'); return; }
      const courseData = { title, category, price, description, thumbnailUrl, status, startDate: startDate ? new Date(startDate) : null, updatedAt: serverTimestamp() };
      const courseId = document.getElementById('course-id').value;
      try {
        if (courseId) {
          await updateDoc(doc(db, 'courses', courseId), courseData);
          showToast('Course updated!', 'success');
        } else {
          courseData.createdAt = serverTimestamp();
          courseData.enrolledCount = 0;
          const docRef = await addDoc(collection(db, 'courses'), courseData);
          showToast('Course created!', 'success');
          document.getElementById('course-modal').classList.remove('active');
          openBuilder(docRef.id);
        }
        closeModal('course-modal');
        loadCourses();
      } catch (e) { showToast('Error: ' + e.message, 'error'); }
    };

    window.deleteCourse = async (courseId) => {
      if (!confirm('Delete this course and all its modules?')) return;
      await deleteDoc(doc(db, 'courses', courseId));
      loadCourses();
      showToast('Course deleted.', 'info');
    };

    // ────────────── MODULE BUILDER ──────────────
    window.openBuilder = async (courseId) => {
      currentCourseId = courseId;
      const course = allCourses.find(c => c.id === courseId);
      document.getElementById('builder-course-title').textContent = `Module Builder: ${course?.title || ''}`;
      document.getElementById('builder-tab').style.display = 'flex';
      switchTab('builder');
      await loadModules();
    };

    async function loadModules() {
      if (!currentCourseId) return;
      const q = query(collection(db, `courses/${currentCourseId}/modules`), orderBy('order', 'asc'));
      const snap = await getDocs(q);
      modules = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderModules();
    }

    function renderModules() {
      const container = document.getElementById('modules-list');
      if (modules.length === 0) {
        container.innerHTML = '<p style="color:var(--text-muted);">No modules yet.</p>';
        return;
      }
      container.innerHTML = modules.map((m, i) => `
        <div class="module-card">
          <div>
            <h3>Module ${i+1}: ${escapeHTML(m.title)}</h3>
            <p style="font-size:0.85rem; color:var(--text-muted);">${m.quiz?.length || 0} questions · ${m.attachments?.length || 0} files</p>
          </div>
          <div style="display:flex; gap:0.5rem;">
            <button class="btn btn-outline btn-sm" onclick="previewModule('${m.id}')"><i class="fa-solid fa-eye"></i> Preview</button>
            <button class="btn btn-outline btn-sm" onclick="editModule('${m.id}')">Edit</button>
            <button class="btn btn-danger btn-sm" onclick="deleteModule('${m.id}')">Delete</button>
          </div>
        </div>
      `).join('');
    }

    // ────────────── PREVIEW MODULE (Teacher View) ──────────────
    window.previewModule = (moduleId) => {
      const mod = modules.find(m => m.id === moduleId);
      if (!mod) return;
      document.getElementById('preview-module-title').textContent = mod.title || 'Module Preview';
      let html = `<div style="font-size:1rem; line-height:1.6;">${mod.content || '<p>No content</p>'}</div>`;
      if (mod.attachments && mod.attachments.length) {
        html += '<h4 style="margin-top:1.5rem;">Attachments</h4>';
        mod.attachments.forEach(att => {
          html += `<div class="preview-attachment-item">
            <i class="fa-solid fa-paperclip"></i>
            <strong>${escapeHTML(att.name)}</strong>
            ${att.instructions ? `<span style="color:var(--text-muted); margin-left:0.5rem;">– ${escapeHTML(att.instructions)}</span>` : ''}
            <a href="${att.url}" target="_blank" style="margin-left:auto;" class="btn btn-sm btn-outline">Open</a>
          </div>`;
        });
      }
      if (mod.quiz && mod.quiz.length) {
        html += '<h4 style="margin-top:1.5rem;">Quiz</h4>';
        mod.quiz.forEach((q, qi) => {
          html += `<p><strong>${qi+1}. ${escapeHTML(q.question)}</strong></p>`;
          q.options.forEach((opt, oi) => {
            html += `<p style="margin-left:1.5rem;">${String.fromCharCode(65+oi)}) ${escapeHTML(opt)}</p>`;
          });
          html += '<br/>';
        });
      }
      document.getElementById('preview-module-body').innerHTML = html;
      document.getElementById('preview-module-modal').classList.add('active');
    };

    window.closePreviewModule = () => {
      document.getElementById('preview-module-modal').classList.remove('active');
    };

    // ────────────── MODULE EDITOR (unchanged logic, but attachments include instructions) ──────────────
    window.openModuleModal = (moduleId = null) => {
      currentModuleId = moduleId;
      document.getElementById('module-modal-title').textContent = moduleId ? 'Edit Module' : 'New Module';
      document.getElementById('module-form').reset();
      document.getElementById('module-id').value = moduleId || '';
      document.getElementById('module-content').innerHTML = '';
      document.getElementById('module-attachments').innerHTML = '';
      document.getElementById('quiz-questions').innerHTML = '';
      tempAttachments = [];

      if (moduleId) {
        const mod = modules.find(m => m.id === moduleId);
        if (mod) {
          document.getElementById('module-title').value = mod.title || '';
          document.getElementById('module-content').innerHTML = mod.content || '';
          if (mod.attachments) {
            tempAttachments = mod.attachments.map(a => ({ ...a, instructions: a.instructions || '' }));
            renderTempAttachments();
          }
          if (mod.quiz) mod.quiz.forEach((q, qi) => renderQuizQuestion(q, qi));
        }
      }
      document.getElementById('module-modal').classList.add('active');
    };

    window.editModule = (moduleId) => openModuleModal(moduleId);

    window.formatDoc = (cmd) => {
      document.execCommand(cmd, false, null);
      document.getElementById('module-content').focus();
    };

    window.addQuizQuestion = () => renderQuizQuestion({ question: '', options: [''], correctIndex: 0 }, document.querySelectorAll('#quiz-questions .quiz-question').length);

    function renderQuizQuestion(q, index) {
      const container = document.getElementById('quiz-questions');
      const div = document.createElement('div');
      div.className = 'quiz-question';
      const radioName = `correct-${Date.now()}-${Math.random()}`;
      div.innerHTML = `
        <p><strong>Q${index+1}:</strong> <input type="text" class="quiz-q-input" value="${escapeHTML(q.question)}" placeholder="Enter question" /></p>
        <div class="quiz-options">
          ${q.options.map((opt, oi) => `
            <div class="quiz-option-row">
              <input type="text" class="quiz-opt-input" value="${escapeHTML(opt)}" placeholder="Option ${String.fromCharCode(65+oi)}" />
              <label><input type="radio" name="${radioName}" value="${oi}" ${oi === q.correctIndex ? 'checked' : ''} /> Correct</label>
            </div>
          `).join('')}
        </div>
        <div style="margin-top:0.5rem;">
          <button type="button" class="btn btn-outline btn-sm" onclick="addOptionToQuestion(this)">+ Option</button>
          <button type="button" class="btn btn-danger btn-sm" onclick="removeQuizQuestion(this)">Remove</button>
        </div>
      `;
      container.appendChild(div);
    }

    window.addOptionToQuestion = (btn) => {
      const qDiv = btn.closest('.quiz-question');
      const optionsDiv = qDiv.querySelector('.quiz-options');
      const radioName = qDiv.querySelector('input[type="radio"]').name;
      const optCount = optionsDiv.querySelectorAll('.quiz-opt-input').length;
      const row = document.createElement('div');
      row.className = 'quiz-option-row';
      row.innerHTML = `
        <input type="text" class="quiz-opt-input" placeholder="Option ${String.fromCharCode(65+optCount)}" />
        <label><input type="radio" name="${radioName}" value="${optCount}" /> Correct</label>
      `;
      optionsDiv.appendChild(row);
    };

    window.removeQuizQuestion = (btn) => btn.closest('.quiz-question').remove();

    window.saveModule = async () => {
      const title = document.getElementById('module-title').value.trim();
      const content = document.getElementById('module-content').innerHTML;
      if (!title) { showToast('Module title is required', 'error'); return; }

      const quizQuestions = [];
      document.querySelectorAll('#quiz-questions .quiz-question').forEach(qDiv => {
        const question = qDiv.querySelector('.quiz-q-input')?.value.trim();
        const optionInputs = [...qDiv.querySelectorAll('.quiz-opt-input')].map(inp => inp.value.trim());
        const correctRadio = qDiv.querySelector('input[type="radio"]:checked');
        if (question && optionInputs.length > 0) {
          quizQuestions.push({
            question,
            options: optionInputs,
            correctIndex: correctRadio ? parseInt(correctRadio.value) : 0
          });
        }
      });

      const moduleData = {
        title,
        content,
        attachments: tempAttachments,
        quiz: quizQuestions,
        order: modules.length
      };

      try {
        const moduleId = document.getElementById('module-id').value;
        if (moduleId) {
          await updateDoc(doc(db, `courses/${currentCourseId}/modules`, moduleId), moduleData);
        } else {
          await addDoc(collection(db, `courses/${currentCourseId}/modules`), moduleData);
        }
        showToast('Module saved!', 'success');
        closeModal('module-modal');
        loadModules();
      } catch (e) { showToast('Error: ' + e.message, 'error'); }
    };

    window.deleteModule = async (moduleId) => {
      if (!confirm('Delete this module?')) return;
      await deleteDoc(doc(db, `courses/${currentCourseId}/modules`, moduleId));
      loadModules();
      showToast('Module deleted.', 'info');
    };

    // ────────────── PAYMENTS TAB ──────────────
    function listenForPayments() {
      const q = query(collection(db, 'payments'), where('type', 'in', ['workshop', 'tefl']), orderBy('createdAt', 'desc'));
      onSnapshot(q, async (snap) => {
        allPayments = [];
        let pendingCount = 0;
        for (let docSnap of snap.docs) {
          const data = docSnap.data();
          if (!data.courseName && data.itemId) {
            if (!courseNameCache[data.itemId]) {
              const courseSnap = await getDoc(doc(db, 'courses', data.itemId));
              courseNameCache[data.itemId] = courseSnap.exists() ? courseSnap.data().title : 'Unknown';
            }
            data.courseName = courseNameCache[data.itemId];
          }
          allPayments.push({ id: docSnap.id, ...data });
          if (data.status === 'pending') pendingCount++;
        }
        updateBadges(pendingCount);
        if (document.getElementById('content-payments').classList.contains('active')) renderPayments();
      });
    }

    function updateBadges(pendingCount) {
      ['payments-badge','courses-badge'].forEach(id => {
        const el = document.getElementById(id);
        el.textContent = pendingCount;
        el.classList.toggle('visible', pendingCount > 0);
      });
    }

    window.renderPayments = () => {
      const type = document.getElementById('filter-type').value;
      const status = document.getElementById('filter-status').value;
      let filtered = allPayments;
      if (type !== 'all') filtered = filtered.filter(p => p.type === type);
      if (status !== 'all') filtered = filtered.filter(p => p.status === status);

      const tbody = document.getElementById('payments-tbody');
      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:2rem;">No payments found.</td></tr>';
        return;
      }
      tbody.innerHTML = filtered.map(p => {
        const invId = p.id.substring(0,8).toUpperCase();
        const cust = p.customer || {};
        return `
          <tr>
            <td><strong>#${invId}</strong></td>
            <td>${escapeHTML(cust.name || 'N/A')}<br><small style="color:var(--text-muted)">${escapeHTML(cust.email || '')}</small></td>
            <td>${escapeHTML(p.courseName || 'Loading...')}</td>
            <td><strong>$${p.amount || 0}</strong></td>
            <td><span class="status-badge status-${p.status}">${p.status}</span></td>
            <td style="white-space:nowrap;">
              ${p.status === 'pending' ? `<button class="btn btn-approve btn-sm" onclick="approvePayment('${p.id}')">Approve</button>
                <button class="btn btn-reject btn-sm" onclick="rejectPayment('${p.id}')">Reject</button>` : ''}
              <button class="btn btn-delete btn-sm" onclick="deletePayment('${p.id}')">Delete</button>
            </td>
          </tr>
        `;
      }).join('');
    };

    window.approvePayment = async (paymentId) => {
      if (!confirm('Approve this payment and activate enrollment?')) return;
      try {
        const payment = allPayments.find(p => p.id === paymentId);
        if (!payment) return;
        await updateDoc(doc(db, 'payments', paymentId), { status: 'approved', approvedBy: currentAdmin.uid, approvedAt: serverTimestamp() });
        const enrollmentQuery = query(collection(db, 'course_enrollments'), where('paymentId', '==', paymentId));
        const enrollSnap = await getDocs(enrollmentQuery);
        enrollSnap.forEach(async (enrollmentDoc) => await updateDoc(doc(db, 'course_enrollments', enrollmentDoc.id), { status: 'active', activatedAt: serverTimestamp() }));
        if (payment.itemId) {
          const courseRef = doc(db, 'courses', payment.itemId);
          const courseSnap = await getDoc(courseRef);
          if (courseSnap.exists()) await updateDoc(courseRef, { enrolledCount: (courseSnap.data().enrolledCount || 0) + 1 });
        }
        showToast('Payment approved!', 'success');
      } catch (e) { showToast('Error: ' + e.message, 'error'); }
    };

    window.rejectPayment = async (paymentId) => {
      if (!confirm('Reject this payment?')) return;
      try {
        await updateDoc(doc(db, 'payments', paymentId), { status: 'rejected', rejectedBy: currentAdmin.uid, rejectedAt: serverTimestamp() });
        showToast('Payment rejected.', 'info');
      } catch (e) { showToast('Error: ' + e.message, 'error'); }
    };

    window.deletePayment = async (paymentId) => {
      if (!confirm('Delete this invoice?')) return;
      await deleteDoc(doc(db, 'payments', paymentId));
      showToast('Invoice deleted.', 'success');
    };

    // ────────────── PREVIEW MODALS (inbox style) ──────────────
    window.openPreviewModal = (url, fileName) => {
      document.getElementById('previewModalTitle').textContent = fileName || 'Document Preview';
      document.getElementById('previewIframe').src = url;
      document.getElementById('previewModal').classList.add('active');
    };
    window.closePreviewModal = () => {
      document.getElementById('previewIframe').src = '';
      document.getElementById('previewModal').classList.remove('active');
    };
    window.openImageModal = (downloadUrl, imageUrl) => {
      document.getElementById('imageModalImg').src = imageUrl;
      document.getElementById('imageModalDownload').href = downloadUrl;
      document.getElementById('imageModal').classList.add('active');
    };
    window.closeImageModal = () => {
      document.getElementById('imageModalImg').src = '';
      document.getElementById('imageModal').classList.remove('active');
    };

    function showToast(msg, type='info', id=null) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      if (id) toast.id = id;
      toast.className = `toast ${type}`;
      toast.textContent = msg;
      container.appendChild(toast);
      setTimeout(() => { if (toast.parentNode) toast.remove(); }, 4000);
    }

    function escapeHTML(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }
  </script>
</body>
</html>
