<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Admin Portal — TeacherBee Connect</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary: #4F46E5; --primary-hover: #4338CA; --primary-light: #EEF2FF;
      --surface: #FFFFFF; --surface-alt: #F8FAFC; --bg-color: #F1F5F9;
      --text-main: #0F172A; --text-secondary: #334155; --text-muted: #64748B;
      --border: #E2E8F0; --border-light: #F1F5F9; --danger: #EF4444;
      --success: #10B981; --warning: #F59E0B;
      --radius-xs: 4px; --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px;
      --shadow-xs: 0 1px 2px rgba(0,0,0,0.04);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.06), 0 2px 4px rgba(0,0,0,0.04);
      --shadow-lg: 0 10px 25px rgba(0,0,0,0.08), 0 4px 10px rgba(0,0,0,0.04);
      --shadow-xl: 0 20px 40px rgba(0,0,0,0.10), 0 8px 16px rgba(0,0,0,0.05);
      --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
    body { background: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; padding-bottom: 0; }
    #toast-container { position: fixed; top: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
    .toast { padding: 14px 20px; border-radius: var(--radius-md); color: #fff; font-weight: 500; font-size: 0.875rem; box-shadow: var(--shadow-lg); animation: slideIn 0.35s cubic-bezier(0.16,1,0.3,1) forwards; display: flex; align-items: center; gap: 10px; pointer-events: auto; }
    .toast.error { background: #DC2626; } .toast.success { background: #059669; } .toast.info { background: #1E293B; }
    @keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .btn { padding: 0.7rem 1.3rem; border-radius: var(--radius-sm); font-weight: 500; font-size: 0.875rem; cursor: pointer; border: 1px solid transparent; transition: all var(--transition-fast); display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; outline: none; letter-spacing: -0.01em; white-space: nowrap; user-select: none; text-decoration: none; }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 600; box-shadow: var(--shadow-xs); }
    .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); box-shadow: var(--shadow-md); transform: translateY(-1px); }
    .btn-secondary { background: var(--surface); border-color: var(--border); color: var(--text-secondary); }
    .btn-secondary:hover { background: var(--surface-alt); border-color: #CBD5E1; }
    .btn-danger { background: #FEF2F2; color: var(--danger); border-color: #FECACA; }
    .btn-danger:hover { background: var(--danger); color: #fff; border-color: var(--danger); }
    .btn-small { padding: 0.45rem 0.85rem; font-size: 0.8rem; border-radius: var(--radius-xs); }
    .login-container { width: 100%; max-width: 420px; background: var(--surface); border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-xl); padding: 2.5rem 2rem; text-align: center; animation: fadeUp 0.5s ease; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .login-logo { width: 56px; height: 56px; border-radius: var(--radius-sm); background: linear-gradient(135deg, #4F46E5, #6366F1); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 1.5rem; margin: 0 auto 1.5rem; }
    .login-container h2 { font-size: 1.25rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.25rem; }
    .login-container p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.75rem; }
    .form-group { margin-bottom: 1.1rem; text-align: left; }
    .form-label { display: block; font-weight: 600; font-size: 0.8rem; margin-bottom: 0.35rem; color: var(--text-secondary); }
    .form-input { width: 100%; padding: 0.75rem 0.9rem; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-size: 0.9rem; outline: none; transition: all var(--transition-fast); background: var(--surface); color: var(--text-main); }
    .form-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,0.08); }
    .error-message { color: var(--danger); font-size: 0.8rem; margin-top: 0.4rem; display: none; }
    
    /* Dashboard container (visible after login) */
    .dashboard-container { display: none; width: 100%; max-width: 1440px; margin: 0 auto; min-height: 100vh; flex-direction: column; }
    .admin-main { flex: 1; padding: 2rem 2.5rem; padding-bottom: 100px; }
    
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
    .top-bar h1 { font-size: 1.5rem; font-weight: 700; }
    .user-badge { display: flex; align-items: center; gap: 0.75rem; background: var(--surface); padding: 0.5rem 1rem; border-radius: 40px; border: 1px solid var(--border); box-shadow: var(--shadow-xs); }
    .user-badge img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
    .user-badge span { font-weight: 600; font-size: 0.85rem; color: var(--text-main); }
    
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 1.25rem; display: flex; align-items: center; gap: 1rem; box-shadow: var(--shadow-xs); }
    .stat-icon { width: 44px; height: 44px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
    .stat-icon.blue { background: #EEF2FF; color: var(--primary); } .stat-icon.green { background: #D1FAE5; color: #065F46; } .stat-icon.amber { background: #FEF3C7; color: #92400E; } .stat-icon.rose { background: #FEE2E2; color: #991B1B; }
    .stat-info h3 { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.1rem; }
    .stat-info p { font-size: 0.8rem; color: var(--text-muted); }
    .section-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 1.5rem; box-shadow: var(--shadow-xs); margin-bottom: 1.5rem; }
    .section-card h3 { font-size: 1rem; font-weight: 700; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
    
    /* Bottom navigation (glassmorphism dark dock) */
    .admin-bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      font-family: 'Inter', sans-serif;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      padding: 0;
    }
    .admin-bottom-nav .nav-scroll {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      -ms-overflow-style: none;
      scrollbar-width: none;
      padding: 10px 12px;
      gap: 8px;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      background: rgba(15, 32, 49, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.3);
    }
    .admin-bottom-nav .nav-scroll::-webkit-scrollbar { display: none; }
    .admin-bottom-nav .nav-scroll a {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      min-width: 72px;
      padding: 9px 6px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      color: #cbd5e1;
      text-decoration: none;
      transition: all 0.25s ease;
    }
    .admin-bottom-nav .nav-scroll a i { font-size: 19px; margin-bottom: 5px; color: #94a3b8; transition: transform 0.3s ease, color 0.3s ease; }
    .admin-bottom-nav .nav-scroll a span { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; white-space: nowrap; }
    .admin-bottom-nav .nav-scroll a:hover { background: rgba(255, 255, 255, 0.1); transform: translateY(-3px); color: #ffffff; }
    .admin-bottom-nav .nav-scroll a:hover i { transform: scale(1.15); color: #ffffff; }
    .admin-bottom-nav .nav-scroll a:active { transform: scale(0.94); }
    /* Active/Home button gold accent */
    .admin-bottom-nav .nav-scroll a.active-nav {
      background: rgba(220, 168, 36, 0.95);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(220, 168, 36, 0.35);
    }
    .admin-bottom-nav .nav-scroll a.active-nav i { color: #ffffff; }
    .admin-bottom-nav .nav-scroll a.active-nav:hover { background: rgba(240, 185, 45, 1); }
    /* Sign out button */
    .admin-bottom-nav .nav-scroll a.sign-out { background: rgba(255, 71, 87, 0.08); }
    .admin-bottom-nav .nav-scroll a.sign-out i { color: #ff6b6b; }
    .admin-bottom-nav .nav-scroll a.sign-out:hover { background: rgba(255, 71, 87, 0.2); }
    
    /* Desktop floating dock */
    @media (min-width: 769px) {
      .admin-bottom-nav {
        display: flex;
        justify-content: center;
        bottom: 20px;
        pointer-events: none;
        background: transparent;
        left: 50%;
        transform: translateX(-50%);
        width: auto;
      }
      .admin-bottom-nav .nav-scroll {
        pointer-events: auto;
        width: auto;
        max-width: 850px;
        justify-content: center;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        padding: 8px 16px;
        gap: 10px;
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45);
      }
      .admin-main { padding-bottom: 100px; }
    }
    
    @media (max-width: 768px) {
      body { align-items: flex-start; padding: 1rem; padding-bottom: 0; }
      .login-container { margin-top: 2rem; padding: 2rem 1.5rem; }
      .admin-main { padding: 1.25rem 1rem 90px 1rem; }
    }
  </style>
</head>
<body>
  <div id="toast-container"></div>
  
  <div id="login-screen" class="login-container">
    <div class="login-logo"><i class="fa-solid fa-shield-halved"></i></div>
    <h2>Admin Access</h2>
    <p>Sign in to manage the TeacherBee platform</p>
    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group"><label class="form-label">Email address</label><input type="email" id="login-email" class="form-input" placeholder="admin@teacherbee.com" required></div>
      <div class="form-group"><label class="form-label">Password</label><input type="password" id="login-password" class="form-input" placeholder="••••••••" required></div>
      <div id="login-error" class="error-message">Invalid credentials or insufficient permissions.</div>
      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.5rem;" id="btn-login"><i class="fa-solid fa-lock"></i> Sign In</button>
    </form>
  </div>
  
  <div id="dashboard-screen" class="dashboard-container">
    <main class="admin-main">
      <div class="top-bar">
        <h1>Dashboard Overview</h1>
        <div class="user-badge">
          <img src="https://ui-avatars.com/api/?name=Admin&background=4F46E5&color=fff" alt="Admin" id="user-badge-img">
          <span id="admin-name-display">Admin</span>
        </div>
      </div>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon blue"><i class="fa-solid fa-user-graduate"></i></div>
          <div class="stat-info"><h3 id="teachers-count">—</h3><p>Teachers</p></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon green"><i class="fa-solid fa-building-user"></i></div>
          <div class="stat-info"><h3 id="recruiters-count">—</h3><p>Recruiters</p></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon amber"><i class="fa-solid fa-briefcase"></i></div>
          <div class="stat-info"><h3 id="jobs-count">—</h3><p>Active Jobs</p></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon rose"><i class="fa-solid fa-envelope"></i></div>
          <div class="stat-info"><h3 id="messages-count">—</h3><p>New Messages</p></div>
        </div>
      </div>
      <div class="section-card">
        <h3><i class="fa-solid fa-clock-rotate-left"></i> Recent Activity</h3>
        <ul id="activity-list" class="activity-list" style="list-style:none; padding-left:0;">
          <li>Loading activity…</li>
        </ul>
      </div>
    </main>
    
    <!-- Bottom Navigation (Glassmorphism) -->
    <nav class="admin-bottom-nav">
      <div class="nav-scroll">
        <a href="#" class="active-nav" id="nav-home"><i class="fa-solid fa-grid-2"></i> <span>Home</span></a>
        <a href="manageteachers.html"><i class="fa-solid fa-user-graduate"></i> <span>Teachers</span></a>
        <a href="managerecruiters.html"><i class="fa-solid fa-building-user"></i> <span>Recruiters</span></a>
        <a href="adminpayments.html"><i class="fa-solid fa-credit-card"></i> <span>Payments</span></a>
        <a href="admininbox.html"><i class="fa-solid fa-envelope"></i> <span>Inbox</span></a>
        <a href="admin-courses.html"><i class="fa-solid fa-book-open"></i> <span>Courses</span></a>
        <a href="managejobs.html"><i class="fa-solid fa-briefcase"></i> <span>Jobs</span></a>
        <a href="#" onclick="handleLogout()" class="sign-out"><i class="fa-solid fa-right-from-bracket"></i> <span>Logout</span></a>
      </div>
    </nav>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, collection, query, where, getDocs, getCountFromServer } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBMKjt1RUZXVxTmadiCqKhNbzSPsNUDxV8",
      authDomain: "teacherbee-connect.firebaseapp.com",
      projectId: "teacherbee-connect",
      storageBucket: "teacherbee-connect.firebasestorage.app",
      messagingSenderId: "345613317767",
      appId: "1:345613317767:web:555713e479f9837e84aa22"
    };
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const loginScreen = document.getElementById('login-screen');
    const dashboardScreen = document.getElementById('dashboard-screen');
    const loginError = document.getElementById('login-error');
    const btnLogin = document.getElementById('btn-login');
    const adminNameDisplay = document.getElementById('admin-name-display');
    const userBadgeImg = document.getElementById('user-badge-img');

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      const icons = { success: 'fa-circle-check', error: 'fa-circle-exclamation', info: 'fa-circle-info' };
      toast.innerHTML = `<i class="fa-solid ${icons[type] || icons.info}"></i> ${message}`;
      container.appendChild(toast);
      setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3500);
    }

    function showLogin() {
      loginScreen.style.display = 'block';
      dashboardScreen.style.display = 'none';
      document.body.style.alignItems = 'center';
      document.body.style.justifyContent = 'center';
    }

    async function fetchDashboardData() {
      try {
        // Count teachers (role == 'teacher')
        const teachersQuery = query(collection(db, "users"), where("role", "==", "teacher"));
        const teachersSnap = await getCountFromServer(teachersQuery);
        document.getElementById('teachers-count').textContent = teachersSnap.data().count;

        // Count recruiters (role == 'recruiter')
        const recruitersQuery = query(collection(db, "users"), where("role", "==", "recruiter"));
        const recruitersSnap = await getCountFromServer(recruitersQuery);
        document.getElementById('recruiters-count').textContent = recruitersSnap.data().count;

        // Count active jobs (status == 'active')
        const jobsQuery = query(collection(db, "jobs"), where("status", "==", "active"));
        const jobsSnap = await getCountFromServer(jobsQuery);
        document.getElementById('jobs-count').textContent = jobsSnap.data().count;

        // Count unread messages (read == false)
        const messagesQuery = query(collection(db, "messages"), where("read", "==", false));
        const messagesSnap = await getCountFromServer(messagesQuery);
        document.getElementById('messages-count').textContent = messagesSnap.data().count;

        // Recent activity: last 3 signed-up teachers
        const recentQuery = query(collection(db, "users"), where("role", "==", "teacher"), /* order by createdAt desc */ );
        const recentSnap = await getDocs(recentQuery);
        const activityList = document.getElementById('activity-list');
        activityList.innerHTML = '';
        if (recentSnap.empty) {
          activityList.innerHTML = '<li>No recent teacher registrations.</li>';
        } else {
          // We'll take the first 3 (no ordering possible without index, but works for demo)
          const docs = recentSnap.docs.slice(0, 3);
          docs.forEach(doc => {
            const data = doc.data();
            const li = document.createElement('li');
            li.innerHTML = `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--primary);margin-right:0.75rem;"></span> ${data.name || data.email} registered as teacher`;
            activityList.appendChild(li);
          });
        }
      } catch (error) {
        console.error("Dashboard fetch error:", error);
        showToast("Could not load dashboard stats.", 'error');
      }
    }

    function showDashboard(email) {
      loginScreen.style.display = 'none';
      dashboardScreen.style.display = 'flex';
      document.body.style.alignItems = 'flex-start';
      document.body.style.justifyContent = 'flex-start';
      const name = email.split('@')[0];
      adminNameDisplay.textContent = name;
      userBadgeImg.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=4F46E5&color=fff`;
      // Fetch real stats
      fetchDashboardData();
    }

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        try {
          console.log('Verifying admin access for UID:', user.uid);
          const docRef = doc(db, "admins", user.uid);
          const docSnap = await getDoc(docRef);
          
          if (docSnap.exists()) {
            console.log('Admin verified. Loading dashboard.');
            showDashboard(user.email);
          } else {
            console.warn('User is not an admin.');
            await signOut(auth);
            showLogin();
            showToast('Access denied: insufficient permissions.', 'error');
          }
        } catch (e) {
          console.error('Auth check error:', e);
          await signOut(auth);
          showLogin();
          showToast(`System error: ${e.message}`, 'error');
        }
      } else {
        showLogin();
      }
    });

    window.handleLogin = async function(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      loginError.style.display = 'none';
      btnLogin.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Signing in...';
      btnLogin.disabled = true;
      try {
        await signInWithEmailAndPassword(auth, email, password);
        // Auth state listener will handle admin verification
      } catch (error) {
        loginError.textContent = error.message;
        loginError.style.display = 'block';
        btnLogin.innerHTML = '<i class="fa-solid fa-lock"></i> Sign In';
        btnLogin.disabled = false;
      }
    };

    window.handleLogout = async function() {
      await signOut(auth);
      showLogin();
      showToast('Signed out successfully.', 'info');
    };

    // Prevent default link behavior for the "Home" button to stay on page
    document.getElementById('nav-home').addEventListener('click', function(e) {
      e.preventDefault();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  </script>
</body>
</html>
