<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TeacherBee Connect - Search Teachers</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* CORE STYLES */
    :root {
      --primary-navy: #0A192F; --navy-light: #172A45; --accent-yellow: #FFD700; --yellow-hover: #E5C100;
      --bg-color: #F8F9FA; --surface-white: #FFFFFF; --text-main: #111827; --text-muted: #6B7280;
      --border-color: #E5E7EB; --error-red: #EF4444; --success-green: #10B981;
      --radius-lg: 16px; --radius-md: 8px; --shadow-sm: 0 1px 2px rgba(0,0,0,0.05); --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; }
    h1, h2, h3, h4 { color: var(--primary-navy); font-weight: 700; margin-bottom: 0.5rem; }
    p { color: var(--text-muted); line-height: 1.5; }

    header { background-color: var(--primary-navy); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow-md); }
    .brand-logo { display: flex; align-items: center; gap: 0.5rem; text-decoration: none; color: var(--surface-white); font-weight: 700; font-size: 1.25rem; }
    .brand-logo i { color: var(--accent-yellow); font-size: 1.5rem; }
    .recruiter-badge { background: rgba(255, 215, 0, 0.2); color: var(--accent-yellow); padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; margin-left: 10px; }

    .btn { padding: 0.75rem 1.5rem; border-radius: var(--radius-md); font-weight: 600; font-size: 0.95rem; cursor: pointer; border: none; transition: all 0.2s ease; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; text-decoration: none; }
    .btn-primary { background-color: var(--accent-yellow); color: var(--primary-navy); }
    .btn-primary:hover { background-color: var(--yellow-hover); }
    .btn-danger { background-color: #FEE2E2; color: var(--error-red); padding: 0.5rem 1rem; }
    .btn-small { padding: 0.4rem 0.8rem; font-size: 0.85rem; }
    .btn-block { width: 100%; }
    
    .form-input, .form-select { width: 100%; padding: 0.85rem 1rem; border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 1rem; outline: none; transition: 0.2s; background: var(--surface-white); color: var(--text-main); }
    .form-input:focus, .form-select:focus { border-color: var(--primary-navy); box-shadow: 0 0 0 3px rgba(10, 25, 47, 0.1); }

    .app-container { display: flex; flex: 1; max-width: 1200px; margin: 0 auto; width: 100%; padding: 2rem; gap: 2rem; align-items: flex-start; }
    .sidebar { width: 250px; display: flex; flex-direction: column; gap: 0.5rem; position: sticky; top: 100px; height: fit-content; }
    .content-area { flex: 1; display: flex; flex-direction: column; gap: 1.5rem; padding-bottom: 2rem; min-width: 0; }
    
    .sidebar-item { padding: 1rem; border-radius: var(--radius-md); color: var(--primary-navy); font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 1rem; transition: all 0.2s; text-decoration: none; }
    .sidebar-item:hover { background-color: var(--bg-color); }
    .sidebar-item.active { background-color: var(--primary-navy); color: var(--accent-yellow); }
    
    .card { background: var(--surface-white); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 1.5rem; box-shadow: var(--shadow-sm); margin-bottom: 1.5rem; }

    /* Teacher Search Grid */
    .teacher-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
    .teacher-card { text-align: center; display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: transform 0.2s; padding: 1.5rem; background: var(--surface-white); border: 1px solid var(--border-color); border-radius: var(--radius-lg); }
    .teacher-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-md); }
    .teacher-card img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent-yellow); margin-bottom: 1rem; }

    .badge { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.35rem 0.75rem; border-radius: 20px; font-size: 0.75rem; font-weight: 700; margin-bottom: 0.5rem; }
    .badge-yellow { background: var(--accent-yellow); color: var(--primary-navy); }
    .badge-navy { background: var(--navy-light); color: var(--surface-white); }
    .badge-outline { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 25, 47, 0.8); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 1rem; }
    .modal-overlay.active { display: flex; animation: fadeIn 0.2s; }
    .modal-content { background: var(--surface-white); width: 100%; max-width: 600px; border-radius: var(--radius-lg); padding: 2rem; position: relative; max-height: 90vh; overflow-y: auto; }
    .close-modal { position: absolute; top: 1rem; right: 1rem; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-muted); transition: color 0.2s; }
    .close-modal:hover { color: var(--primary-navy); }

    #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
    .toast { padding: 1rem 1.25rem; border-radius: var(--radius-md); color: var(--surface-white); font-weight: 600; font-size: 0.9rem; box-shadow: var(--shadow-md); animation: slideIn 0.3s ease forwards; display: flex; align-items: center; gap: 10px; }
    .toast.success { background-color: var(--success-green); }
    .toast.error { background-color: var(--error-red); }

    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    @media (max-width: 768px) {
      .app-container { padding: 1rem; padding-bottom: 85px; }
      .sidebar { position: fixed; bottom: 0; left: 0; width: 100%; height: 70px; background: var(--primary-navy); display: flex; flex-direction: row; justify-content: space-between; align-items: center; padding: 0 0.5rem; z-index: 999; top: auto; }
      .sidebar-item { flex: 1; flex-direction: column; padding: 0.5rem; font-size: 0.7rem; gap: 0.2rem; border-radius: 8px; text-align: center; color: var(--surface-white); }
      .sidebar-item.active { background: transparent; color: var(--accent-yellow); }
      .hide-mobile { display: none !important; }
    }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, updateDoc, getDoc, serverTimestamp, collection, query, where, getDocs, onSnapshot, addDoc, orderBy, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBMKjt1RUZXVxTmadiCqKhNbzSPsNUDxV8",
      authDomain: "teacherbee-connect.firebaseapp.com",
      projectId: "teacherbee-connect",
      storageBucket: "teacherbee-connect.firebasestorage.app",
      messagingSenderId: "345613317767",
      appId: "1:345613317767:web:555713e479f9837e84aa22"
    };

    const app = initializeApp(firebaseConfig);
    window.auth = getAuth(app);
    window.db = getFirestore(app);
    window.fb = { doc, setDoc, updateDoc, getDoc, serverTimestamp, collection, query, where, getDocs, onSnapshot, addDoc, orderBy, deleteDoc, signOut };
    setPersistence(window.auth, browserLocalPersistence);

    let isRedirecting = false;

    onAuthStateChanged(window.auth, async (user) => {
      if (user) {
        const docRef = doc(window.db, "users", user.uid);
        const docSnap = await getDoc(docRef);
        
        if (docSnap.exists()) {
          const data = docSnap.data();
          if (data.role !== 'recruiter') {
            if (!isRedirecting) { isRedirecting = true; window.location.href = 'index.html'; }
            return;
          }

          window.currentUser = { uid: user.uid, ...data };
          let name = data.name || user.email.split('@')[0];
          let avatar = data.avatarUrl || "https://ui-avatars.com/api/?name=" + name + "&background=0A192F&color=FFD700";
          
          document.getElementById('nav-display-name').innerText = name;
          document.getElementById('nav-avatar-img').src = avatar;

          window.fetchTeachers();
        }
      } else {
        window.location.href = 'index.html';
      }
    });
  </script>
</head>
<body>

  <div id="toast-container"></div>

  <header>
    <a href="RecruiterProfile.html" class="brand-logo">
      <i class="fa-solid fa-graduation-cap"></i> TeacherBee <span class="recruiter-badge">Employer</span>
    </a>
    <div id="nav-actions">
      <div style="display:flex; align-items:center; gap:1rem;">
        <img src="https://ui-avatars.com/api/?name=Company&background=0A192F&color=FFD700" id="nav-avatar-img" style="width:35px; height:35px; border-radius:50%; object-fit:cover; border:2px solid var(--accent-yellow);" class="hide-mobile">
        <span style="font-weight:600; color:var(--surface-white);" id="nav-display-name" class="hide-mobile">Loading...</span>
        <button class="btn btn-danger btn-small" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket"></i></button>
      </div>
    </div>
  </header>

  <div class="app-container">
    
    <aside class="sidebar">
      <a href="RecruiterProfile.html" class="sidebar-item"><i class="fa-regular fa-user"></i> <span>Profile</span></a>
      <a href="Searchteachers.html" class="sidebar-item active"><i class="fa-solid fa-users"></i> <span>Search Teachers</span></a>
      <a href="Postjobs.html" class="sidebar-item"><i class="fa-solid fa-briefcase"></i> <span>Manage Jobs</span></a>
      <a href="RecruiterInbox.html" class="sidebar-item"><i class="fa-regular fa-envelope"></i> <span>Inbox</span></a>
      <a href="Subscriptions.html" class="sidebar-item"><i class="fa-solid fa-credit-card"></i> <span>Subscriptions</span></a>
    </aside>

    <main class="content-area">
      <section id="search-view">
        <h2>Teacher Database</h2>
        <div class="card" style="padding: 1rem; margin-bottom: 1.5rem; display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 1rem;">
          <input type="text" class="form-input" id="search-keyword" placeholder="Search by name or keyword..." oninput="filterTeachers()">
          <select class="form-select" id="search-exp" onchange="filterTeachers()">
            <option value="">Any Experience</option>
            <option value="1">1+ Years</option>
            <option value="3">3+ Years</option>
          </select>
        </div>

        <div class="teacher-grid" id="teacher-results-container">
          <div style="text-align:center; padding: 2rem; color:var(--text-muted); grid-column: 1/-1;" id="teacher-loading">
            <i class="fa-solid fa-spinner fa-spin" style="font-size: 2rem; margin-bottom:1rem;"></i>
            <p>Loading database...</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- TEACHER PROFILE MODAL -->
  <div class="modal-overlay" id="teacher-modal">
    <div class="modal-content" style="max-width: 700px; padding: 3rem;">
      <button class="close-modal" onclick="document.getElementById('teacher-modal').classList.remove('active')">&times;</button>
      
      <div style="display:flex; align-items:center; gap:1.5rem; border-bottom: 2px solid var(--bg-color); padding-bottom:1.5rem; margin-bottom:1.5rem;">
        <img id="tm-avatar" src="" style="width:100px; height:100px; border-radius:50%; object-fit:cover; border:3px solid var(--accent-yellow);">
        <div>
          <h2 id="tm-name" style="font-size: 1.8rem; margin-bottom: 0.2rem;"></h2>
          <div style="display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:0.5rem;" id="tm-badges"></div>
        </div>
      </div>

      <h3 style="font-size: 1.1rem; color: var(--primary-navy); border-left: 4px solid var(--accent-yellow); padding-left: 0.75rem; margin-bottom: 1rem;">Biography</h3>
      <p id="tm-bio" style="color:var(--text-main); font-size:0.95rem; line-height:1.6; margin-bottom:2rem;"></p>

      <div id="tm-video-section" style="display:none; margin-bottom:2rem;">
        <h3 style="font-size: 1.1rem; color: var(--primary-navy); border-left: 4px solid var(--accent-yellow); padding-left: 0.75rem; margin-bottom: 1rem;">Introduction Video</h3>
        <video id="tm-video" controls style="width:100%; border-radius:8px;"></video>
      </div>

      <div style="margin-top: 2rem;">
        <button class="btn btn-primary btn-block" onclick="inviteTeacher()"><i class="fa-regular fa-comment-dots"></i> Message / Invite to Interview</button>
      </div>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwNnQ_Z0j9L5KU12ONFIsRVA2NnFDEna6TU4_-Tr1WaZQmNIdT0WL0A5WC0gsLxqvlj/exec";
    let allTeachers = [];
    let currentTeacherContext = null;

    window.showToast = function(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-check' : 'fa-exclamation'}"></i> ${message}`;
      container.appendChild(toast);
      setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3500);
    };

    window.handleLogout = function() {
      if(window.auth && window.fb) window.fb.signOut(window.auth);
      window.location.href = 'index.html';
    };

    window.fetchTeachers = async function() {
      try {
        const q = window.fb.query(window.fb.collection(window.db, "users"), window.fb.where("role", "==", "teacher"));
        const snapshot = await window.fb.getDocs(q);
        const container = document.getElementById('teacher-results-container');
        document.getElementById('teacher-loading').style.display = 'none';
        
        allTeachers = [];
        snapshot.forEach(docSnap => allTeachers.push({id: docSnap.id, ...docSnap.data()}));
        window.renderTeachers(allTeachers);
      } catch(e) {
        console.error(e);
      }
    };

    window.renderTeachers = function(teachersArray) {
      const container = document.getElementById('teacher-results-container');
      container.innerHTML = '';
      if(teachersArray.length === 0) {
        container.innerHTML = '<p style="grid-column:1/-1; text-align:center; color:var(--text-muted);">No teachers found matching your criteria.</p>';
        return;
      }

      teachersArray.forEach(t => {
        const avatar = t.avatarUrl || `https://ui-avatars.com/api/?name=${t.name}&background=0A192F&color=FFD700`;
        const expStr = t.experience ? `${t.experience} Yrs` : 'Entry Level';
        const videoBadge = t.videoUrl ? '<span class="badge badge-yellow"><i class="fa-solid fa-video"></i></span>' : '';
        
        const html = `
          <div class="teacher-card" onclick="openTeacherProfile('${t.id}')">
            <img src="${avatar}" alt="${t.name}">
            <h3 style="font-size:1.1rem; margin-bottom:0.2rem;">${t.name}</h3>
            <p style="font-size:0.85rem; margin-bottom:1rem; color:var(--text-muted);"><i class="fa-solid fa-language"></i> ${t.languages || 'English'}</p>
            <div style="display:flex; gap:0.5rem; justify-content:center; flex-wrap:wrap;">
              <span class="badge badge-navy">${expStr}</span>
              ${videoBadge}
            </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', html);
      });
    };

    window.filterTeachers = function() {
      const keyword = document.getElementById('search-keyword').value.toLowerCase();
      const expFilter = document.getElementById('search-exp').value;
      
      const filtered = allTeachers.filter(t => {
        const matchKey = t.name.toLowerCase().includes(keyword) || (t.languages||'').toLowerCase().includes(keyword);
        let matchExp = true;
        if(expFilter) {
          const yrs = parseInt(t.experience) || 0;
          if(expFilter === "1" && yrs < 1) matchExp = false;
          if(expFilter === "3" && yrs < 3) matchExp = false;
        }
        return matchKey && matchExp;
      });
      window.renderTeachers(filtered);
    };

    window.openTeacherProfile = function(tid) {
      const t = allTeachers.find(x => x.id === tid);
      if(!t) return;
      currentTeacherContext = t;
      
      document.getElementById('tm-name').innerText = t.name;
      document.getElementById('tm-avatar').src = t.avatarUrl || `https://ui-avatars.com/api/?name=${t.name}&background=0A192F&color=FFD700`;
      document.getElementById('tm-bio').innerText = t.bio || "No biography provided by this teacher.";
      
      let badges = `<span class="badge badge-navy">${t.experience ? t.experience + ' Yrs Exp' : 'Entry Level'}</span>`;
      if(t.languages) badges += `<span class="badge badge-outline"><i class="fa-solid fa-language"></i> ${t.languages}</span>`;
      document.getElementById('tm-badges').innerHTML = badges;

      const vidSec = document.getElementById('tm-video-section');
      if (t.videoUrl) {
         vidSec.style.display = 'block';
         document.getElementById('tm-video').src = t.videoUrl;
      } else {
         vidSec.style.display = 'none';
      }

      document.getElementById('teacher-modal').classList.add('active');
    };

    window.inviteTeacher = async function() {
      document.getElementById('teacher-modal').classList.remove('active');
      
      try {
        const threadData = {
          participants: [currentTeacherContext.id, window.currentUser.uid],
          jobTitle: `Interview Invite from ${window.currentUser.name}`,
          updatedAt: window.fb.serverTimestamp(),
          teacherName: currentTeacherContext.name
        };
        const threadRef = await window.fb.addDoc(window.fb.collection(window.db, "threads"), threadData);
        
        await window.fb.addDoc(window.fb.collection(window.db, `threads/${threadRef.id}/messages`), {
          senderId: window.currentUser.uid,
          text: `Hello ${currentTeacherContext.name}, we reviewed your profile and would like to invite you for an interview!`,
          timestamp: window.fb.serverTimestamp()
        });

        // Redirect to Inbox page after successfully inviting
        window.location.href = 'RecruiterInbox.html';
      } catch(e) {
        showToast("Error sending invitation.", "error");
      }
    };
  </script>
</body>
</html>
