<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TeacherBee - Jobs</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Global Styles (Matches Profile Page) */
    :root { --primary-navy: #0A192F; --navy-light: #172A45; --accent-yellow: #FFD700; --yellow-hover: #E5C100; --bg-color: #F8F9FA; --surface-white: #FFFFFF; --text-main: #111827; --text-muted: #6B7280; --border-color: #E5E7EB; --error-red: #EF4444; --success-green: #10B981; --radius-lg: 16px; --radius-md: 8px; --shadow-sm: 0 1px 2px rgba(0,0,0,0.05); --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; }
    h1, h2, h3, h4 { color: var(--primary-navy); font-weight: 700; margin-bottom: 0.5rem; } p { color: var(--text-muted); line-height: 1.5; }
    #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
    .toast { padding: 1rem 1.25rem; border-radius: var(--radius-md); color: var(--surface-white); font-weight: 600; font-size: 0.9rem; box-shadow: var(--shadow-md); animation: slideIn 0.3s ease forwards; display: flex; align-items: center; gap: 10px; }
    .toast.error { background-color: var(--error-red); } .toast.success { background-color: var(--success-green); } .toast.info { background-color: var(--primary-navy); color: var(--accent-yellow); }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    header { background-color: var(--primary-navy); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow-md); }
    .brand-logo { display: flex; align-items: center; gap: 0.5rem; text-decoration: none; color: var(--surface-white); font-weight: 700; font-size: 1.25rem; } .brand-logo i { color: var(--accent-yellow); }
    .btn { padding: 0.75rem 1.5rem; border-radius: var(--radius-md); font-weight: 600; font-size: 0.95rem; cursor: pointer; border: none; transition: all 0.2s ease; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; text-decoration: none; }
    .btn-primary { background-color: var(--accent-yellow); color: var(--primary-navy); } .btn-primary:hover { background-color: var(--yellow-hover); }
    .btn-outline { background: transparent; border: 2px solid var(--accent-yellow); color: var(--accent-yellow); } .btn-danger { background-color: #FEE2E2; color: var(--error-red); padding: 0.5rem 1rem; } .btn-small { padding: 0.4rem 0.8rem; font-size: 0.85rem; } .btn-block { width: 100%; margin-top: 1rem; }
    .app-container { display: flex; flex: 1; max-width: 1200px; margin: 0 auto; width: 100%; padding: 2rem; gap: 2rem; align-items: flex-start; }
    .sidebar { width: 250px; display: flex; flex-direction: column; gap: 0.5rem; position: sticky; top: 100px; height: fit-content; }
    .sidebar-item { text-decoration: none; padding: 1rem; border-radius: var(--radius-md); color: var(--primary-navy); font-weight: 600; display: flex; align-items: center; gap: 1rem; transition: all 0.2s; }
    .sidebar-item:hover { background-color: var(--bg-color); } .sidebar-item.active { background-color: var(--primary-navy); color: var(--accent-yellow); }
    .content-area { flex: 1; display: flex; flex-direction: column; gap: 1.5rem; padding-bottom: 2rem; min-width: 0; }
    .card { background: var(--surface-white); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 1.5rem; box-shadow: var(--shadow-sm); margin-bottom: 1.5rem; }
    .form-input, .form-select { width: 100%; padding: 0.85rem 1rem; border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 1rem; outline: none; transition: 0.2s; background: var(--surface-white); color: var(--text-main); }
    .badge { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.35rem 0.75rem; border-radius: 20px; font-size: 0.75rem; font-weight: 700; margin-bottom: 0.5rem; }
    .badge-yellow { background: var(--accent-yellow); color: var(--primary-navy); } .badge-outline { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); }
    .filter-bar { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem; background: var(--surface-white); padding: 1rem; border-radius: var(--radius-lg); border: 1px solid var(--border-color); }
    .job-card { display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s; } .job-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
    .job-meta { display: flex; gap: 1rem; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem; flex-wrap: wrap; }
    .job-desc { font-size: 0.9rem; margin-bottom: 1.5rem; color: var(--text-main); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 25, 47, 0.8); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 1rem; }
    .modal-overlay.active { display: flex; } .modal-content { background: var(--surface-white); width: 100%; max-width: 600px; border-radius: var(--radius-lg); padding: 2rem; position: relative; max-height: 90vh; overflow-y: auto; }
    .close-modal { position: absolute; top: 1rem; right: 1rem; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-muted); }
    @media (max-width: 768px) { .app-container { padding: 1rem; padding-bottom: 85px; } .filter-bar { grid-template-columns: 1fr; } .sidebar { position: fixed; bottom: 0; left: 0; width: 100%; height: 70px; background: var(--primary-navy); display: flex; flex-direction: row; justify-content: space-between; align-items: center; padding: 0 0.5rem; z-index: 999; top: auto; } .sidebar-item { flex: 1; flex-direction: column; padding: 0.5rem; font-size: 0.7rem; gap: 0.2rem; text-align: center; color: var(--surface-white); } .sidebar-item.active { background: transparent; color: var(--accent-yellow); } .hide-mobile { display: none !important; } }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, collection, query, orderBy, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    const firebaseConfig = { apiKey: "AIzaSyBMKjt1RUZXVxTmadiCqKhNbzSPsNUDxV8", authDomain: "teacherbee-connect.firebaseapp.com", projectId: "teacherbee-connect", storageBucket: "teacherbee-connect.firebasestorage.app", messagingSenderId: "345613317767", appId: "1:345613317767:web:555713e479f9837e84aa22" };
    const app = initializeApp(firebaseConfig);
    window.auth = getAuth(app); window.db = getFirestore(app);
    window.fb = { doc, getDoc, signOut, collection, query, orderBy, onSnapshot, addDoc, serverTimestamp };

    onAuthStateChanged(window.auth, async (user) => {
      if (user) {
        const docRef = doc(window.db, "users", user.uid);
        const docSnap = await getDoc(docRef);
        let name = user.email.split('@')[0];
        let avatar = "https://ui-avatars.com/api/?name=" + name + "&background=0A192F&color=FFD700";
        if (docSnap.exists()) {
          const data = docSnap.data();
          if (data.role === 'recruiter') { window.location.href = 'recruiter.html'; return; }
          name = data.name || name; if(data.avatarUrl) avatar = data.avatarUrl;
          window.currentUser = { uid: user.uid, name, email: user.email, isVerified: user.emailVerified };
        }
        document.getElementById('nav-actions').innerHTML = `<div style="display:flex; align-items:center; gap:1rem;"><img src="${avatar}" class="hide-mobile" style="width:35px; height:35px; border-radius:50%; border:2px solid var(--accent-yellow);"><span style="font-weight:600; color:white;" class="hide-mobile">${name}</span><button class="btn btn-danger btn-small" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket"></i></button></div>`;
        window.setupRealtimeJobs();
      } else { window.location.href = 'index.html'; }
    });
  </script>
</head>
<body class="dashboard-active">
  <div id="toast-container"></div>
  <header>
    <a href="profile.html" class="brand-logo"><i class="fa-solid fa-graduation-cap"></i> TeacherBee</a>
    <div id="nav-actions"></div>
  </header>
  <div class="app-container">
    <aside class="sidebar">
      <a href="profile.html" class="sidebar-item"><i class="fa-regular fa-user"></i> <span>Profile</span></a>
      <a href="jobs.html" class="sidebar-item active"><i class="fa-solid fa-briefcase"></i> <span>Jobs</span></a>
      <a href="workshops.html" class="sidebar-item"><i class="fa-solid fa-chalkboard-user"></i> <span>Training</span></a>
      <a href="tefl.html" class="sidebar-item"><i class="fa-solid fa-certificate"></i> <span>TEFL</span></a>
      <a href="inbox.html" class="sidebar-item"><i class="fa-regular fa-envelope"></i> <span>Inbox</span></a>
    </aside>
    <main class="content-area">
      <section class="view-panel active">
        <h2 style="margin-bottom: 1rem;">Recent Job Opportunities</h2>
        <div class="filter-bar">
          <input type="text" id="search-jobs" class="form-input" placeholder="Search keyword..." oninput="filterJobBoard()">
          <input type="text" id="search-location" class="form-input" placeholder="Filter by Country/Location..." oninput="filterJobBoard()">
          <select id="filter-type" class="form-select" onchange="filterJobBoard()">
            <option value="all">All Types</option>
            <option value="Full Time">Full Time</option>
            <option value="Part Time">Part Time</option>
          </select>
        </div>
        <div class="cards-grid" id="job-list-container">
          <div style="text-align:center; padding: 2rem; color:var(--text-muted); grid-column: 1/-1;" id="jobs-loading">
            <i class="fa-solid fa-spinner fa-spin" style="font-size: 2rem; margin-bottom:1rem;"></i>
            <p>Fetching active jobs from employers...</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="modal-overlay" id="job-detail-modal">
    <div class="modal-content">
      <button class="close-modal" onclick="closeJobModal()">&times;</button>
      <h2 id="job-modal-title" style="margin-bottom:0.5rem; color:var(--primary-navy);">Job Title</h2>
      <div class="job-meta" id="job-modal-meta" style="margin-bottom: 1.5rem;"></div>
      <h3 style="font-size: 1.1rem; color: var(--primary-navy); border-left: 4px solid var(--accent-yellow); padding-left: 0.75rem; margin-bottom: 1rem;">Job Description</h3>
      <div id="job-modal-desc" style="white-space: pre-wrap; margin-bottom: 2rem; line-height:1.6; color:var(--text-main);"></div>
      <button class="btn btn-primary btn-block" id="job-modal-apply">Apply Now</button>
    </div>
  </div>

  <script>
    let jobList = [];
    window.handleLogout = function() { if (window.auth && window.fb) window.fb.signOut(window.auth); };
    window.showToast = function(message, type = 'info') {
      const container = document.getElementById('toast-container'); const toast = document.createElement('div');
      toast.className = `toast ${type}`; toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-check' : type === 'error' ? 'fa-exclamation' : 'fa-info'}"></i> ${message}`;
      container.appendChild(toast); setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3500);
    };

    window.setupRealtimeJobs = function() {
      const jobsQuery = window.fb.query(window.fb.collection(window.db, "jobs"), window.fb.orderBy("createdAt", "desc"));
      window.fb.onSnapshot(jobsQuery, (snapshot) => {
        const container = document.getElementById('job-list-container'); document.getElementById('jobs-loading').style.display = 'none';
        jobList = []; container.innerHTML = '';
        if (snapshot.empty) { container.innerHTML = '<p style="text-align:center; grid-column:1/-1;">No live jobs at the moment.</p>'; return; }
        snapshot.forEach((docSnap) => {
          const job = { id: docSnap.id, ...docSnap.data() }; jobList.push(job);
          const html = `
            <div class="card job-card" data-title="${job.title.toLowerCase()}" data-location="${(job.location||'').toLowerCase()}" data-type="${job.type||'Full Time'}">
              <div>
                <div style="display:flex; justify-content:space-between;"><span class="badge badge-yellow">${job.type || 'Full Time'}</span><span class="badge badge-outline"><i class="fa-solid fa-location-dot"></i> ${job.location || 'Remote'}</span></div>
                <h3 style="font-size: 1.1rem; margin-top:0.5rem;">${job.title}</h3>
                <div class="job-meta"><span><i class="fa-solid fa-coins"></i> ${job.pay || 'Negotiable'}</span></div>
                <div class="job-desc">${job.description || ''}</div>
              </div>
              <button class="btn btn-outline" style="width: 100%; margin-top:1rem;" onclick="viewJobDetails('${job.id}')">View Details</button>
            </div>
          `;
          container.insertAdjacentHTML('beforeend', html);
        });
      });
    };

    window.filterJobBoard = function() {
      const searchTxt = document.getElementById('search-jobs').value.toLowerCase(), locTxt = document.getElementById('search-location').value.toLowerCase(), typeFilter = document.getElementById('filter-type').value;
      document.querySelectorAll('.job-card').forEach(card => {
        const textMatch = card.getAttribute('data-title').includes(searchTxt) || card.querySelector('.job-desc').innerText.toLowerCase().includes(searchTxt);
        const locMatch = card.getAttribute('data-location').includes(locTxt); const typeMatch = (typeFilter === 'all' || card.getAttribute('data-type') === typeFilter);
        card.style.display = (textMatch && locMatch && typeMatch) ? 'flex' : 'none';
      });
    };

    window.viewJobDetails = function(jobId) {
      const job = jobList.find(j => j.id === jobId); if(!job) return;
      document.getElementById('job-modal-title').innerText = job.title;
      document.getElementById('job-modal-meta').innerHTML = `<span><i class="fa-solid fa-coins"></i> ${job.pay||'N/A'}</span> <span><i class="fa-solid fa-location-dot"></i> ${job.location||'Remote'}</span> <span class="badge badge-yellow">${job.type||'Full Time'}</span>`;
      document.getElementById('job-modal-desc').innerHTML = job.description;
      const applyBtn = document.getElementById('job-modal-apply'); applyBtn.onclick = () => { applyForJob(job); closeJobModal(); };
      document.getElementById('job-detail-modal').classList.add('active');
    };

    window.closeJobModal = function() { document.getElementById('job-detail-modal').classList.remove('active'); };

    window.applyForJob = async function(job) {
      if (!window.currentUser.isVerified) { showToast("Verify your email address to apply for jobs.", "error"); return; }
      try {
        const threadData = { participants: [window.currentUser.uid, job.recruiterId], jobId: job.id, jobTitle: job.title, updatedAt: window.fb.serverTimestamp(), teacherName: window.currentUser.name };
        const threadRef = await window.fb.addDoc(window.fb.collection(window.db, "threads"), threadData);
        await window.fb.addDoc(window.fb.collection(window.db, `threads/${threadRef.id}/messages`), { senderId: window.currentUser.uid, text: `Application for ${job.title}. Hello, I would like to apply for this position. My profile is fully updated.`, timestamp: window.fb.serverTimestamp() });
        showToast(`Application successfully sent for ${job.title}`, "success");
      } catch(e) { console.error(e); showToast("Error sending application.", "error"); }
    };
  </script>
</body>
</html>
