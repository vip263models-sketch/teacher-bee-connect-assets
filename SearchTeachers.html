<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TeacherBee Connect - Manage Jobs</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* CORE STYLES */
    :root {
      --primary-navy: #0A192F; --navy-light: #172A45; --accent-yellow: #FFD700; --yellow-hover: #E5C100;
      --bg-color: #F8F9FA; --surface-white: #FFFFFF; --text-main: #111827; --text-muted: #6B7280;
      --border-color: #E5E7EB; --error-red: #EF4444; --success-green: #10B981;
      --radius-lg: 16px; --radius-md: 8px; --shadow-sm: 0 1px 2px rgba(0,0,0,0.05); --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; }
    h1, h2, h3, h4 { color: var(--primary-navy); font-weight: 700; margin-bottom: 0.5rem; }
    p { color: var(--text-muted); line-height: 1.5; }

    header { background-color: var(--primary-navy); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow-md); }
    .brand-logo { display: flex; align-items: center; gap: 0.5rem; text-decoration: none; color: var(--surface-white); font-weight: 700; font-size: 1.25rem; }
    .brand-logo i { color: var(--accent-yellow); font-size: 1.5rem; }
    .recruiter-badge { background: rgba(255, 215, 0, 0.2); color: var(--accent-yellow); padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; margin-left: 10px; }

    .btn { padding: 0.75rem 1.5rem; border-radius: var(--radius-md); font-weight: 600; font-size: 0.95rem; cursor: pointer; border: none; transition: all 0.2s ease; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; text-decoration: none; }
    .btn-primary { background-color: var(--accent-yellow); color: var(--primary-navy); }
    .btn-primary:hover { background-color: var(--yellow-hover); }
    .btn-danger { background-color: #FEE2E2; color: var(--error-red); padding: 0.5rem 1rem; }
    .btn-danger:hover { background-color: #FCA5A5; }
    .btn-small { padding: 0.4rem 0.8rem; font-size: 0.85rem; }
    .btn-block { width: 100%; }
    
    .form-group { margin-bottom: 1.25rem; }
    .form-label { display: block; font-weight: 600; font-size: 0.88rem; color: var(--primary-navy); margin-bottom: 0.4rem; }
    .form-input, .form-select, .form-textarea { width: 100%; padding: 0.85rem 1rem; border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 1rem; outline: none; transition: 0.2s; background: var(--surface-white); color: var(--text-main); }
    .form-textarea { resize: vertical; min-height: 120px; }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--primary-navy); box-shadow: 0 0 0 3px rgba(10, 25, 47, 0.1); }

    .app-container { display: flex; flex: 1; max-width: 1200px; margin: 0 auto; width: 100%; padding: 2rem; gap: 2rem; align-items: flex-start; }
    .sidebar { width: 250px; display: flex; flex-direction: column; gap: 0.5rem; position: sticky; top: 100px; height: fit-content; }
    .content-area { flex: 1; display: flex; flex-direction: column; gap: 1.5rem; padding-bottom: 2rem; min-width: 0; }
    
    .sidebar-item { padding: 1rem; border-radius: var(--radius-md); color: var(--primary-navy); font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 1rem; transition: all 0.2s; text-decoration: none; }
    .sidebar-item:hover { background-color: var(--bg-color); }
    .sidebar-item.active { background-color: var(--primary-navy); color: var(--accent-yellow); }
    
    .card { background: var(--surface-white); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 1.5rem; box-shadow: var(--shadow-sm); margin-bottom: 1.5rem; }

    /* Job Cards Grid */
    .jobs-grid { display: grid; grid-template-columns: 1fr; gap: 1rem; }
    .job-card { background: var(--surface-white); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 1.5rem; display: flex; justify-content: space-between; align-items: center; gap: 1.5rem; transition: all 0.2s; }
    .job-card:hover { border-color: var(--primary-navy); box-shadow: var(--shadow-md); }
    .job-info { display: flex; flex-direction: column; gap: 0.4rem; }
    .job-meta { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; margin-top: 0.5rem; }

    .badge { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.35rem 0.75rem; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
    .badge-yellow { background: var(--accent-yellow); color: var(--primary-navy); }
    .badge-navy { background: var(--navy-light); color: var(--surface-white); }
    .badge-outline { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 25, 47, 0.8); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 1rem; }
    .modal-overlay.active { display: flex; animation: fadeIn 0.2s; }
    .modal-content { background: var(--surface-white); width: 100%; max-width: 650px; border-radius: var(--radius-lg); padding: 2rem; position: relative; max-height: 90vh; overflow-y: auto; }
    .close-modal { position: absolute; top: 1rem; right: 1rem; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-muted); transition: color 0.2s; }
    .close-modal:hover { color: var(--primary-navy); }

    #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
    .toast { padding: 1rem 1.25rem; border-radius: var(--radius-md); color: var(--surface-white); font-weight: 600; font-size: 0.9rem; box-shadow: var(--shadow-md); animation: slideIn 0.3s ease forwards; display: flex; align-items: center; gap: 10px; }
    .toast.success { background-color: var(--success-green); }
    .toast.error { background-color: var(--error-red); }

    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    @media (max-width: 768px) {
      .app-container { padding: 1rem; padding-bottom: 85px; }
      .sidebar { position: fixed; bottom: 0; left: 0; width: 100%; height: 70px; background: var(--primary-navy); display: flex; flex-direction: row; justify-content: space-between; align-items: center; padding: 0 0.5rem; z-index: 999; top: auto; }
      .sidebar-item { flex: 1; flex-direction: column; padding: 0.5rem; font-size: 0.7rem; gap: 0.2rem; border-radius: 8px; text-align: center; color: var(--surface-white); }
      .sidebar-item.active { background: transparent; color: var(--accent-yellow); }
      .hide-mobile { display: none !important; }
      .job-card { flex-direction: column; align-items: flex-start; }
    }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, updateDoc, getDoc, serverTimestamp, collection, query, where, getDocs, onSnapshot, addDoc, orderBy, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBMKjt1RUZXVxTmadiCqKhNbzSPsNUDxV8",
      authDomain: "teacherbee-connect.firebaseapp.com",
      projectId: "teacherbee-connect",
      storageBucket: "teacherbee-connect.firebasestorage.app",
      messagingSenderId: "345613317767",
      appId: "1:345613317767:web:555713e479f9837e84aa22"
    };

    const app = initializeApp(firebaseConfig);
    window.auth = getAuth(app);
    window.db = getFirestore(app);
    window.fb = { doc, setDoc, updateDoc, getDoc, serverTimestamp, collection, query, where, getDocs, onSnapshot, addDoc, orderBy, deleteDoc, signOut };
    setPersistence(window.auth, browserLocalPersistence);

    let isRedirecting = false;

    onAuthStateChanged(window.auth, async (user) => {
      if (user) {
        const docRef = doc(window.db, "users", user.uid);
        const docSnap = await getDoc(docRef);
        
        if (docSnap.exists()) {
          const data = docSnap.data();
          if (data.role !== 'recruiter') {
            if (!isRedirecting) { isRedirecting = true; window.location.href = 'index.html'; }
            return;
          }

          window.currentUser = { uid: user.uid, ...data };
          let name = data.name || user.email.split('@')[0];
          let avatar = data.avatarUrl || "https://ui-avatars.com/api/?name=" + name + "&background=0A192F&color=FFD700";
          
          document.getElementById('nav-display-name').innerText = name;
          document.getElementById('nav-avatar-img').src = avatar;

          window.fetchPostedJobs();
        }
      } else {
        window.location.href = 'index.html';
      }
    });
  </script>
</head>
<body>

  <div id="toast-container"></div>

  <header>
    <a href="RecruiterProfile.html" class="brand-logo">
      <i class="fa-solid fa-graduation-cap"></i> TeacherBee <span class="recruiter-badge">Employer</span>
    </a>
    <div id="nav-actions">
      <div style="display:flex; align-items:center; gap:1rem;">
        <img src="https://ui-avatars.com/api/?name=Company&background=0A192F&color=FFD700" id="nav-avatar-img" style="width:35px; height:35px; border-radius:50%; object-fit:cover; border:2px solid var(--accent-yellow);" class="hide-mobile">
        <span style="font-weight:600; color:var(--surface-white);" id="nav-display-name" class="hide-mobile">Loading...</span>
        <button class="btn btn-danger btn-small" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket"></i></button>
      </div>
    </div>
  </header>

  <div class="app-container">
    
    <aside class="sidebar">
      <a href="RecruiterProfile.html" class="sidebar-item"><i class="fa-regular fa-user"></i> <span>Profile</span></a>
      <a href="Searchteachers.html" class="sidebar-item"><i class="fa-solid fa-users"></i> <span>Search Teachers</span></a>
      <a href="Postjobs.html" class="sidebar-item active"><i class="fa-solid fa-briefcase"></i> <span>Manage Jobs</span></a>
      <a href="RecruiterInbox.html" class="sidebar-item"><i class="fa-regular fa-envelope"></i> <span>Inbox</span></a>
      <a href="Subscriptions.html" class="sidebar-item"><i class="fa-solid fa-credit-card"></i> <span>Subscriptions</span></a>
    </aside>

    <main class="content-area">
      <section id="jobs-view">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; flex-wrap:wrap; gap:1rem;">
          <div>
            <h2>Manage Job Listings</h2>
            <p>Post new positions and track active recruitment postings.</p>
          </div>
          <button class="btn btn-primary" onclick="openPostModal()"><i class="fa-solid fa-plus"></i> Post New Job</button>
        </div>

        <div class="jobs-grid" id="jobs-container">
          <div style="text-align:center; padding: 2rem; color:var(--text-muted);" id="jobs-loading">
            <i class="fa-solid fa-spinner fa-spin" style="font-size: 2rem; margin-bottom:1rem;"></i>
            <p>Loading your jobs...</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- POST JOB MODAL -->
  <div class="modal-overlay" id="job-modal">
    <div class="modal-content">
      <button class="close-modal" onclick="closePostModal()">&times;</button>
      
      <h2 style="margin-bottom: 1.5rem;"><i class="fa-solid fa-briefcase" style="color:var(--accent-yellow);"></i> Post a New Job</h2>

      <form id="job-form" onsubmit="handleJobSubmit(event)">
        <div class="form-group">
          <label class="form-label">Job Title *</label>
          <input type="text" class="form-input" id="job-title" placeholder="e.g. High School Mathematics Teacher" required>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:1rem;">
          <div class="form-group">
            <label class="form-label">Subject / Field *</label>
            <input type="text" class="form-input" id="job-subject" placeholder="e.g. Mathematics" required>
          </div>
          <div class="form-group">
            <label class="form-label">Employment Type *</label>
            <select class="form-select" id="job-type" required>
              <option value="Full-Time">Full-Time</option>
              <option value="Part-Time">Part-Time</option>
              <option value="Contract">Contract</option>
              <option value="Online / Remote">Online / Remote</option>
            </select>
          </div>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:1rem;">
          <div class="form-group">
            <label class="form-label">Location *</label>
            <input type="text" class="form-input" id="job-location" placeholder="e.g. London, UK or Remote" required>
          </div>
          <div class="form-group">
            <label class="form-label">Salary / Compensation</label>
            <input type="text" class="form-input" id="job-salary" placeholder="e.g. $3,000 - $4,500 / month">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Job Description *</label>
          <textarea class="form-textarea" id="job-description" placeholder="Describe the role responsibilities, working hours, and expectations..." required></textarea>
        </div>

        <div style="margin-top: 2rem;">
          <button type="submit" class="btn btn-primary btn-block" id="btn-submit-job">
            <i class="fa-solid fa-paper-plane"></i> Publish Job Listing
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let myJobs = [];

    window.showToast = function(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-check' : 'fa-exclamation'}"></i> ${message}`;
      container.appendChild(toast);
      setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3500);
    };

    window.handleLogout = function() {
      if(window.auth && window.fb) window.fb.signOut(window.auth);
      window.location.href = 'index.html';
    };

    window.fetchPostedJobs = async function() {
      try {
        const q = window.fb.query(
          window.fb.collection(window.db, "jobs"),
          window.fb.where("recruiterId", "==", window.currentUser.uid)
        );
        const snapshot = await window.fb.getDocs(q);
        const container = document.getElementById('jobs-container');
        document.getElementById('jobs-loading').style.display = 'none';
        
        myJobs = [];
        snapshot.forEach(docSnap => myJobs.push({id: docSnap.id, ...docSnap.data()}));
        window.renderJobs(myJobs);
      } catch(e) {
        console.error(e);
        showToast("Error loading jobs.", "error");
      }
    };

    window.renderJobs = function(jobsArray) {
      const container = document.getElementById('jobs-container');
      container.innerHTML = '';

      if(jobsArray.length === 0) {
        container.innerHTML = `
          <div class="card" style="text-align:center; padding: 3rem;">
            <i class="fa-solid fa-briefcase" style="font-size:3rem; color:var(--text-muted); margin-bottom:1rem;"></i>
            <h3>No Jobs Posted Yet</h3>
            <p style="margin-bottom:1.5rem;">Create your first job listing to start receiving applications from top teachers.</p>
            <button class="btn btn-primary" onclick="openPostModal()"><i class="fa-solid fa-plus"></i> Post a Job</button>
          </div>
        `;
        return;
      }

      jobsArray.forEach(job => {
        const html = `
          <div class="job-card">
            <div class="job-info">
              <h3 style="font-size:1.2rem; margin-bottom:0.2rem;">${job.title}</h3>
              <p style="font-size:0.9rem; color:var(--text-muted);">${job.description ? job.description.substring(0, 120) + '...' : ''}</p>
              <div class="job-meta">
                <span class="badge badge-navy">${job.subject || 'General'}</span>
                <span class="badge badge-yellow">${job.type || 'Full-Time'}</span>
                <span class="badge badge-outline"><i class="fa-solid fa-location-dot"></i> ${job.location || 'Remote'}</span>
                ${job.salary ? `<span class="badge badge-outline"><i class="fa-solid fa-coins"></i> ${job.salary}</span>` : ''}
              </div>
            </div>
            <div style="display:flex; gap:0.5rem; align-items:center;">
              <button class="btn btn-danger btn-small" onclick="deleteJob('${job.id}')" title="Delete Job">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', html);
      });
    };

    window.openPostModal = function() {
      document.getElementById('job-form').reset();
      document.getElementById('job-modal').classList.add('active');
    };

    window.closePostModal = function() {
      document.getElementById('job-modal').classList.remove('active');
    };

    window.handleJobSubmit = async function(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('btn-submit-job');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Publishing...';

      try {
        const newJob = {
          recruiterId: window.currentUser.uid,
          recruiterName: window.currentUser.name || 'Employer',
          title: document.getElementById('job-title').value.trim(),
          subject: document.getElementById('job-subject').value.trim(),
          type: document.getElementById('job-type').value,
          location: document.getElementById('job-location').value.trim(),
          salary: document.getElementById('job-salary').value.trim(),
          description: document.getElementById('job-description').value.trim(),
          status: 'active',
          createdAt: window.fb.serverTimestamp()
        };

        const docRef = await window.fb.addDoc(window.fb.collection(window.db, "jobs"), newJob);
        showToast("Job listing published successfully!", "success");
        window.closePostModal();
        window.fetchPostedJobs();
      } catch(err) {
        console.error(err);
        showToast("Failed to publish job listing.", "error");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Publish Job Listing';
      }
    };

    window.deleteJob = async function(jobId) {
      if(!confirm("Are you sure you want to delete this job listing?")) return;
      try {
        await window.fb.deleteDoc(window.fb.doc(window.db, "jobs", jobId));
        showToast("Job deleted successfully.", "success");
        window.fetchPostedJobs();
      } catch(e) {
        console.error(e);
        showToast("Error deleting job.", "error");
      }
    };
  </script>
</body>
</html>
