<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TeacherBee Connect - Inbox</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* CORE STYLES */
    :root {
      --primary-navy: #0A192F; --navy-light: #172A45; --accent-yellow: #FFD700; --yellow-hover: #E5C100;
      --bg-color: #F8F9FA; --surface-white: #FFFFFF; --text-main: #111827; --text-muted: #6B7280;
      --border-color: #E5E7EB; --error-red: #EF4444; --success-green: #10B981;
      --radius-lg: 16px; --radius-md: 8px; --shadow-sm: 0 1px 2px rgba(0,0,0,0.05); --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; }
    h1, h2, h3, h4 { color: var(--primary-navy); font-weight: 700; margin-bottom: 0.5rem; }
    p { color: var(--text-muted); line-height: 1.5; }

    .btn { padding: 0.75rem 1.5rem; border-radius: var(--radius-md); font-weight: 600; font-size: 0.95rem; cursor: pointer; border: none; transition: all 0.2s ease; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; text-decoration: none; }
    .btn-primary { background-color: var(--accent-yellow); color: var(--primary-navy); }
    .btn-primary:hover { background-color: var(--yellow-hover); }
    .btn-danger { background-color: #FEE2E2; color: var(--error-red); padding: 0.5rem 1rem; }
    .btn-small { padding: 0.4rem 0.8rem; font-size: 0.85rem; }
    
    .form-input { width: 100%; padding: 0.85rem 1rem; border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 1rem; outline: none; transition: 0.2s; background: var(--surface-white); color: var(--text-main); }
    .form-input:focus { border-color: var(--primary-navy); box-shadow: 0 0 0 3px rgba(10, 25, 47, 0.1); }

    .app-container { display: flex; flex: 1; max-width: 1200px; margin: 0 auto; width: 100%; padding: 2rem; gap: 2rem; align-items: flex-start; }
    .content-area { flex: 1; display: flex; flex-direction: column; gap: 1.5rem; padding-bottom: 2rem; min-width: 0; }
    
    .card { background: var(--surface-white); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 1.5rem; box-shadow: var(--shadow-sm); margin-bottom: 1.5rem; }

    /* Messaging UI */
    .message-item { display: flex; justify-content: space-between; align-items: flex-start; padding: 1rem; border-bottom: 1px solid var(--border-color); cursor: pointer; transition: background 0.2s; }
    .message-item:hover { background: var(--bg-color); }
    .msg-content h4 { font-size: 1rem; margin-bottom: 0.25rem; color: var(--primary-navy); }
    
    #chat-window { display: none; background: var(--surface-white); border: 1px solid var(--border-color); border-radius: var(--radius-lg); overflow: hidden; flex-direction: column; height: 550px; }
    .chat-header { background: var(--primary-navy); color: white; padding: 1rem; display: flex; justify-content: space-between; align-items: center; }
    .chat-messages { flex: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; background: var(--bg-color); }
    .chat-bubble { max-width: 80%; padding: 0.75rem 1rem; border-radius: 12px; font-size: 0.9rem; word-wrap: break-word; position: relative; }
    .bubble-in { background: white; border: 1px solid var(--border-color); align-self: flex-start; border-bottom-left-radius: 2px; color: var(--text-main); }
    .bubble-out { background: var(--navy-light); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
    .chat-input-area { padding: 1rem; background: white; border-top: 1px solid var(--border-color); display: flex; gap: 0.5rem; align-items: center; }

    #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
    .toast { padding: 1rem 1.25rem; border-radius: var(--radius-md); color: var(--surface-white); font-weight: 600; font-size: 0.9rem; box-shadow: var(--shadow-md); animation: slideIn 0.3s ease forwards; display: flex; align-items: center; gap: 10px; }
    .toast.success { background-color: var(--success-green); }

    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    @media (max-width: 768px) {
      .app-container { padding: 1rem; }
    }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, updateDoc, getDoc, serverTimestamp, collection, query, where, getDocs, onSnapshot, addDoc, orderBy, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBMKjt1RUZXVxTmadiCqKhNbzSPsNUDxV8",
      authDomain: "teacherbee-connect.firebaseapp.com",
      projectId: "teacherbee-connect",
      storageBucket: "teacherbee-connect.firebasestorage.app",
      messagingSenderId: "345613317767",
      appId: "1:345613317767:web:555713e479f9837e84aa22"
    };

    const app = initializeApp(firebaseConfig);
    window.auth = getAuth(app);
    window.db = getFirestore(app);
    window.fb = { doc, setDoc, updateDoc, getDoc, serverTimestamp, collection, query, where, getDocs, onSnapshot, addDoc, orderBy, deleteDoc, signOut };
    setPersistence(window.auth, browserLocalPersistence);

    let isRedirecting = false;

    onAuthStateChanged(window.auth, async (user) => {
      if (user) {
        const docRef = doc(window.db, "users", user.uid);
        const docSnap = await getDoc(docRef);
        
        if (docSnap.exists()) {
          const data = docSnap.data();
          if (data.role !== 'recruiter') {
            if (!isRedirecting) { isRedirecting = true; window.location.href = 'index.html'; }
            return;
          }

          window.currentUser = { uid: user.uid, ...data };
          window.setupRealtimeInbox();
        }
      } else {
        window.location.href = 'index.html';
      }
    });
  </script>
</head>
<body>

  <div class="app-container">
    <main class="content-area">
      <section id="inbox-view">
        <div id="inbox-list-view">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 1.5rem;">
            <h2>Recruitment Inbox</h2>
          </div>
          <div class="card" style="padding: 0;" id="inbox-container">
            <div style="text-align:center; padding: 3rem; color:var(--text-muted);" id="empty-inbox">
              <i class="fa-regular fa-envelope-open" style="font-size: 3rem; margin-bottom: 1rem;"></i>
              <p>No messages or applications yet.</p>
            </div>
          </div>
        </div>

        <div id="chat-window">
          <div class="chat-header">
            <div>
              <h3 style="color:white; margin:0;" id="chat-title">Teacher Chat</h3>
            </div>
            <button class="btn btn-small" style="background:transparent; color:white; border:1px solid white;" onclick="closeChat()">Back</button>
          </div>
          <div class="chat-messages" id="chat-history"></div>
          <div class="chat-input-area">
            <input type="text" id="chat-input-box" class="form-input" placeholder="Type a message..." style="border-radius:20px;">
            <button class="btn btn-primary btn-small" style="border-radius:50%; width:40px; height:40px; padding:0;" onclick="sendChatMessage()"><i class="fa-solid fa-paper-plane"></i></button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwNnQ_Z0j9L5KU12ONFIsRVA2NnFDEna6TU4_-Tr1WaZQmNIdT0WL0A5WC0gsLxqvlj/exec";
    window.activeChatId = null;
    let activeChatUnsubscribe = null;

    window.handleLogout = function() {
      if(window.auth && window.fb) window.fb.signOut(window.auth);
      window.location.href = 'index.html';
    };

    window.setupRealtimeInbox = function() {
      const inboxQuery = window.fb.query(window.fb.collection(window.db, "threads"), window.fb.where("participants", "array-contains", window.currentUser.uid));
      
      window.fb.onSnapshot(inboxQuery, (snapshot) => {
        const container = document.getElementById('inbox-container');
        const empty = document.getElementById('empty-inbox');
        
        if (snapshot.empty) {
          empty.style.display = 'block';
          document.querySelectorAll('.message-item').forEach(el => el.remove());
          // Since the badge was in the sidebar which is now removed, we no longer need to update it here
          return;
        }
        
        empty.style.display = 'none';
        document.querySelectorAll('.message-item').forEach(el => el.remove());
        
        snapshot.forEach((docSnap) => {
          const thread = { id: docSnap.id, ...docSnap.data() };
          const subject = thread.jobTitle || 'Chat with Teacher';
          
          const html = `
            <div class="message-item" onclick="openChat('${thread.id}', '${subject}')">
              <div class="msg-content">
                <h4><i class="fa-solid fa-user-graduate" style="color:var(--accent-yellow);"></i> ${thread.teacherName || 'Teacher'}</h4>
                <p style="color:var(--primary-navy); font-weight:600; font-size:0.85rem;">${subject}</p>
                <p>Click to view conversation</p>
              </div>
            </div>
          `;
          container.insertAdjacentHTML('beforeend', html);
        });
      });
    };

    window.openChat = function(threadId, title) {
      window.activeChatId = threadId;
      document.getElementById('inbox-list-view').style.display = 'none';
      document.getElementById('chat-window').style.display = 'flex';
      document.getElementById('chat-title').innerText = title;

      if(activeChatUnsubscribe) activeChatUnsubscribe();

      const msgsQuery = window.fb.query(window.fb.collection(window.db, `threads/${threadId}/messages`), window.fb.orderBy("timestamp", "asc"));
      
      activeChatUnsubscribe = window.fb.onSnapshot(msgsQuery, (snapshot) => {
        const hist = document.getElementById('chat-history');
        hist.innerHTML = '<div style="text-align:center; font-size:0.75rem; color:var(--text-muted); margin-bottom:1rem;">Chat started</div>';
        
        snapshot.forEach((docSnap) => {
          const msg = docSnap.data();
          const bubbleClass = msg.senderId === window.currentUser.uid ? 'bubble-out' : 'bubble-in';
          hist.insertAdjacentHTML('beforeend', `<div class="chat-bubble ${bubbleClass}"><div>${msg.text}</div></div>`);
        });
        hist.scrollTop = hist.scrollHeight;
      });
    };

    window.closeChat = function() {
      document.getElementById('chat-window').style.display = 'none';
      document.getElementById('inbox-list-view').style.display = 'block';
      window.activeChatId = null;
      if(activeChatUnsubscribe) activeChatUnsubscribe();
    };

    window.sendChatMessage = async function() {
      const input = document.getElementById('chat-input-box');
      const text = input.value.trim();
      if (!text || !window.activeChatId) return;
      
      input.value = '';
      await window.fb.addDoc(window.fb.collection(window.db, `threads/${window.activeChatId}/messages`), {
        senderId: window.currentUser.uid,
        text: text,
        timestamp: window.fb.serverTimestamp()
      });
      await window.fb.updateDoc(window.fb.doc(window.db, "threads", window.activeChatId), { updatedAt: window.fb.serverTimestamp() });
    };
  </script>
</body>
</html>
