<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Payment Management · TeacherBee Connect</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary: #4F46E5; --primary-hover: #4338CA; --primary-light: #EEF2FF;
      --surface: #FFFFFF; --surface-alt: #F8FAFC; --bg-color: #F1F5F9;
      --text-main: #0F172A; --text-secondary: #334155; --text-muted: #64748B;
      --border: #E2E8F0; --border-light: #F1F5F9; --danger: #EF4444;
      --success: #10B981; --warning: #F59E0B;
      --radius-xs: 4px; --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px;
      --shadow-xs: 0 1px 2px rgba(0,0,0,0.04);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.06), 0 2px 4px rgba(0,0,0,0.04);
      --shadow-lg: 0 10px 25px rgba(0,0,0,0.08), 0 4px 10px rgba(0,0,0,0.04);
      --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--bg-color); color: var(--text-main); min-height: 100vh; }
    .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
    .top-bar h1 { font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; }
    .user-info { display: flex; align-items: center; gap: 1rem; background: var(--surface); padding: 0.5rem 1rem; border-radius: var(--radius-full); border: 1px solid var(--border); box-shadow: var(--shadow-xs); }
    .user-info img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
    .user-info span { font-weight: 600; font-size: 0.85rem; }
    .btn { padding: 0.65rem 1.2rem; border-radius: var(--radius-sm); font-weight: 500; font-size: 0.85rem; cursor: pointer; border: 1px solid transparent; transition: all var(--transition-fast); display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; text-decoration: none; }
    .btn-outline { background: var(--surface); border-color: var(--border); color: var(--text-secondary); }
    .btn-outline:hover { background: var(--surface-alt); border-color: #CBD5E1; }
    .btn-danger-outline { background: var(--surface); color: var(--danger); border-color: #FECACA; }
    .btn-danger-outline:hover { background: #FEF2F2; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-small { padding: 0.4rem 0.8rem; font-size: 0.75rem; }
    .status-badge {
      display: inline-block; padding: 0.25rem 0.7rem; border-radius: 20px;
      font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
    }
    .status-pending { background: #FEF3C7; color: #92400E; }
    .status-approved { background: #D1FAE5; color: #065F46; }
    .status-rejected { background: #FEE2E2; color: #991B1B; }
    .status-cancelled { background: #FEE2E2; color: #991B1B; }
    .filters { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; align-items: center; }
    .filters select, .filters input {
      padding: 0.65rem 1rem; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      font-family: inherit; font-size: 0.9rem; background: var(--surface);
    }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-xs); overflow: hidden; }
    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { text-align: left; padding: 0.9rem 0.75rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid var(--border); background: var(--surface-alt); }
    td { padding: 0.8rem 0.75rem; border-bottom: 1px solid var(--border-light); vertical-align: middle; }
    .customer-cell { display: flex; align-items: center; gap: 0.75rem; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--primary-light); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 0.8rem; color: var(--primary); overflow: hidden; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .action-btns { display: flex; gap: 0.3rem; flex-wrap: wrap; }
    .empty-state { text-align: center; padding: 3rem; color: var(--text-muted); }
    .empty-state i { font-size: 2.5rem; margin-bottom: 0.5rem; opacity: 0.5; }
    /* Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.6); backdrop-filter: blur(2px); z-index: 9999; display: none; justify-content: center; align-items: center; padding: 1.5rem; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: var(--surface); border-radius: var(--radius-lg); max-width: 650px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 2rem; position: relative; box-shadow: var(--shadow-lg); }
    .modal-close { position: absolute; top: 1rem; right: 1rem; background: none; border: none; font-size: 1.3rem; cursor: pointer; color: var(--text-muted); }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin: 1rem 0; }
    .detail-item { display: flex; flex-direction: column; }
    .detail-label { font-size: 0.7rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-bottom: 0.2rem; }
    .detail-value { font-weight: 500; color: var(--text-main); word-break: break-word; }
    /* Mobile card list (hidden on desktop) */
    .mobile-payment-list { display: none; }
    .payment-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 1rem; margin-bottom: 1rem; box-shadow: var(--shadow-xs); }
    .payment-card .flex-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.75rem; }
    .payment-card .customer { display: flex; align-items: center; gap: 0.5rem; }
    .payment-card .details-row { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.5rem; }
    .payment-card .actions { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.5rem; }

    @media (max-width: 768px) {
      .table-responsive { display: none; }
      .mobile-payment-list { display: block; }
      .container { padding: 1rem; }
      .top-bar h1 { font-size: 1.2rem; }
    }
    #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
    .toast { padding: 12px 20px; border-radius: var(--radius-sm); color: #fff; font-weight: 500; font-size: 0.85rem; animation: slideIn 0.3s ease; }
    .toast.success { background: var(--success); }
    .toast.error { background: var(--danger); }
    .toast.info { background: var(--text-secondary); }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  </style>
</head>
<body>
  <div id="toast-container"></div>
  <div class="container">
    <!-- Top bar -->
    <div class="top-bar">
      <h1><i class="fa-solid fa-file-invoice-dollar" style="color:var(--primary);"></i> Payment Management</h1>
      <div class="user-info" id="admin-info">
        <img id="admin-avatar" src="" alt="Admin">
        <span id="admin-name">Admin</span>
        <button class="btn btn-outline btn-small" onclick="signOut()"><i class="fa-solid fa-right-from-bracket"></i></button>
      </div>
    </div>

    <!-- Filters -->
    <div class="filters">
      <select id="status-filter" onchange="filterAndSearch()">
        <option value="all">All Statuses</option>
        <option value="pending">Pending</option>
        <option value="approved">Approved</option>
        <option value="rejected">Rejected</option>
        <option value="cancelled">Cancelled</option>
      </select>
      <input type="text" id="search-input" placeholder="Search by name or email..." oninput="filterAndSearch()">
    </div>

    <!-- Payments Table (Desktop) -->
    <div class="card table-responsive">
      <table id="payments-table">
        <thead>
          <tr>
            <th>Invoice</th>
            <th>Customer</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="payments-tbody">
          <tr><td colspan="6" class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i> Loading payments...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Payments Cards (Mobile) -->
    <div class="mobile-payment-list" id="mobile-payments"></div>
  </div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="detail-modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-times"></i></button>
      <h2 style="margin-bottom:1rem;">Invoice Details</h2>
      <div id="modal-body"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, collection, getDocs, query, where, orderBy, updateDoc, deleteDoc, setDoc, serverTimestamp, Timestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBMKjt1RUZXVxTmadiCqKhNbzSPsNUDxV8",
      authDomain: "teacherbee-connect.firebaseapp.com",
      projectId: "teacherbee-connect",
      storageBucket: "teacherbee-connect.firebasestorage.app",
      messagingSenderId: "345613317767",
      appId: "1:345613317767:web:555713e479f9837e84aa22"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentAdmin = null;
    let allPayments = [];
    let userCache = {}; // cache user data (including avatar)

    // Toast
    function showToast(msg, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = msg;
      container.appendChild(toast);
      setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = '0.2s'; setTimeout(() => toast.remove(), 200); }, 3500);
    }

    // Sign out
    window.signOut = async () => {
      await signOut(auth);
      window.location.href = 'admin.html';
    };

    // Auth check
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'admin.html';
        return;
      }
      // Check admin doc
      const adminDoc = await getDoc(doc(db, 'admins', user.uid));
      if (!adminDoc.exists()) {
        showToast('Access denied. Admin only.', 'error');
        await signOut(auth);
        window.location.href = 'admin.html';
        return;
      }
      currentAdmin = user;
      // Set admin UI
      document.getElementById('admin-name').textContent = user.email.split('@')[0];
      // Try to get admin avatar from users collection
      const userDoc = await getDoc(doc(db, 'users', user.uid));
      if (userDoc.exists() && userDoc.data().avatarUrl) {
        document.getElementById('admin-avatar').src = userDoc.data().avatarUrl;
      } else {
        document.getElementById('admin-avatar').src = `https://ui-avatars.com/api/?name=Admin&background=4F46E5&color=fff`;
      }
      loadPayments();
    });

    async function loadPayments() {
      try {
        const q = query(collection(db, 'payments'), orderBy('createdAt', 'desc'));
        const snap = await getDocs(q);
        allPayments = [];
        const userIds = new Set();
        snap.forEach(doc => {
          const data = doc.data();
          allPayments.push({ id: doc.id, ...data });
          if (data.userId) userIds.add(data.userId);
        });

        // Pre-fetch all unique user profiles for avatars
        for (const uid of userIds) {
          if (!userCache[uid]) {
            const userDoc = await getDoc(doc(db, 'users', uid));
            if (userDoc.exists()) {
              userCache[uid] = userDoc.data();
            } else {
              userCache[uid] = { name: 'Unknown', avatarUrl: null };
            }
          }
        }
        renderAll();
      } catch (e) {
        console.error(e);
        document.getElementById('payments-tbody').innerHTML = '<tr><td colspan="6" class="empty-state">Failed to load payments.</td></tr>';
      }
    }

    function getCustomerInfo(payment) {
      const cust = payment.customer || {};
      const user = userCache[payment.userId] || {};
      return {
        name: cust.name || user.name || 'Unknown',
        email: cust.email || user.email || '',
        avatar: user.avatarUrl || (cust.name ? null : null) // will be handled in template
      };
    }

    function renderAll() {
      const status = document.getElementById('status-filter').value;
      const search = document.getElementById('search-input').value.toLowerCase();
      let filtered = allPayments;
      if (status !== 'all') filtered = filtered.filter(p => p.status === status);
      if (search) {
        filtered = filtered.filter(p => {
          const info = getCustomerInfo(p);
          return (info.name || '').toLowerCase().includes(search) ||
                 (info.email || '').toLowerCase().includes(search) ||
                 (p.id || '').toLowerCase().includes(search);
        });
      }
      renderTable(filtered);
      renderMobileCards(filtered);
    }

    function renderTable(payments) {
      const tbody = document.getElementById('payments-tbody');
      if (payments.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty-state"><i class="fa-solid fa-inbox"></i> No payments found.</td></tr>';
        return;
      }
      tbody.innerHTML = payments.map(p => {
        const info = getCustomerInfo(p);
        const invId = p.id.substring(0,8).toUpperCase();
        const date = p.createdAt ? new Date(p.createdAt.toMillis()).toLocaleDateString('en-US', {year:'numeric', month:'short', day:'numeric'}) : '—';
        const avatarHtml = info.avatar
          ? `<div class="avatar"><img src="${escapeHTML(info.avatar)}" alt=""></div>`
          : `<div class="avatar">${(info.name.charAt(0) || '?').toUpperCase()}</div>`;
        return `
          <tr>
            <td><strong>#${invId}</strong></td>
            <td>
              <div class="customer-cell">
                ${avatarHtml}
                <div>
                  <div style="font-weight:600;">${escapeHTML(info.name)}</div>
                  <small style="color:var(--text-muted)">${escapeHTML(info.email)}</small>
                </div>
              </div>
            </td>
            <td><strong>$${p.amount || 0}</strong></td>
            <td><span class="status-badge status-${p.status || 'pending'}">${p.status || 'pending'}</span></td>
            <td>${date}</td>
            <td class="action-btns">
              <button class="btn btn-outline btn-small" onclick="viewDetails('${p.id}')"><i class="fa-solid fa-eye"></i></button>
              ${p.status === 'pending' ? `
                <button class="btn btn-primary btn-small" onclick="approvePayment('${p.id}')"><i class="fa-solid fa-check"></i> Approve</button>
                <button class="btn btn-danger-outline btn-small" onclick="rejectPayment('${p.id}')"><i class="fa-solid fa-xmark"></i> Reject</button>
              ` : ''}
              <button class="btn btn-danger-outline btn-small" onclick="deletePayment('${p.id}')"><i class="fa-solid fa-trash"></i></button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function renderMobileCards(payments) {
      const container = document.getElementById('mobile-payments');
      if (payments.length === 0) {
        container.innerHTML = '<div class="empty-state"><i class="fa-solid fa-inbox"></i> No payments found.</div>';
        return;
      }
      container.innerHTML = payments.map(p => {
        const info = getCustomerInfo(p);
        const invId = p.id.substring(0,8).toUpperCase();
        const date = p.createdAt ? new Date(p.createdAt.toMillis()).toLocaleDateString('en-US', {year:'numeric', month:'short', day:'numeric'}) : '—';
        const avatarHtml = info.avatar
          ? `<div class="avatar"><img src="${escapeHTML(info.avatar)}" alt=""></div>`
          : `<div class="avatar">${(info.name.charAt(0) || '?').toUpperCase()}</div>`;
        return `
          <div class="payment-card">
            <div class="flex-row">
              <div class="customer">
                ${avatarHtml}
                <div>
                  <strong>${escapeHTML(info.name)}</strong>
                  <small style="display:block; color:var(--text-muted)">${escapeHTML(info.email)}</small>
                </div>
              </div>
              <span class="status-badge status-${p.status || 'pending'}">${p.status || 'pending'}</span>
            </div>
            <div class="details-row">
              <span><strong>#${invId}</strong></span> · <span>$${p.amount || 0}</span> · <span>${date}</span>
            </div>
            <div class="actions">
              <button class="btn btn-outline btn-small" onclick="viewDetails('${p.id}')">View</button>
              ${p.status === 'pending' ? `
                <button class="btn btn-primary btn-small" onclick="approvePayment('${p.id}')">Approve</button>
                <button class="btn btn-danger-outline btn-small" onclick="rejectPayment('${p.id}')">Reject</button>
              ` : ''}
              <button class="btn btn-danger-outline btn-small" onclick="deletePayment('${p.id}')">Delete</button>
            </div>
          </div>
        `;
      }).join('');
    }

    window.filterAndSearch = renderAll;

    window.viewDetails = async (paymentId) => {
      const payment = allPayments.find(p => p.id === paymentId);
      if (!payment) return;
      const cust = payment.customer || {};
      const user = userCache[payment.userId] || {};
      const periodMap = { monthly:'Monthly', quarterly:'3 Months', biannually:'6 Months', annually:'12 Months' };
      const created = payment.createdAt ? new Date(payment.createdAt.toMillis()).toLocaleDateString('en-US') : '—';
      let userProfileHtml = '';
      if (user.name) {
        userProfileHtml = `
          <div style="margin-top:1rem; border-top:1px solid var(--border); padding-top:1rem;">
            <h4>User Profile</h4>
            <div class="customer-cell" style="margin-bottom:0.5rem;">
              <div class="avatar">${user.avatarUrl ? `<img src="${escapeHTML(user.avatarUrl)}">` : (user.name?.charAt(0) || '?').toUpperCase()}</div>
              <div>
                <strong>${escapeHTML(user.name || '—')}</strong><br>
                <small>${escapeHTML(user.email || '')}</small>
              </div>
            </div>
            <p><strong>Role:</strong> ${escapeHTML(user.role || '—')}</p>
          </div>`;
      }

      document.getElementById('modal-body').innerHTML = `
        <div class="detail-grid">
          <div class="detail-item"><span class="detail-label">Invoice #</span><span class="detail-value">#${payment.id.substring(0,8).toUpperCase()}</span></div>
          <div class="detail-item"><span class="detail-label">Date</span><span class="detail-value">${created}</span></div>
          <div class="detail-item"><span class="detail-label">Customer</span><span class="detail-value">${escapeHTML(cust.name || user.name || '—')}</span></div>
          <div class="detail-item"><span class="detail-label">Company</span><span class="detail-value">${escapeHTML(cust.company || '—')}</span></div>
          <div class="detail-item"><span class="detail-label">Email</span><span class="detail-value">${escapeHTML(cust.email || user.email || '—')}</span></div>
          <div class="detail-item"><span class="detail-label">Phone</span><span class="detail-value">${escapeHTML(cust.phone || '—')}</span></div>
          <div class="detail-item" style="grid-column: span 2;"><span class="detail-label">Address</span><span class="detail-value">${escapeHTML(cust.street || '')}, ${escapeHTML(cust.city || '')}, ${escapeHTML(cust.province || '')}, ${escapeHTML(cust.country || '')}</span></div>
        </div>
        <div style="background: #F8FAFC; padding: 1rem; border-radius: var(--radius-sm); margin: 1rem 0;">
          <strong>Plan:</strong> ${periodMap[payment.billingPeriod] || 'N/A'}<br>
          <strong>Amount:</strong> $${payment.amount || 0} USD<br>
          <strong>Status:</strong> <span class="status-badge status-${payment.status}">${payment.status}</span>
        </div>
        ${userProfileHtml}
      `;
      document.getElementById('detail-modal').classList.add('active');
    };

    window.closeModal = () => document.getElementById('detail-modal').classList.remove('active');

    window.approvePayment = async (paymentId) => {
      if (!confirm('Approve payment and activate subscription?')) return;
      try {
        const payment = allPayments.find(p => p.id === paymentId);
        if (!payment) return;
        const now = new Date();
        const period = payment.billingPeriod || 'monthly';
        let months = 1;
        if (period === 'quarterly') months = 3;
        else if (period === 'biannually') months = 6;
        else if (period === 'annually') months = 12;
        const expiry = new Date(now);
        expiry.setMonth(expiry.getMonth() + months);

        await updateDoc(doc(db, 'payments', paymentId), {
          status: 'approved',
          approvedBy: currentAdmin.uid,
          approvedAt: serverTimestamp()
        });

        await setDoc(doc(db, 'subscriptions', payment.userId), {
          userId: payment.userId,
          plan: period,
          billingPeriod: period,
          amount: payment.amount,
          status: 'active',
          startDate: Timestamp.fromDate(now),
          expiryDate: Timestamp.fromDate(expiry),
          approvedBy: currentAdmin.uid,
          approvedAt: serverTimestamp(),
          paymentId: paymentId,
          customer: payment.customer
        }, { merge: true });

        showToast('Payment approved! Subscription activated.', 'success');
        loadPayments();
      } catch (e) {
        console.error(e);
        showToast('Error approving payment.', 'error');
      }
    };

    window.rejectPayment = async (paymentId) => {
      if (!confirm('Reject this invoice?')) return;
      try {
        await updateDoc(doc(db, 'payments', paymentId), {
          status: 'rejected',
          rejectedBy: currentAdmin.uid,
          rejectedAt: serverTimestamp()
        });
        const payment = allPayments.find(p => p.id === paymentId);
        if (payment) {
          await setDoc(doc(db, 'subscriptions', payment.userId), {
            status: 'cancelled',
            cancelledAt: serverTimestamp()
          }, { merge: true });
        }
        showToast('Invoice rejected.', 'info');
        loadPayments();
      } catch (e) { showToast('Error.', 'error'); }
    };

    window.deletePayment = async (paymentId) => {
      if (!confirm('Permanently delete this invoice?')) return;
      try {
        await deleteDoc(doc(db, 'payments', paymentId));
        showToast('Invoice deleted.', 'success');
        loadPayments();
      } catch (e) { showToast('Error.', 'error'); }
    };

    function escapeHTML(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
