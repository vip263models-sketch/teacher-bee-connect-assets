<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Post Jobs — International Recruitment</title>
    <style>
        :root {
            --navy: #0F1F3D;
            --navy-light: #1A3052;
            --navy-surface: #162744;
            --mustard: #D4A017;
            --mustard-hover: #C08E0F;
            --mustard-soft: #FDF3D0;
            --mustard-light: #FEF9E7;
            --grey-bg: #F3F4F6;
            --grey-100: #F8F9FA;
            --grey-200: #E5E7EB;
            --grey-300: #D1D5DB;
            --grey-400: #9CA3AF;
            --grey-500: #6B7280;
            --grey-700: #374151;
            --grey-900: #111827;
            --white: #FFFFFF;
            --danger: #DC2626;
            --danger-soft: #FEF2F2;
            --danger-border: #FECACA;
            --success-emerald: #059669;
            --success-soft: #ECFDF5;

            --radius-xl: 16px;
            --radius-lg: 12px;
            --radius-md: 8px;
            --radius-sm: 6px;
            --radius-full: 9999px;

            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.08);
            --shadow-xl: 0 20px 50px rgba(0, 0, 0, 0.10);
            --shadow-navy: 0 6px 20px rgba(15, 31, 61, 0.25);

            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        #job-manager-app {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--grey-900);
            line-height: 1.6;
            width: 100%;
            -webkit-font-smoothing: antialiased;
            background: var(--grey-bg);
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        #job-manager-app .hidden {
            display: none !important;
        }

        .jm-container {
            width: 100%;
            max-width: 100%;
            margin: 0;
            padding: 0;
        }

        .jm-header {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 22px 32px;
            background: var(--navy);
            width: 100%;
            flex-wrap: wrap;
        }
        @media (max-width: 600px) {
            .jm-header {
                padding: 16px 16px;
                flex-direction: column;
                align-items: stretch;
            }
        }

        .jm-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #FFFFFF;
            margin: 0;
            letter-spacing: -0.01em;
            white-space: nowrap;
        }

        .jm-btn {
            font-family: inherit;
            font-weight: 600;
            font-size: 0.875rem;
            border: none;
            border-radius: var(--radius-md);
            padding: 12px 22px;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-transform: none;
            letter-spacing: 0;
            white-space: nowrap;
            text-decoration: none;
            line-height: 1.3;
        }

        .jm-btn-primary {
            background: var(--mustard);
            color: #1A1A1A;
            font-weight: 700;
            box-shadow: var(--shadow-md);
            border: 1px solid transparent;
        }
        .jm-btn-primary:hover {
            background: var(--mustard-hover);
            box-shadow: var(--shadow-lg);
            transform: translateY(-1px);
        }

        .jm-btn-outline {
            background: transparent;
            border: 1.5px solid var(--grey-300);
            color: var(--grey-700);
            font-weight: 500;
        }
        .jm-btn-outline:hover {
            background: var(--grey-100);
            border-color: var(--grey-400);
            color: var(--grey-900);
        }

        .jm-btn-outline-danger {
            background: transparent;
            color: var(--danger);
            border: 1.5px solid var(--danger-border);
            font-weight: 500;
        }
        .jm-btn-outline-danger:hover {
            background: var(--danger-soft);
            border-color: var(--danger);
        }

        #dashboardView>.jm-header {
            margin-bottom: 0;
        }
        #jobsGrid,
        #emptyState {
            padding: 28px 32px;
        }
        @media (max-width: 600px) {
            #jobsGrid,
            #emptyState {
                padding: 20px 16px;
            }
        }

        .jm-jobs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 24px;
            width: 100%;
        }
        @media (max-width: 500px) {
            .jm-jobs-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }
        }

        .jm-card {
            background: var(--white);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-sm);
            transition: var(--transition-slow);
            display: flex;
            flex-direction: column;
            height: 100%;
            border: 1px solid var(--grey-200);
            overflow: hidden;
            position: relative;
        }
        .jm-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-3px);
            border-color: var(--grey-300);
        }

        .jm-card-banner {
            width: 100%;
            height: 140px;
            object-fit: cover;
            display: block;
            border-bottom: 1px solid var(--grey-200);
        }

        .jm-card-body {
            padding: 24px 26px 22px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .jm-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
            gap: 12px;
        }
        .jm-card-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--navy);
            line-height: 1.3;
            letter-spacing: -0.01em;
        }
        .jm-card-employer {
            font-size: 0.95rem;
            color: var(--grey-700);
            font-weight: 500;
        }

        .jm-badge {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: var(--radius-full);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            flex-shrink: 0;
            line-height: 1;
        }
        .jm-badge.open {
            background: var(--mustard-soft);
            color: #8B6914;
            border: 1px solid transparent;
        }
        .jm-badge.closed {
            background: var(--grey-100);
            color: var(--grey-500);
            border: 1px solid var(--grey-200);
        }

        .jm-card-divider {
            height: 1px;
            background: var(--grey-200);
            margin: 0 0 18px 0;
            width: 100%;
        }

        .jm-card-details {
            font-size: 0.875rem;
            color: var(--grey-500);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px 10px;
            margin-bottom: 24px;
        }
        .jm-detail-item {
            display: flex;
            align-items: center;
            gap: 7px;
            font-weight: 500;
        }
        .jm-detail-icon {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
            color: var(--grey-400);
        }

        .jm-card-actions {
            margin-top: auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .jm-card-actions button {
            width: 100%;
            padding: 10px 14px;
            font-size: 0.8rem;
            border-radius: var(--radius-sm);
        }

        .jm-empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--grey-500);
            background: var(--white);
            border-radius: var(--radius-xl);
            border: 2px dashed var(--grey-300);
            margin: 28px 32px;
        }
        .jm-empty-state svg {
            width: 56px;
            height: 56px;
            margin-bottom: 16px;
            opacity: 0.35;
            color: var(--grey-400);
        }
        .jm-empty-state h3 {
            color: var(--grey-700);
            font-weight: 700;
            font-size: 1.15rem;
            margin: 0 0 6px;
        }
        .jm-empty-state p {
            margin: 0;
            font-size: 0.9rem;
        }

        .jm-editor-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 28px;
            width: 100%;
            padding: 28px 32px;
        }
        @media (min-width: 1024px) {
            .jm-editor-layout {
                grid-template-columns: 1.15fr 1fr;
                gap: 32px;
            }
        }
        @media (max-width: 600px) {
            .jm-editor-layout {
                padding: 16px;
                gap: 20px;
            }
        }

        .jm-panel {
            background: var(--white);
            border-radius: var(--radius-xl);
            border: 1px solid var(--grey-200);
            padding: 32px 30px;
            box-shadow: var(--shadow-sm);
            width: 100%;
            overflow: hidden;
            color: var(--grey-900);
        }
        @media (max-width: 600px) {
            .jm-panel {
                padding: 20px 16px;
            }
        }

        .jm-preview-panel {
            background: transparent;
            border: none;
            box-shadow: none;
            padding: 0;
            border-radius: 0;
        }
        .jm-preview-panel-header {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--grey-500);
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .jm-form-group {
            margin-bottom: 22px;
            width: 100%;
        }
        .jm-input-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 22px;
            margin-bottom: 22px;
        }
        @media (min-width: 600px) {
            .jm-input-row {
                grid-template-columns: 1fr 1fr;
            }
        }

        .jm-panel label {
            display: block;
            font-size: 0.78rem;
            font-weight: 700;
            margin-bottom: 7px;
            color: var(--grey-500);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .jm-panel input,
        .jm-panel select,
        .jm-panel textarea {
            width: 100%;
            padding: 14px 16px;
            border-radius: var(--radius-md);
            border: 1.5px solid var(--grey-200);
            background: var(--grey-100);
            color: var(--grey-900);
            font-family: inherit;
            font-size: 15px;
            transition: var(--transition);
            box-sizing: border-box;
        }
        .jm-panel input::placeholder,
        .jm-panel textarea::placeholder {
            color: var(--grey-400);
        }
        .jm-panel input:focus,
        .jm-panel select:focus,
        .jm-panel textarea:focus {
            outline: none;
            border-color: var(--mustard);
            box-shadow: 0 0 0 3px rgba(212, 160, 23, 0.08);
            background: var(--white);
        }
        .jm-panel textarea {
            resize: vertical;
            min-height: 130px;
        }

        .jm-upload-zone {
            border: 2px dashed var(--grey-300);
            border-radius: var(--radius-md);
            padding: 28px 20px;
            text-align: center;
            background: var(--grey-100);
            transition: var(--transition);
            cursor: pointer;
        }
        .jm-upload-zone:hover {
            border-color: var(--mustard);
            background: var(--mustard-light);
        }
        #bannerPreviewThumb {
            max-width: 100%;
            max-height: 180px;
            border-radius: var(--radius-sm);
            margin-top: 14px;
            display: none;
            object-fit: cover;
            border: 1px solid var(--grey-200);
        }

        .jm-applicant-card {
            background: #FFFFFF;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            border: 1px solid var(--grey-200);
        }

        .jm-applicant-top-bar {
            height: 7px;
            background-color: var(--navy);
            width: 100%;
        }

        .jm-preview-banner {
            width: 100%;
            height: 150px;
            object-fit: cover;
            display: none;
        }

        .jm-applicant-body {
            padding: 32px 26px 28px;
        }
        @media (max-width: 500px) {
            .jm-applicant-body {
                padding: 22px 16px 20px;
            }
        }

        .jm-preview-title {
            font-size: 1.5rem;
            margin-bottom: 12px;
            color: var(--navy);
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.25;
        }

        .jm-preview-employer {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--grey-500);
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 20px;
        }

        .jm-pill-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 24px;
        }
        .jm-pill {
            background: var(--grey-100);
            color: var(--grey-700);
            padding: 8px 15px;
            border-radius: var(--radius-full);
            font-size: 0.82rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--grey-200);
        }
        .jm-pill svg {
            width: 13px;
            height: 13px;
            opacity: 0.6;
            flex-shrink: 0;
        }

        .jm-preview-desc {
            font-size: 0.95rem;
            color: var(--grey-700);
            white-space: pre-wrap;
            line-height: 1.7;
            margin-bottom: 28px;
        }

        .jm-btn-apply {
            width: 100%;
            background: var(--mustard);
            color: #1A1A1A;
            padding: 16px;
            border-radius: var(--radius-lg);
            font-size: 1.05rem;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(212, 160, 23, 0.30);
            border: none;
            cursor: pointer;
            text-transform: none;
            letter-spacing: normal;
            transition: var(--transition);
        }
        .jm-btn-apply:hover {
            background: var(--mustard-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(212, 160, 23, 0.38);
        }

        .jm-toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }
        .jm-toast {
            padding: 14px 22px;
            border-radius: var(--radius-md);
            color: #FFF;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: var(--shadow-xl);
            animation: jm-slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        .jm-toast.success {
            background: var(--navy-light);
        }
        .jm-toast.error {
            background: var(--danger);
        }
        .jm-toast.info {
            background: var(--grey-700);
        }

        @keyframes jm-slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .jm-fade-enter {
            animation: jm-fadeIn 0.45s ease forwards;
        }
        @keyframes jm-fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .jm-card-body {
                padding: 20px 18px 18px;
            }
            .jm-card-title {
                font-size: 1.05rem;
            }
            .jm-card-details {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            .jm-card-actions {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .jm-card-actions button {
                padding: 10px 8px;
                font-size: 0.75rem;
            }
            .jm-header {
                padding: 14px 16px;
            }
            .jm-title {
                font-size: 1.05rem;
            }
            #jobsGrid,
            #emptyState {
                padding: 16px;
            }
            .jm-editor-layout {
                padding: 16px;
            }
            .jm-preview-title {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>

    <div id="job-manager-app">
        <div id="toastContainer" class="jm-toast-container"></div>

        <!-- Dashboard View -->
        <div id="dashboardView" class="jm-container jm-fade-enter">
            <div class="jm-header">
                <span style="font-weight:700;font-size:1.1rem;color:#FFFFFF;letter-spacing:-0.01em;">📋 Job Board</span>
                <button class="jm-btn jm-btn-primary" onclick="app.showEditor()">+ Post Job</button>
            </div>

            <div id="jobsGrid" class="jm-jobs-grid"></div>

            <div id="emptyState" class="jm-empty-state hidden">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                <h3>No jobs posted yet</h3>
                <p>Click "+ Post Job" to create your first listing.</p>
            </div>
        </div>

        <!-- Editor View -->
        <div id="editorView" class="jm-container hidden">
            <div class="jm-header">
                <h1 class="jm-title" id="editorTitle">Create New Job</h1>
                <button class="jm-btn jm-btn-outline" style="color:#FFFFFF;border-color:rgba(255,255,255,0.4);" onclick="app.showDashboard()">Cancel &amp; Return</button>
            </div>

            <div class="jm-editor-layout">
                <div class="jm-panel">
                    <form id="jobForm" onsubmit="event.preventDefault(); app.saveJob();">
                        <input type="hidden" id="jobId" value="">
                        <input type="hidden" id="jobStatus" value="open">

                        <div class="jm-form-group">
                            <label>Job Banner Image (Optional)</label>
                            <div class="jm-upload-zone">
                                <input type="file" id="bannerInput" accept="image/*" style="display:none;" onchange="app.uploadBanner(this)" />
                                <input type="hidden" id="bannerUrl" value="">
                                <button type="button" class="jm-btn jm-btn-outline" onclick="document.getElementById('bannerInput').click()">Select Image</button>
                                <img id="bannerPreviewThumb" src="" alt="Banner Thumbnail">
                            </div>
                        </div>

                        <div class="jm-form-group">
                            <label>Job Title*</label>
                            <input type="text" id="title" required placeholder="e.g. Senior Frontend Developer">
                        </div>

                        <div class="jm-input-row">
                            <div><label>Employer / Company*</label><input type="text" id="employerName" required placeholder="Company Name"></div>
                            <div><label>Subject Area</label><input type="text" id="subject" placeholder="e.g. Engineering, Mathematics"></div>
                        </div>

                        <div class="jm-input-row">
                            <div><label>Location*</label><input type="text" id="location" required placeholder="City, Remote, etc."></div>
                            <div><label>Employment Type*</label>
                                <select id="type" required>
                                    <option value="Full-time">Full-time</option>
                                    <option value="Part-time">Part-time</option>
                                    <option value="Contract">Contract</option>
                                    <option value="Freelance">Freelance</option>
                                </select>
                            </div>
                        </div>

                        <div class="jm-input-row">
                            <div><label>Salary/Pay</label><input type="text" id="pay" placeholder="e.g. $80k - $100k"></div>
                            <div><label>Vacancies</label><input type="number" id="vacancies" min="1" value="1"></div>
                        </div>

                        <div class="jm-form-group">
                            <label>Application Deadline</label>
                            <input type="date" id="deadline">
                        </div>

                        <div class="jm-form-group">
                            <label>Job Description*</label>
                            <textarea id="description" required placeholder="Describe the role..."></textarea>
                        </div>

                        <div class="jm-form-group">
                            <label>Requirements</label>
                            <textarea id="requirements" placeholder="List key requirements..."></textarea>
                        </div>

                        <button type="submit" id="saveBtn" class="jm-btn jm-btn-primary" style="width: 100%; padding: 16px; font-size: 1rem; margin-top: 8px;">Publish Job Post</button>
                    </form>
                </div>

                <div class="jm-preview-panel">
                    <div class="jm-preview-panel-header">Applicant View Preview</div>
                    <div class="jm-applicant-card">
                        <div id="prevTopBar" class="jm-applicant-top-bar"></div>
                        <img id="prevBanner" class="jm-preview-banner" src="" alt="Job Banner">
                        <div class="jm-applicant-body">
                            <h2 class="jm-preview-title" id="prevTitle">Untitled Position</h2>
                            <div class="jm-preview-employer">
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect><path d="M9 22v-4h6v4"></path><path d="M8 6h.01"></path><path d="M16 6h.01"></path><path d="M12 6h.01"></path><path d="M12 10h.01"></path><path d="M12 14h.01"></path><path d="M16 10h.01"></path><path d="M16 14h.01"></path><path d="M8 10h.01"></path><path d="M8 14h.01"></path></svg>
                                <span id="prevEmployer">Confidential Employer</span>
                            </div>
                            <div class="jm-pill-container">
                                <div class="jm-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"></path><circle cx="12" cy="10" r="3"></circle></svg><span id="prevLocation">Location Not Specified</span></div>
                                <div class="jm-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg><span id="prevType">Full-time</span></div>
                                <div class="jm-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg><span id="prevDeadline">Open Until Filled</span></div>
                                <div class="jm-pill hidden" id="prevPayPill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg><span id="prevPay"></span></div>
                                <div class="jm-pill hidden" id="prevVacanciesPill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg><span id="prevVacancies"></span></div>
                            </div>
                            <div class="jm-preview-desc" id="prevDesc">The job description you provide will appear here...</div>
                            <div class="jm-preview-desc hidden" id="prevReqsContainer"><strong>Requirements:</strong><br/><span id="prevReqs"></span></div>
                            <button class="jm-btn-apply" type="button" onclick="app.showToast('This is a preview button', 'info')">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                                Apply Now
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, addDoc, serverTimestamp, query, where, onSnapshot, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBMKjt1RUZXVxTmadiCqKhNbzSPsNUDxV8",
            authDomain: "teacherbee-connect.firebaseapp.com",
            projectId: "teacherbee-connect",
            storageBucket: "teacherbee-connect.firebasestorage.app",
            messagingSenderId: "345613317767",
            appId: "1:345613317767:web:555713e479f9837e84aa22"
        };

        const fbApp = initializeApp(firebaseConfig);
        window.auth = getAuth(fbApp);
        window.db = getFirestore(fbApp);
        window.fb = { doc, getDoc, collection, addDoc, serverTimestamp, query, where, onSnapshot, updateDoc, deleteDoc };
        setPersistence(window.auth, browserLocalPersistence);

        onAuthStateChanged(window.auth, (user) => {
            if (!user) {
                window.location.href = 'https://teacherbeeconnect.blogspot.com/p/index_01629774816.html';
            } else {
                window.currentUser = user;
                app.initDashboard();
            }
        });
    </script>

    <script>
        const GAS_UPLOAD_URL = "https://script.google.com/macros/s/AKfycbwNnQ_Z0j9L5KU12ONFIsRVA2NnFDEna6TU4_-Tr1WaZQmNIdT0WL0A5WC0gsLxqvlj/exec";

        const ICONS = {
            location: `<svg class="jm-detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>`,
            type: `<svg class="jm-detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>`,
            pay: `<svg class="jm-detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"></rect><circle cx="12" cy="12" r="2"></circle><path d="M6 12h.01M18 12h.01"></path></svg>`,
            calendar: `<svg class="jm-detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>`
        };

        const app = {
            unsubscribeSnapshot: null,
            jobs: [],

            showDashboard: () => {
                document.getElementById('editorView').classList.add('hidden');
                document.getElementById('dashboardView').classList.remove('hidden');
                app.resetForm();
            },

            showEditor: async (isEdit = false) => {
                // Check subscription before allowing editor access
                const subscribed = await app.checkSubscriptionStatus(window.currentUser.uid);
                if (!subscribed) {
                    app.showToast('You need an active subscription to post jobs. Redirecting...', 'error');
                    setTimeout(() => {
                        window.location.href = 'subscriptions.html';
                    }, 1500);
                    return;
                }

                document.getElementById('dashboardView').classList.add('hidden');
                document.getElementById('editorView').classList.remove('hidden');
                document.getElementById('editorTitle').innerText = isEdit ? "Edit Job Listing" : "Create New Job";
                document.getElementById('saveBtn').innerText = isEdit ? "Update Job Listing" : "Publish Job Post";
                if (!isEdit) {
                    app.resetForm();
                    app.updatePreview();
                }
            },

            checkSubscriptionStatus: async (uid) => {
                try {
                    const { doc, getDoc } = window.fb;
                    const subDoc = await getDoc(doc(window.db, 'subscriptions', uid));
                    if (subDoc.exists()) {
                        const data = subDoc.data();
                        if (data.status === 'active' && data.expiryDate && data.expiryDate.toMillis() > Date.now()) {
                            return true;
                        }
                    }
                    return false;
                } catch (e) {
                    console.error('Subscription check failed', e);
                    return false;
                }
            },

            initDashboard: () => {
                const { collection, query, where, onSnapshot } = window.fb;
                const jobsRef = collection(window.db, "jobs");
                const q = query(jobsRef, where("recruiterId", "==", window.currentUser.uid));

                app.unsubscribeSnapshot = onSnapshot(q, (snapshot) => {
                    app.jobs = [];
                    snapshot.forEach((doc) => {
                        app.jobs.push({ id: doc.id, ...doc.data() });
                    });
                    app.jobs.sort((a, b) => {
                        const tA = a.createdAt ? a.createdAt.toMillis() : 0;
                        const tB = b.createdAt ? b.createdAt.toMillis() : 0;
                        return tB - tA;
                    });
                    app.renderJobsGrid();
                }, (error) => {
                    app.showToast("Error loading jobs", "error");
                });
            },

            renderJobsGrid: () => {
                const grid = document.getElementById('jobsGrid');
                const emptyState = document.getElementById('emptyState');
                grid.innerHTML = "";

                if (app.jobs.length === 0) {
                    emptyState.classList.remove('hidden');
                } else {
                    emptyState.classList.add('hidden');

                    app.jobs.forEach(job => {
                        const statusClass = job.status === 'open' ? 'open' : 'closed';
                        const deadlineTxt = job.deadline ? new Date(job.deadline).toLocaleDateString() : 'Open';

                        const card = document.createElement('div');
                        card.className = "jm-card jm-fade-enter";

                        if (job.bannerUrl) {
                            const img = document.createElement('img');
                            img.className = "jm-card-banner";
                            img.src = job.bannerUrl;
                            img.alt = "Job Banner";
                            card.appendChild(img);
                        }

                        const body = document.createElement('div');
                        body.className = "jm-card-body";
                        body.innerHTML = `
                            <div class="jm-card-header">
                                <div>
                                    <div class="jm-card-title">${app.escapeHTML(job.title)}</div>
                                    <div class="jm-card-employer">${app.escapeHTML(job.employerName)}</div>
                                </div>
                                <span class="jm-badge ${statusClass}">${job.status}</span>
                            </div>
                            <div class="jm-card-divider"></div>
                            <div class="jm-card-details">
                                <div class="jm-detail-item">${ICONS.location} <span>${app.escapeHTML(job.location)}</span></div>
                                <div class="jm-detail-item">${ICONS.type} <span>${job.type}</span></div>
                                <div class="jm-detail-item">${ICONS.pay} <span>${job.pay || 'N/A'}</span></div>
                                <div class="jm-detail-item">${ICONS.calendar} <span>${deadlineTxt}</span></div>
                            </div>
                            <div class="jm-card-actions">
                                <button class="jm-btn jm-btn-outline" onclick="app.editJob('${job.id}')">EDIT</button>
                                <button class="jm-btn jm-btn-outline" onclick="app.toggleStatus('${job.id}', '${job.status}')">${job.status === 'open' ? 'CLOSE' : 'REOPEN'}</button>
                                <button class="jm-btn jm-btn-outline" onclick="app.duplicateJob('${job.id}')">COPY</button>
                                <button class="jm-btn jm-btn-outline-danger" onclick="app.deleteJob('${job.id}')">DELETE</button>
                            </div>
                        `;
                        card.appendChild(body);
                        grid.appendChild(card);
                    });
                }
            },

            saveJob: async () => {
                // Double-check subscription before saving
                const subscribed = await app.checkSubscriptionStatus(window.currentUser.uid);
                if (!subscribed) {
                    app.showToast('Your subscription is no longer active. Please subscribe to post jobs.', 'error');
                    setTimeout(() => { window.location.href = 'subscriptions.html'; }, 1500);
                    return;
                }

                const form = document.getElementById('jobForm');
                if (!form.checkValidity()) { form.reportValidity(); return; }

                const { doc, collection, addDoc, updateDoc, serverTimestamp } = window.fb;
                const jobId = document.getElementById('jobId').value;
                const btn = document.getElementById('saveBtn');
                const originalText = btn.innerText;

                const jobData = {
                    title: document.getElementById('title').value,
                    employerName: document.getElementById('employerName').value,
                    subject: document.getElementById('subject').value,
                    location: document.getElementById('location').value,
                    type: document.getElementById('type').value,
                    pay: document.getElementById('pay').value,
                    vacancies: parseInt(document.getElementById('vacancies').value) || 1,
                    deadline: document.getElementById('deadline').value,
                    description: document.getElementById('description').value,
                    requirements: document.getElementById('requirements').value,
                    bannerUrl: document.getElementById('bannerUrl').value,
                    status: document.getElementById('jobStatus').value || 'open',
                    updatedAt: serverTimestamp()
                };

                try {
                    btn.innerText = "SAVING...";
                    btn.disabled = true;
                    if (jobId) {
                        await updateDoc(doc(window.db, "jobs", jobId), jobData);
                        app.showToast("Job updated successfully", "success");
                    } else {
                        jobData.recruiterId = window.currentUser.uid;
                        jobData.applicantsCount = 0;
                        jobData.createdAt = serverTimestamp();
                        await addDoc(collection(window.db, "jobs"), jobData);
                        app.showToast("Job posted successfully", "success");
                    }
                    app.showDashboard();
                } catch (error) {
                    app.showToast("Error saving job", "error");
                } finally {
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            },

            deleteJob: async (id) => {
                if (!confirm("Delete this job posting permanently?")) return;
                try {
                    await window.fb.deleteDoc(window.fb.doc(window.db, "jobs", id));
                    app.showToast("Job deleted", "success");
                } catch (err) { app.showToast("Failed to delete job", "error"); }
            },

            toggleStatus: async (id, currentStatus) => {
                try {
                    const newStatus = currentStatus === 'open' ? 'closed' : 'open';
                    await window.fb.updateDoc(window.fb.doc(window.db, "jobs", id), { status: newStatus, updatedAt: window.fb.serverTimestamp() });
                    app.showToast(`Status changed to ${newStatus}`, "success");
                } catch (err) { app.showToast("Update failed", "error"); }
            },

            duplicateJob: async (id) => {
                try {
                    const job = app.jobs.find(j => j.id === id);
                    if (!job) return;
                    const copyData = { ...job };
                    delete copyData.id;
                    copyData.title = `${copyData.title} (Copy)`;
                    copyData.createdAt = window.fb.serverTimestamp();
                    copyData.updatedAt = window.fb.serverTimestamp();
                    copyData.status = 'open';
                    copyData.applicantsCount = 0;
                    await window.fb.addDoc(window.fb.collection(window.db, "jobs"), copyData);
                    app.showToast("Job copied", "success");
                } catch (err) { app.showToast("Failed to duplicate", "error"); }
            },

            editJob: async (id) => {
                // Editing also requires subscription
                const subscribed = await app.checkSubscriptionStatus(window.currentUser.uid);
                if (!subscribed) {
                    app.showToast('You need an active subscription to edit jobs. Redirecting...', 'error');
                    setTimeout(() => { window.location.href = 'subscriptions.html'; }, 1500);
                    return;
                }

                const job = app.jobs.find(j => j.id === id);
                if (!job) return;
                document.getElementById('jobId').value = job.id;
                document.getElementById('jobStatus').value = job.status;
                document.getElementById('bannerUrl').value = job.bannerUrl || "";
                document.getElementById('title').value = job.title || "";
                document.getElementById('employerName').value = job.employerName || "";
                document.getElementById('subject').value = job.subject || "";
                document.getElementById('location').value = job.location || "";
                document.getElementById('type').value = job.type || "Full-time";
                document.getElementById('pay').value = job.pay || "";
                document.getElementById('vacancies').value = job.vacancies || 1;
                document.getElementById('deadline').value = job.deadline || "";
                document.getElementById('description').value = job.description || "";
                document.getElementById('requirements').value = job.requirements || "";

                const thumb = document.getElementById('bannerPreviewThumb');
                if (job.bannerUrl) { thumb.src = job.bannerUrl; thumb.style.display = 'block'; } else { thumb.style.display = 'none'; }
                app.updatePreview();
                app.showEditor(true);
            },

            uploadBanner: (inputElement) => {
                const file = inputElement.files[0];
                if (!file) return;
                app.showToast("Uploading image...", "info");
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const payload = { action: 'uploadProfile', fileName: file.name, mimeType: file.type || "application/octet-stream", file: e.target.result };
                    try {
                        const res = await fetch(GAS_UPLOAD_URL, { method: "POST", body: JSON.stringify(payload) });
                        const data = await res.json();
                        if (data.status === "success" && data.profilePic?.url) {
                            document.getElementById('bannerUrl').value = data.profilePic.url;
                            const thumb = document.getElementById('bannerPreviewThumb');
                            thumb.src = data.profilePic.url;
                            thumb.style.display = 'block';
                            app.updatePreview();
                            app.showToast("Upload complete", "success");
                        } else { app.showToast("Upload failed", "error"); }
                    } catch (err) { app.showToast("Network error", "error"); }
                    inputElement.value = "";
                };
                reader.readAsDataURL(file);
            },

            updatePreview: () => {
                const v = (id) => document.getElementById(id).value;
                const bannerUrl = v('bannerUrl');
                document.getElementById('prevTitle').innerText = v('title') || "Untitled Position";
                document.getElementById('prevEmployer').innerText = v('employerName') || "Confidential Employer";
                document.getElementById('prevLocation').innerText = v('location') || "Location Not Specified";
                document.getElementById('prevType').innerText = v('type') || "Full-time";
                document.getElementById('prevDeadline').innerText = v('deadline') || "Open Until Filled";
                document.getElementById('prevDesc').innerText = v('description') || "The job description you provide will appear here...";

                const payPill = document.getElementById('prevPayPill');
                if (v('pay')) { document.getElementById('prevPay').innerText = v('pay'); payPill.classList.remove('hidden'); } else { payPill.classList.add('hidden'); }

                const vacPill = document.getElementById('prevVacanciesPill');
                if (v('vacancies') && parseInt(v('vacancies')) > 1) { document.getElementById('prevVacancies').innerText = `${v('vacancies')} Vacancies`; vacPill.classList.remove('hidden'); } else { vacPill.classList.add('hidden'); }

                const reqContainer = document.getElementById('prevReqsContainer');
                if (v('requirements')) { document.getElementById('prevReqs').innerText = v('requirements'); reqContainer.classList.remove('hidden'); } else { reqContainer.classList.add('hidden'); }

                const bannerImg = document.getElementById('prevBanner');
                const topBar = document.getElementById('prevTopBar');
                if (bannerUrl) { bannerImg.src = bannerUrl; bannerImg.style.display = "block"; topBar.style.display = "none"; } else { bannerImg.style.display = "none"; topBar.style.display = "block"; }
            },

            resetForm: () => {
                document.getElementById('jobForm').reset();
                document.getElementById('jobId').value = "";
                document.getElementById('bannerUrl').value = "";
                document.getElementById('jobStatus').value = "open";
                document.getElementById('bannerPreviewThumb').style.display = "none";
            },

            showToast: (msg, type = "info") => {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = `jm-toast ${type}`;
                toast.innerText = msg;
                container.appendChild(toast);
                setTimeout(() => toast.remove(), 4000);
            },

            escapeHTML: (str) => {
                if (!str) return "";
                const div = document.createElement('div');
                div.innerText = str;
                return div.innerHTML;
            }
        };

        document.querySelectorAll('#jobForm input, #jobForm select, #jobForm textarea').forEach(el => {
            el.addEventListener('input', app.updatePreview);
        });
    </script>
</body>
</html>
