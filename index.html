<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TeacherBee Connect - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --primary-navy: #0A192F; --navy-light: #172A45; --accent-yellow: #FFD700; --yellow-hover: #E5C100; --bg-color: #F8F9FA; --surface-white: #FFFFFF; --text-main: #111827; --text-muted: #6B7280; --border-color: #E5E7EB; --error-red: #EF4444; --success-green: #10B981; --radius-lg: 16px; --radius-md: 8px; --shadow-sm: 0 1px 2px rgba(0,0,0,0.05); --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1); --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; }
    h1, h2, h3, h4 { color: var(--primary-navy); font-weight: 700; margin-bottom: 0.5rem; }
    p { color: var(--text-muted); line-height: 1.5; }
    #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
    .toast { padding: 1rem 1.25rem; border-radius: var(--radius-md); color: var(--surface-white); font-weight: 600; font-size: 0.9rem; box-shadow: var(--shadow-md); animation: slideIn 0.3s ease forwards; display: flex; align-items: center; gap: 10px; }
    .toast.error { background-color: var(--error-red); }
    .toast.success { background-color: var(--success-green); }
    .toast.info { background-color: var(--primary-navy); color: var(--accent-yellow); }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .brand-logo { display: flex; align-items: center; gap: 0.5rem; text-decoration: none; color: var(--surface-white); font-weight: 700; font-size: 1.25rem; }
    .brand-logo i { color: var(--accent-yellow); font-size: 1.5rem; }
    .btn { padding: 0.75rem 1.5rem; border-radius: var(--radius-md); font-weight: 600; font-size: 0.95rem; cursor: pointer; border: none; transition: all 0.2s ease; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; text-decoration: none; }
    .btn-primary { background-color: var(--accent-yellow); color: var(--primary-navy); }
    .btn-primary:hover { background-color: var(--yellow-hover); }
    .btn-outline { background: transparent; border: 2px solid var(--accent-yellow); color: var(--accent-yellow); }
    .btn-outline:hover { background: rgba(255, 215, 0, 0.1); }
    .btn-danger { background-color: #FEE2E2; color: var(--error-red); padding: 0.5rem 1rem; }
    .btn-block { width: 100%; margin-top: 1rem; }
    .app-container { display: flex; flex: 1; max-width: 1200px; margin: 0 auto; width: 100%; padding: 2rem; gap: 2rem; align-items: flex-start; }
    .auth-wrapper { max-width: 480px; margin: 2rem auto; background: var(--surface-white); border-radius: var(--radius-lg); padding: 2.5rem; box-shadow: var(--shadow-sm); width: 100%; border: 1px solid var(--border-color); }
    .auth-header { text-align: center; margin-bottom: 1.5rem; }
    .role-switcher { display: flex; background: var(--bg-color); border-radius: 12px; padding: 6px; margin-bottom: 2rem; border: 1px solid var(--border-color); }
    .role-btn { flex: 1; text-align: center; padding: 0.75rem 1rem; border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--text-muted); transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 0.5rem; font-size: 0.95rem; }
    .role-btn.active { background: var(--surface-white); color: var(--primary-navy); box-shadow: var(--shadow-md); }
    .auth-tabs { display: flex; gap: 1rem; margin-bottom: 1.5rem; border-bottom: 2px solid var(--border-color); padding-bottom: 0.5rem; }
    .auth-tab { flex: 1; text-align: center; font-weight: 600; color: var(--text-muted); cursor: pointer; font-size: 0.95rem; transition: color 0.2s; position: relative; }
    .auth-tab.active { color: var(--primary-navy); }
    .auth-tab.active::after { content: ''; position: absolute; bottom: -8px; left: 0; width: 100%; height: 3px; background: var(--accent-yellow); border-radius: 3px; }
    .form-group { margin-bottom: 1.25rem; position: relative; }
    .form-label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.5rem; color: var(--primary-navy); }
    .form-input, .form-select { width: 100%; padding: 0.85rem 1rem; border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 1rem; outline: none; transition: 0.2s; background: var(--surface-white); color: var(--text-main); }
    .form-input:focus, .form-select:focus { border-color: var(--primary-navy); box-shadow: 0 0 0 3px rgba(10, 25, 47, 0.1); }
    .grid-2-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .password-wrapper { position: relative; }
    .password-wrapper input { padding-right: 2.5rem; }
    .password-toggle { position: absolute; right: 1rem; top: 38px; cursor: pointer; color: var(--text-muted); font-size: 1.1rem; }
    @media (max-width: 768px) { .app-container { padding: 1rem; } .grid-2-col { grid-template-columns: 1fr; } }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendEmailVerification, sendPasswordResetEmail, confirmPasswordReset, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBMKjt1RUZXVxTmadiCqKhNbzSPsNUDxV8",
      authDomain: "teacherbee-connect.firebaseapp.com",
      projectId: "teacherbee-connect",
      storageBucket: "teacherbee-connect.firebasestorage.app",
      messagingSenderId: "345613317767",
      appId: "1:345613317767:web:555713e479f9837e84aa22"
    };

    const app = initializeApp(firebaseConfig);
    window.auth = getAuth(app);
    window.db = getFirestore(app);
    window.fb = { doc, setDoc, getDoc, serverTimestamp, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendEmailVerification, sendPasswordResetEmail, confirmPasswordReset };

    setPersistence(window.auth, browserLocalPersistence);

    const urlParams = new URLSearchParams(window.location.search);
    const mode = urlParams.get('mode');
    const oobCode = urlParams.get('oobCode');

    if (mode === 'resetPassword' && oobCode) {
      document.addEventListener("DOMContentLoaded", () => {
        document.getElementById('auth-panel').style.display = 'none';
        document.getElementById('reset-password-panel').style.display = 'block';
        window.resetOobCode = oobCode;
      });
    }

    onAuthStateChanged(window.auth, async (user) => {
      if (user && mode !== 'resetPassword') {
        const docRef = doc(window.db, "users", user.uid);
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
          const data = docSnap.data();
          if (data.role === 'recruiter') {
            window.location.href = 'recruiter.html';
            return;
          }
        }
        window.location.href = 'profile.html';
      }
    });
  </script>
</head>
<body>
  <div id="toast-container"></div>

  <div class="app-container">
    <div class="auth-wrapper" id="reset-password-panel" style="display: none;">
      <div class="auth-header">
        <h2>Create New Password</h2>
        <p>Enter your new password below.</p>
      </div>
      <form onsubmit="handleNewPasswordSubmit(event)">
        <div class="form-group password-wrapper">
          <label class="form-label">New Password</label>
          <input type="password" id="new-reset-pass" class="form-input" required minlength="6">
          <i class="fa-regular fa-eye password-toggle" onclick="togglePassword('new-reset-pass', this)"></i>
        </div>
        <div class="form-group password-wrapper">
          <label class="form-label">Confirm Password</label>
          <input type="password" id="confirm-reset-pass" class="form-input" required minlength="6">
          <i class="fa-regular fa-eye password-toggle" onclick="togglePassword('confirm-reset-pass', this)"></i>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btn-save-new-pass">Save New Password</button>
      </form>
    </div>

    <div class="auth-wrapper" id="auth-panel">
      <div class="auth-header"><h2 id="auth-title">Sign in to your account</h2></div>
      
      <div class="role-switcher">
        <div class="role-btn active" id="role-teacher" onclick="selectRole('teacher')"><i class="fa-regular fa-user"></i> Job seeker</div>
        <div class="role-btn" id="role-recruiter" onclick="selectRole('recruiter')"><i class="fa-solid fa-building"></i> Employer</div>
      </div>

      <div class="auth-tabs">
        <div class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">Sign In</div>
        <div class="auth-tab" id="tab-register" onclick="switchAuthTab('register')">Sign Up</div>
      </div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="login-email" class="form-input" autocomplete="username" required>
        </div>
        <div class="form-group password-wrapper">
          <label class="form-label">Password</label>
          <input type="password" id="login-password" class="form-input" autocomplete="current-password" required>
          <i class="fa-regular fa-eye password-toggle" onclick="togglePassword('login-password', this)"></i>
        </div>
        <div style="text-align: right; margin-top: -10px; margin-bottom: 15px;">
          <a href="#" style="font-size: 0.85rem; color: var(--primary-navy); font-weight: 600; text-decoration: none;" onclick="handleForgotPassword()">Forgot Password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btn-login">Sign In</button>
      </form>

      <form id="register-form" style="display: none;" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label class="form-label" id="reg-name-label">Full Name</label>
          <input type="text" id="reg-name" class="form-input" autocomplete="name" required>
        </div>
        <div class="grid-2-col">
          <div class="form-group"><label class="form-label">Email Address</label><input type="email" id="reg-email" class="form-input" autocomplete="email" required></div>
          <div class="form-group" id="dob-group"><label class="form-label">Date of Birth</label><input type="date" id="reg-dob" class="form-input" required></div>
        </div>
        <div class="form-group" id="country-group">
          <label class="form-label">Country of Residence</label>
          <select id="reg-country" class="form-select" required>
            <option value="" disabled selected>Select your country</option>
            <option value="Zimbabwe">Zimbabwe</option>
            <option value="South Africa">South Africa</option>
            <option value="United Kingdom">United Kingdom</option>
            <option value="United States">United States</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="grid-2-col">
          <div class="form-group password-wrapper">
            <label class="form-label">Password</label>
            <input type="password" id="reg-password" class="form-input" autocomplete="new-password" required>
            <i class="fa-regular fa-eye password-toggle" onclick="togglePassword('reg-password', this)"></i>
          </div>
          <div class="form-group password-wrapper">
            <label class="form-label">Confirm Password</label>
            <input type="password" id="reg-confirm-password" class="form-input" autocomplete="new-password" required>
            <i class="fa-regular fa-eye password-toggle" onclick="togglePassword('reg-confirm-password', this)"></i>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btn-register">Create Account</button>
      </form>
    </div>
  </div>

  <script>
    window.activeRole = 'teacher';
    window.showToast = function(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-check' : type === 'error' ? 'fa-exclamation' : 'fa-info'}"></i> ${message}`;
      container.appendChild(toast);
      setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3500);
    };

    window.togglePassword = function(inputId, icon) {
      const input = document.getElementById(inputId);
      input.type = input.type === "password" ? "text" : "password";
      icon.classList.toggle('fa-eye'); icon.classList.toggle('fa-eye-slash');
    };

    window.switchAuthTab = function(type) {
      document.getElementById('tab-login').classList.toggle('active', type === 'login');
      document.getElementById('tab-register').classList.toggle('active', type === 'register');
      document.getElementById('login-form').style.display = (type === 'login') ? 'block' : 'none';
      document.getElementById('register-form').style.display = (type === 'register') ? 'block' : 'none';
    };

    window.selectRole = function(role) {
      window.activeRole = role;
      document.getElementById('role-teacher').classList.toggle('active', role === 'teacher');
      document.getElementById('role-recruiter').classList.toggle('active', role === 'recruiter');
      const isRecruiter = role === 'recruiter';
      document.getElementById('reg-name-label').innerText = isRecruiter ? 'Company Name / Representative' : 'Full Name';
      document.getElementById('dob-group').style.display = isRecruiter ? 'none' : 'block';
      document.getElementById('country-group').style.display = isRecruiter ? 'none' : 'block';
      document.getElementById('reg-dob').required = !isRecruiter;
      document.getElementById('reg-country').required = !isRecruiter;
    };

    window.handleRegister = async function(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value, email = document.getElementById('reg-email').value, pass = document.getElementById('reg-password').value, confirmPass = document.getElementById('reg-confirm-password').value, country = document.getElementById('reg-country').value;
      if (pass !== confirmPass) { showToast("Passwords do not match!", 'error'); return; }
      const btn = document.getElementById('btn-register');
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating Account...';
      try {
        const userCredential = await window.fb.createUserWithEmailAndPassword(window.auth, email, pass);
        await window.fb.sendEmailVerification(userCredential.user);
        await window.fb.setDoc(window.fb.doc(window.db, "users", userCredential.user.uid), {
          uid: userCredential.user.uid, name: name, email: email, country: country || "", role: window.activeRole, createdAt: window.fb.serverTimestamp(), qualifications: []
        });
        if(window.activeRole === 'recruiter') window.location.href = 'recruiter.html';
        else window.location.href = 'profile.html';
      } catch (error) {
        btn.innerHTML = 'Create Account';
        if(error.code === 'auth/email-already-in-use') { showToast("Email already exists. Please log in.", 'error'); switchAuthTab('login'); document.getElementById('login-email').value = email; } 
        else { showToast(error.message, 'error'); }
      }
    };

    window.handleLogin = async function(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value, pass = document.getElementById('login-password').value, btn = document.getElementById('btn-login');
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';
      try { await window.fb.signInWithEmailAndPassword(window.auth, email, pass); } 
      catch (error) { btn.innerHTML = 'Sign In'; showToast("Incorrect email or password.", 'error'); }
    };

    window.handleForgotPassword = function() {
      const email = document.getElementById('login-email').value;
      if (!email) { showToast("Please enter your email address first.", "error"); return; }
      window.fb.sendPasswordResetEmail(window.auth, email).then(() => { showToast("Password reset link sent!", "success"); });
    };

    window.handleNewPasswordSubmit = function(e) {
      e.preventDefault();
      const pass = document.getElementById('new-reset-pass').value, confirm = document.getElementById('confirm-reset-pass').value, btn = document.getElementById('btn-save-new-pass');
      if (pass !== confirm) { showToast("Passwords do not match", "error"); return; }
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';
      window.fb.confirmPasswordReset(window.auth, window.resetOobCode, pass).then(() => {
        showToast("Password updated successfully! Please log in.", "success");
        setTimeout(() => { window.location.href = 'index.html'; }, 2000);
      }).catch(err => { btn.innerHTML = 'Save New Password'; showToast("Link expired or invalid.", "error"); });
    };
  </script>
</body>
</html>
