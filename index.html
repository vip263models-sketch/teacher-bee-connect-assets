<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TeacherBee Connect — Auth & Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --navy: #0D4054;
            --navy-dark: #082936;
            --orange: #F5A623;
            --orange-hover: #D98E16;
            --red: #E53E3E;
            --red-hover: #C53030;
            --blue-gray: #718691;
            --card-bg: #FFFFFF;
            --border-gray: #e2e8f0;
            --error-red: #DC2626;
            --success-green: #10B981;
            --radius-xl: 24px;
            --radius-lg: 18px;
            --radius-md: 12px;
            --shadow-card: 0 8px 30px rgba(13, 64, 84, 0.07);
            --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(160deg, #f0f4f8 0%, #e8eef4 30%, #f5f3f1 70%, #fefefe 100%);
            background-attachment: fixed;
            color: var(--navy);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        .smart-header {
            position: fixed; top: 0; left: 0; width: 100%;
            background: rgba(255,255,255,0.88); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            z-index: 99990; box-shadow: 0 1px 0 rgba(0,0,0,0.04), 0 4px 24px rgba(13,64,84,0.05);
        }
        .smart-header-inner { display: flex; justify-content: space-between; align-items: center; padding: 0 20px; height: 60px; max-width: 1200px; margin: 0 auto; }
        .smart-logo { font-family: 'Montserrat', sans-serif; font-size: 1.4rem; font-weight: 800; display: flex; align-items: center; text-decoration: none; gap: 4px; }
        .smart-logo-blue { color: var(--navy); } .smart-logo-orange { color: var(--orange); }
        .smart-logo-emoji { font-size: 1.3rem; margin-left: 5px; animation: beeWiggle 3s ease-in-out infinite; }
        @keyframes beeWiggle { 0%,100%{transform:rotate(0deg) translateY(0);} 15%{transform:rotate(-5deg) translateY(-2px);} 30%{transform:rotate(5deg) translateY(-1px);} 45%{transform:rotate(-3deg) translateY(0);} 60%{transform:rotate(0deg) translateY(0);} }
        .smart-hamburger { background: transparent; border: none; cursor: pointer; width: 40px; height: 40px; border-radius: 50%; color: var(--navy); }
        .smart-menu-overlay { position: fixed; top:0; left:0; width:100vw; height:100vh; background: rgba(10,10,20,0.6); z-index:99999; backdrop-filter: blur(8px); opacity:0; visibility:hidden; transition: all 0.35s; }
        .smart-menu-overlay.open { opacity:1; visibility:visible; }
        .smart-menu-drawer { position:absolute; top:0; right:-100%; width:85%; max-width:360px; height:100%; background:#fff; display:flex; flex-direction:column; transition: right 0.4s; box-shadow: -10px 0 40px rgba(0,0,0,0.25); border-radius: 24px 0 0 24px; }
        .smart-menu-overlay.open .smart-menu-drawer { right:0; }

        .app-container { width:100%; max-width:960px; margin:0 auto; padding:80px 20px 100px; display:flex; flex-direction:column; align-items:center; gap:24px; min-height:100vh; }

        #toast-container { position:fixed; top:80px; right:20px; z-index:99999; display:flex; flex-direction:column; gap:12px; pointer-events:none; }
        .toast { padding:1rem 1.4rem; border-radius:var(--radius-md); color:#fff; font-weight:600; font-size:0.9rem; box-shadow: 0 15px 50px rgba(13,64,84,0.12); animation:slideInToast 0.35s ease forwards; display:flex; align-items:center; gap:12px; min-width:280px; pointer-events:auto; }
        .toast.error { background:var(--error-red); } .toast.success { background:var(--success-green); } .toast.info { background:var(--navy); color:var(--orange); }
        @keyframes slideInToast { from{transform:translateX(40px);opacity:0;} to{transform:translateX(0);opacity:1;} }

        .auth-card { width:100%; background:var(--card-bg); border-radius:var(--radius-xl); padding:2.5rem 2rem; box-shadow:var(--shadow-card); border:1px solid var(--border-gray); position:relative; overflow:hidden; }
        .auth-card::before { content:''; position:absolute; top:0; left:0; right:0; height:4px; background:linear-gradient(90deg, var(--navy) 0%, var(--orange) 40%, var(--red) 80%, var(--navy) 100%); }
        .auth-welcome { text-align:center; margin-bottom:2rem; }
        .auth-welcome-icon { width:70px; height:70px; background:linear-gradient(135deg, #e8f4f8, #d4e6f1); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 1rem; font-size:2rem; color:var(--navy); }
        .role-switcher { display:flex; background:#f5f7fa; border-radius:60px; padding:6px; margin-bottom:1.8rem; border:1px solid var(--border-gray); }
        .role-btn { flex:1; text-align:center; padding:0.85rem 1rem; border-radius:60px; cursor:pointer; font-weight:600; color:var(--blue-gray); transition:all 0.35s; display:flex; align-items:center; justify-content:center; gap:0.5rem; border:none; background:transparent; }
        .role-btn.active { background:var(--navy); color:#fff; }
        .role-btn.recruiter-active.active { background:#1a1a2e; }
        .form-group { margin-bottom:1.2rem; }
        .form-label { display:block; font-weight:700; font-size:0.8rem; margin-bottom:0.5rem; color:var(--navy); text-transform:uppercase; }
        .form-input, .form-select { width:100%; padding:0.95rem 1.2rem; border:1.8px solid var(--border-gray); border-radius:var(--radius-md); font-size:0.95rem; outline:none; background:#fafbfc; color:var(--navy); }
        .btn { padding:0.95rem 1.6rem; border-radius:60px; font-weight:700; font-size:0.95rem; cursor:pointer; border:none; display:inline-flex; align-items:center; justify-content:center; gap:0.5rem; }
        .btn-primary { background:var(--navy); color:#fff; }
        .btn-secondary { background:transparent; color:var(--navy); border:2px solid var(--navy); }
        .btn-block { width:100%; }

        #dashboard-area { width:100%; display:none; flex-direction:column; gap:20px; }
        .welcome-banner { background:var(--card-bg); border-radius:var(--radius-lg); padding:1.8rem; box-shadow:var(--shadow-card); border:1px solid var(--border-gray); display:flex; align-items:center; gap:1rem; }
        .welcome-banner-avatar { width:56px; height:56px; border-radius:50%; background:linear-gradient(135deg, var(--navy), #1a5f78); display:flex; align-items:center; justify-content:center; font-size:1.6rem; color:#fff; }
        .role-badge { display:inline-block; padding:4px 12px; border-radius:20px; font-size:0.75rem; font-weight:700; }
        .badge-seeker { background:#e8f4f8; color:var(--navy); } .badge-recruiter { background:#fff0f0; color:#a03030; }

        .stats-row { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:14px; }
        .stat-card { background:var(--card-bg); border-radius:var(--radius-md); padding:1.3rem 1.2rem; box-shadow:0 1px 2px rgba(0,0,0,0.04); border:1px solid var(--border-gray); text-align:center; text-decoration:none; color:inherit; display:block; transition: all 0.2s; }
        .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-card); }
        .stat-card i { font-size:1.5rem; color:var(--orange); display:block; margin-bottom:8px; }
        .stat-card .stat-number { font-size:1.6rem; font-weight:800; color:var(--navy); }
        .stat-card .stat-label { font-size:0.75rem; color:var(--blue-gray); text-transform:uppercase; letter-spacing:0.5px; font-weight:600; }

        .section-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
        .section-header h4 { font-weight:700; color:var(--navy); }
        .section-header a { font-size:0.8rem; font-weight:700; color:var(--orange); text-decoration:none; }

        .card-list { display:flex; flex-direction:column; gap:10px; }
        .list-card { background:var(--card-bg); border-radius:var(--radius-md); padding:1rem 1.2rem; box-shadow:0 1px 2px rgba(0,0,0,0.04); border:1px solid var(--border-gray); display:flex; align-items:center; gap:14px; text-decoration:none; color:inherit; transition:all 0.2s; }
        .list-card:hover { transform:translateY(-2px); box-shadow:var(--shadow-card); }
        .list-card-icon { width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.1rem; }
        .icon-jobs { background:#e8f4f8; color:var(--navy); } .icon-teachers { background:#fff3e0; color:#e67e22; }
        .icon-inbox { background:#f0e6f6; color:#7b3fa3; } .icon-message-unread { background:#ffe0e0; color:#d32f2f; }
        .list-card-info .title { font-weight:700; color:var(--navy); font-size:0.9rem; }
        .list-card-info .subtitle { font-size:0.78rem; color:var(--blue-gray); }
        .badge-unread { display:inline-block; background:var(--red); color:#fff; font-size:0.65rem; font-weight:700; padding:3px 9px; border-radius:12px; }

        #footer-nav-wrapper { display:none; position:fixed; bottom:0; left:0; width:100%; z-index:99999; }
        #footer-nav-wrapper.dashboard-visible { display:block; }
        #footer-nav-wrapper .footer-nav-scroll { display:flex; overflow-x:auto; padding:10px 12px; gap:8px; background:rgba(15,32,49,0.92); backdrop-filter:blur(14px); border-top:1px solid rgba(255,255,255,0.12); }
        #footer-nav-wrapper .footer-nav-scroll a { display:flex; flex-direction:column; align-items:center; min-width:72px; padding:9px 6px; border-radius:14px; background:rgba(255,255,255,0.04); color:#cbd5e1; text-decoration:none; }
        #footer-nav-wrapper .footer-nav-scroll a i { font-size:19px; margin-bottom:5px; color:#94a3b8; }
        #footer-nav-wrapper .footer-nav-scroll a span { font-size:10px; font-weight:600; text-transform:uppercase; }
        #footer-nav-wrapper .footer-nav-scroll a:first-child { background:rgba(220,168,36,0.95); color:#fff; }
        #footer-nav-wrapper .footer-nav-scroll a.sign-out { background:rgba(255,71,87,0.08); }
        @media (min-width:769px) { #footer-nav-wrapper.dashboard-visible { display:flex!important; justify-content:center; bottom:20px; background:transparent; } }
    </style>
</head>
<body>
<div id="toast-container"></div>
<header class="smart-header" id="smartHeader">
    <div class="smart-header-inner">
        <a href="index.html" class="smart-logo"><span class="smart-logo-blue">Teacher Bee</span><span class="smart-logo-orange">Connect</span><span class="smart-logo-emoji">🐝</span></a>
        <button class="smart-hamburger" id="smartMenuBtn"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button>
    </div>
</header>
<div class="smart-menu-overlay" id="smartMenuOverlay"><div class="smart-menu-drawer"><div class="smart-menu-header"><span class="smart-logo"><span class="smart-logo-blue">Teacher Bee</span><span class="smart-logo-orange">Connect</span>🐝</span><button class="smart-menu-close" id="smartCloseBtn">✕</button></div><div class="smart-menu-links"><a href="#"><i class="fa-solid fa-circle-info"></i> About</a><a href="#"><i class="fa-solid fa-briefcase"></i> Services</a></div></div></div>

<div class="app-container">
    <!-- Reset Password Panel -->
    <div class="auth-card" id="reset-password-panel" style="display:none;">
        <div class="auth-welcome"><div class="auth-welcome-icon"><i class="fa-solid fa-lock"></i></div><h2>New Password</h2></div>
        <form onsubmit="handleNewPasswordSubmit(event)">
            <div class="form-group"><label class="form-label">New Password</label><input type="password" id="new-reset-pass" class="form-input" required minlength="6"></div>
            <div class="form-group"><label class="form-label">Confirm Password</label><input type="password" id="confirm-reset-pass" class="form-input" required minlength="6"></div>
            <button type="submit" class="btn btn-primary btn-block">Update Password</button>
        </form>
        <a class="back-link" onclick="goBackToLogin()" style="display:block; text-align:center; margin-top:1rem; color:var(--navy); cursor:pointer;"><i class="fa-solid fa-arrow-left"></i> Back to Sign In</a>
    </div>

    <!-- Auth Panel -->
    <div class="auth-card" id="auth-panel">
        <div class="auth-welcome"><div class="auth-welcome-icon"><i class="fa-solid fa-bee"></i></div><h2>Welcome back</h2><p id="auth-subtitle">Sign in to access your portal</p></div>
        <div class="role-switcher">
            <button class="role-btn active" id="role-teacher" onclick="selectRole('teacher')"><i class="fa-regular fa-user"></i> Job Seeker</button>
            <button class="role-btn recruiter-active" id="role-recruiter" onclick="selectRole('recruiter')"><i class="fa-solid fa-building-user"></i> Employer</button>
        </div>
        <div id="login-view">
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group"><label class="form-label">Email</label><input type="email" id="login-email" class="form-input" required></div>
                <div class="form-group"><label class="form-label">Password</label><input type="password" id="login-password" class="form-input" required></div>
                <div style="text-align:right; margin-bottom:20px;"><a href="#" class="forgot-link" onclick="handleForgotPassword()">Forgot Password?</a></div>
                <button type="submit" class="btn btn-primary btn-block" id="btn-login">Sign In</button>
            </form>
            <div class="auth-footer-prompt"><p>New to TeacherBee?</p><button class="btn btn-secondary btn-block" onclick="switchAuthView('register')">Create Account</button></div>
        </div>
        <div id="register-view" style="display:none;">
            <form id="register-form" onsubmit="handleRegister(event)">
                <div class="form-group"><label class="form-label">Full Name</label><input type="text" id="reg-name" class="form-input" required></div>
                <div class="form-group"><label class="form-label">Email</label><input type="email" id="reg-email" class="form-input" required></div>
                <div class="form-group"><label class="form-label">Country</label><select id="reg-country" class="form-select" required><option value="" disabled selected>Select country</option></select></div>
                <div class="form-group"><label class="form-label">Password</label><input type="password" id="reg-password" class="form-input" required></div>
                <div class="form-group"><label class="form-label">Confirm Password</label><input type="password" id="reg-confirm-password" class="form-input" required></div>
                <button type="submit" class="btn btn-primary btn-block" id="btn-register">Register</button>
            </form>
            <div class="auth-footer-prompt"><p>Already have an account?</p><button class="btn btn-secondary btn-block" onclick="switchAuthView('login')">Sign In</button></div>
        </div>
    </div>

    <!-- Dashboard Area -->
    <div id="dashboard-area">
        <div class="welcome-banner">
            <div class="welcome-banner-avatar"><i class="fa-solid fa-user"></i></div>
            <div><h3 id="dash-user-name">Welcome back!</h3><p id="dash-user-email"></p><span class="role-badge badge-seeker" id="dash-role-badge">Job Seeker</span></div>
        </div>
        <div class="stats-row" id="dash-stats-row"></div>
        <div class="section-header"><h4 id="dash-section-title">Recent Jobs</h4><a href="#" id="dash-section-link">View All</a></div>
        <div class="card-list" id="dash-card-list"></div>
        <div class="section-header"><h4>Inbox</h4><a href="#" id="dash-inbox-link">View All</a></div>
        <div class="card-list" id="dash-inbox-list"></div>
    </div>
</div>

<div id="footer-nav-wrapper"><div class="footer-nav-scroll" id="footer-nav-scroll"></div></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendEmailVerification, sendPasswordResetEmail, confirmPasswordReset, signOut, setPersistence, browserLocalPersistence, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, serverTimestamp, collection, query, where, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBMKjt1RUZXVxTmadiCqKhNbzSPsNUDxV8",
        authDomain: "teacherbee-connect.firebaseapp.com",
        projectId: "teacherbee-connect",
        storageBucket: "teacherbee-connect.firebasestorage.app",
        messagingSenderId: "345613317767",
        appId: "1:345613317767:web:555713e479f9837e84aa22"
    };
    const app = initializeApp(firebaseConfig);
    window.auth = getAuth(app);
    window.db = getFirestore(app);
    window.fb = { doc, setDoc, getDoc, serverTimestamp, collection, query, where, orderBy, limit, getDocs, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendEmailVerification, sendPasswordResetEmail, confirmPasswordReset, signOut, onAuthStateChanged };
    setPersistence(window.auth, browserLocalPersistence);

    window.activeRole = 'teacher';
    const BASE = "https://vip263models-sketch.github.io/teacher-bee-connect-assets/";

    // Complete country list
    const countries = ["Afghanistan","Albania","Algeria","Andorra","Angola","Antigua and Barbuda","Argentina","Armenia","Australia","Austria","Azerbaijan","Bahamas","Bahrain","Bangladesh","Barbados","Belarus","Belgium","Belize","Benin","Bhutan","Bolivia","Bosnia and Herzegovina","Botswana","Brazil","Brunei","Bulgaria","Burkina Faso","Burundi","Cabo Verde","Cambodia","Cameroon","Canada","Central African Republic","Chad","Chile","China","Colombia","Comoros","Congo","Costa Rica","Croatia","Cuba","Cyprus","Czech Republic","Democratic Republic of the Congo","Denmark","Djibouti","Dominica","Dominican Republic","Ecuador","Egypt","El Salvador","Equatorial Guinea","Eritrea","Estonia","Eswatini","Ethiopia","Fiji","Finland","France","Gabon","Gambia","Georgia","Germany","Ghana","Greece","Grenada","Guatemala","Guinea","Guinea-Bissau","Guyana","Haiti","Honduras","Hungary","Iceland","India","Indonesia","Iran","Iraq","Ireland","Israel","Italy","Ivory Coast","Jamaica","Japan","Jordan","Kazakhstan","Kenya","Kiribati","Kosovo","Kuwait","Kyrgyzstan","Laos","Latvia","Lebanon","Lesotho","Liberia","Libya","Liechtenstein","Lithuania","Luxembourg","Madagascar","Malawi","Malaysia","Maldives","Mali","Malta","Marshall Islands","Mauritania","Mauritius","Mexico","Micronesia","Moldova","Monaco","Mongolia","Montenegro","Morocco","Mozambique","Myanmar","Namibia","Nauru","Nepal","Netherlands","New Zealand","Nicaragua","Niger","Nigeria","North Korea","North Macedonia","Norway","Oman","Pakistan","Palau","Palestine","Panama","Papua New Guinea","Paraguay","Peru","Philippines","Poland","Portugal","Qatar","Romania","Russia","Rwanda","Saint Kitts and Nevis","Saint Lucia","Saint Vincent and the Grenadines","Samoa","San Marino","Sao Tome and Principe","Saudi Arabia","Senegal","Serbia","Seychelles","Sierra Leone","Singapore","Slovakia","Slovenia","Solomon Islands","Somalia","South Africa","South Korea","South Sudan","Spain","Sri Lanka","Sudan","Suriname","Sweden","Switzerland","Syria","Taiwan","Tajikistan","Tanzania","Thailand","Timor-Leste","Togo","Tonga","Trinidad and Tobago","Tunisia","Turkey","Turkmenistan","Tuvalu","Uganda","Ukraine","United Arab Emirates","United Kingdom","United States","Uruguay","Uzbekistan","Vanuatu","Vatican City","Venezuela","Vietnam","Western Sahara","Yemen","Zambia","Zimbabwe"];

    // Populate country dropdown reliably
    document.addEventListener('DOMContentLoaded', () => {
        const sel = document.getElementById('reg-country');
        if (!sel) return;
        countries.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c;
            opt.textContent = c;
            sel.appendChild(opt);
        });
    });

    // Sanitize error messages - no Firestore references
    function sanitizeError(err) {
        const msg = (err?.message || '').toLowerCase();
        if (msg.includes('invalid-credential') || msg.includes('wrong-password')) return 'Incorrect email or password.';
        if (msg.includes('email-already-in-use')) return 'Email already registered.';
        if (msg.includes('weak-password')) return 'Password too weak. Use at least 6 characters.';
        if (msg.includes('too-many-requests')) return 'Too many attempts. Try again later.';
        if (msg.includes('network')) return 'Connection error. Check your internet.';
        return 'An error occurred. Please try again.';
    }

    window.showToast = (msg, type='info') => {
        const container = document.getElementById('toast-container');
        const t = document.createElement('div');
        t.className = `toast ${type}`;
        t.innerHTML = `<i class="fa-solid ${type==='success'?'fa-circle-check':type==='error'?'fa-circle-exclamation':'fa-circle-info'}"></i> ${msg}`;
        container.appendChild(t);
        setTimeout(() => { t.style.opacity='0'; setTimeout(()=>t.remove(),300); }, 4000);
    };

    window.switchAuthView = (view) => {
        document.getElementById('login-view').style.display = view==='login'?'block':'none';
        document.getElementById('register-view').style.display = view==='login'?'none':'block';
    };

    window.selectRole = (role) => {
        window.activeRole = role;
        document.getElementById('role-teacher').classList.toggle('active', role==='teacher');
        document.getElementById('role-recruiter').classList.toggle('active', role==='recruiter');
    };

    let loginInProgress = false;

    window.handleLogin = async (e) => {
        e.preventDefault();
        if (loginInProgress) return;
        const btn = document.getElementById('btn-login');
        btn.disabled = true;
        loginInProgress = true;
        const email = document.getElementById('login-email').value.trim();
        const pass = document.getElementById('login-password').value;
        try {
            await window.fb.signInWithEmailAndPassword(window.auth, email, pass);
            showToast('Login successful!', 'success');
            // No further action - onAuthStateChanged will handle dashboard display
        } catch(err) {
            showToast(sanitizeError(err), 'error');
        } finally {
            btn.disabled = false;
            loginInProgress = false;
        }
    };

    window.handleRegister = async (e) => {
        e.preventDefault();
        const name = document.getElementById('reg-name').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const pass = document.getElementById('reg-password').value;
        const confirmPass = document.getElementById('reg-confirm-password').value;
        const country = document.getElementById('reg-country').value;
        if (pass !== confirmPass) { showToast("Passwords don't match",'error'); return; }
        try {
            const cred = await window.fb.createUserWithEmailAndPassword(window.auth, email, pass);
            await window.fb.sendEmailVerification(cred.user);
            const userData = { uid: cred.user.uid, name, email, country, role: window.activeRole, createdAt: window.fb.serverTimestamp(), qualifications:[] };
            await window.fb.setDoc(window.fb.doc(window.db, "users", cred.user.uid), userData);
            showToast('Account created!', 'success');
        } catch(err) { showToast(sanitizeError(err), 'error'); }
    };

    window.handleForgotPassword = () => {
        const email = document.getElementById('login-email').value.trim();
        if (!email) { showToast('Enter your email first.', 'error'); return; }
        window.fb.sendPasswordResetEmail(window.auth, email)
            .then(() => showToast('Check your inbox or spam folder for the reset link.', 'success'))
            .catch(err => showToast(sanitizeError(err), 'error'));
    };

    window.handleNewPasswordSubmit = (e) => {
        e.preventDefault();
        const pass = document.getElementById('new-reset-pass').value;
        const confirm = document.getElementById('confirm-reset-pass').value;
        if (pass !== confirm) { showToast("Passwords don't match", 'error'); return; }
        window.fb.confirmPasswordReset(window.auth, window.resetOobCode, pass)
            .then(() => { showToast('Password updated!', 'success'); setTimeout(()=>window.location.href='index.html',2000); })
            .catch(err => showToast(sanitizeError(err), 'error'));
    };

    window.goBackToLogin = () => {
        document.getElementById('reset-password-panel').style.display = 'none';
        document.getElementById('auth-panel').style.display = 'block';
        window.history.replaceState({}, document.title, window.location.pathname);
        window.resetOobCode = null;
    };

    window.handleGlobalSignOut = () => { window.fb.signOut(window.auth).then(()=>{ showToast('Signed out.', 'info'); hideDashboard(); }); };

    function showDashboard(userData) {
        document.getElementById('auth-panel').style.display = 'none';
        document.getElementById('reset-password-panel').style.display = 'none';
        document.getElementById('dashboard-area').style.display = 'flex';
        document.getElementById('footer-nav-wrapper').classList.add('dashboard-visible');
        const isRec = window.activeRole === 'recruiter';
        document.getElementById('dash-user-name').innerText = `Welcome, ${userData.name || 'User'}!`;
        document.getElementById('dash-user-email').innerText = userData.email || '';
        const badge = document.getElementById('dash-role-badge');
        badge.innerText = isRec ? 'Employer' : 'Job Seeker';
        badge.className = `role-badge ${isRec ? 'badge-recruiter' : 'badge-seeker'}`;

        // Clickable stat cards
        const statsRow = document.getElementById('dash-stats-row');
        if (isRec) {
            statsRow.innerHTML = `
                <a href="${BASE}postjobs.html" class="stat-card"><i class="fa-solid fa-briefcase"></i><div class="stat-number" id="stat-jobs">-</div><div class="stat-label">Active Jobs</div></a>
                <a href="${BASE}searchteachers.html" class="stat-card"><i class="fa-solid fa-user-graduate"></i><div class="stat-number" id="stat-teachers">-</div><div class="stat-label">Teachers</div></a>
                <a href="${BASE}recruiterinbox.html" class="stat-card"><i class="fa-solid fa-envelope"></i><div class="stat-number" id="stat-unread">-</div><div class="stat-label">Unread</div></a>
            `;
        } else {
            statsRow.innerHTML = `
                <a href="${BASE}jobs.html" class="stat-card"><i class="fa-solid fa-briefcase"></i><div class="stat-number" id="stat-jobs">-</div><div class="stat-label">Open Jobs</div></a>
                <a href="${BASE}inbox.html" class="stat-card"><i class="fa-solid fa-paper-plane"></i><div class="stat-number" id="stat-applications">-</div><div class="stat-label">Applications</div></a>
                <a href="${BASE}inbox.html" class="stat-card"><i class="fa-solid fa-envelope"></i><div class="stat-number" id="stat-unread">-</div><div class="stat-label">Unread</div></a>
            `;
        }

        // Fetch dynamic data
        if (isRec) {
            fetchRecruiterActiveJobs();
            fetchRecentTeachers();
            document.getElementById('dash-section-title').innerText = 'Recently Added Teachers';
            document.getElementById('dash-section-link').href = BASE + 'searchteachers.html';
            document.getElementById('dash-inbox-link').href = BASE + 'recruiterinbox.html';
        } else {
            fetchRecentJobs();
            document.getElementById('dash-section-title').innerText = 'Recent Jobs';
            document.getElementById('dash-section-link').href = BASE + 'jobs.html';
            document.getElementById('dash-inbox-link').href = BASE + 'inbox.html';
        }
        fetchInboxPreviews(isRec);
        buildFooterNav(isRec);
    }

    async function fetchRecruiterActiveJobs() {
        const q = window.fb.query(window.fb.collection(window.db, "jobs"), window.fb.where("status","==","open"));
        const snap = await window.fb.getDocs(q);
        document.getElementById('stat-jobs').innerText = snap.size;
    }

    async function fetchRecentJobs() {
        const q = window.fb.query(window.fb.collection(window.db, "jobs"), window.fb.where("status","==","open"), window.fb.orderBy("createdAt","desc"), window.fb.limit(10));
        const snapshot = await window.fb.getDocs(q);
        const container = document.getElementById('dash-card-list');
        container.innerHTML = '';
        if (snapshot.empty) {
            container.innerHTML = '<p style="color:var(--blue-gray);">No open jobs right now.</p>';
            document.getElementById('stat-jobs').innerText = '0';
        } else {
            document.getElementById('stat-jobs').innerText = snapshot.size;
            snapshot.forEach(docSnap => {
                const job = docSnap.data();
                const card = document.createElement('a');
                card.className = 'list-card';
                card.href = BASE + 'jobs.html';
                card.innerHTML = `<div class="list-card-icon icon-jobs"><i class="fa-solid fa-school"></i></div><div class="list-card-info"><div class="title">${job.title || 'Untitled'}</div><div class="subtitle">${job.employerName || ''} · ${job.location || ''}</div></div><div class="list-card-meta"><span class="time">${timeAgo(job.createdAt)}</span></div>`;
                container.appendChild(card);
            });
        }
        updateApplicationCount();
    }

    async function updateApplicationCount() {
        const q = window.fb.query(window.fb.collection(window.db, "threads"), window.fb.where("participants","array-contains", window.currentUser.uid));
        const snap = await window.fb.getDocs(q);
        document.getElementById('stat-applications').innerText = snap.size;
    }

    async function fetchRecentTeachers() {
        const q = window.fb.query(window.fb.collection(window.db, "users"), window.fb.where("role","==","teacher"), window.fb.orderBy("createdAt","desc"), window.fb.limit(10));
        const snapshot = await window.fb.getDocs(q);
        const container = document.getElementById('dash-card-list');
        container.innerHTML = '';
        if (snapshot.empty) {
            container.innerHTML = '<p style="color:var(--blue-gray);">No teachers registered yet.</p>';
            document.getElementById('stat-teachers').innerText = '0';
        } else {
            document.getElementById('stat-teachers').innerText = snapshot.size;
            snapshot.forEach(docSnap => {
                const t = docSnap.data();
                const card = document.createElement('a');
                card.className = 'list-card';
                card.href = BASE + 'searchteachers.html';
                card.innerHTML = `<div class="list-card-icon icon-teachers"><i class="fa-solid fa-chalkboard-user"></i></div><div class="list-card-info"><div class="title">${t.name || 'Teacher'}</div><div class="subtitle">${t.country || ''} · ${t.experience ? t.experience+' yrs' : 'New'}</div></div><div class="list-card-meta"><span class="time">Joined ${timeAgo(t.createdAt)}</span></div>`;
                container.appendChild(card);
            });
        }
    }

    async function fetchInboxPreviews(isRec) {
        const q = window.fb.query(window.fb.collection(window.db, "threads"), window.fb.where("participants","array-contains", window.currentUser.uid), window.fb.orderBy("updatedAt","desc"), window.fb.limit(5));
        const snapshot = await window.fb.getDocs(q);
        const container = document.getElementById('dash-inbox-list');
        container.innerHTML = '';
        if (snapshot.empty) {
            container.innerHTML = '<p style="color:var(--blue-gray);">No messages yet.</p>';
            document.getElementById('stat-unread').innerText = '0';
        } else {
            let unread = 0;
            snapshot.forEach(docSnap => {
                const thread = docSnap.data();
                const isUnread = thread.updatedAt?.toMillis() > (window.lastReadTimestamps?.[docSnap.id]||0);
                if (isUnread) unread++;
                const card = document.createElement('a');
                card.className = 'list-card';
                card.href = isRec ? BASE + 'recruiterinbox.html' : BASE + 'inbox.html';
                card.innerHTML = `<div class="list-card-icon ${isUnread?'icon-message-unread':'icon-inbox'}"><i class="fa-solid fa-envelope"></i></div><div class="list-card-info"><div class="title">${thread.jobTitle || 'Conversation'}</div><div class="subtitle">${thread.lastMessageText || 'No messages'}</div></div><div class="list-card-meta">${isUnread?'<span class="badge-unread">Unread</span>':''}</div>`;
                container.appendChild(card);
            });
            document.getElementById('stat-unread').innerText = unread;
        }
    }

    function hideDashboard() {
        document.getElementById('auth-panel').style.display = 'block';
        document.getElementById('dashboard-area').style.display = 'none';
        document.getElementById('footer-nav-wrapper').classList.remove('dashboard-visible');
        document.getElementById('login-view').style.display = 'block';
        document.getElementById('register-view').style.display = 'none';
    }

    function timeAgo(ts) {
        if (!ts) return '';
        const date = ts.toDate ? ts.toDate() : new Date(ts);
        const mins = Math.floor((Date.now() - date.getTime())/60000);
        if (mins < 60) return `${mins}m ago`;
        const hrs = Math.floor(mins/60);
        if (hrs < 24) return `${hrs}h ago`;
        return date.toLocaleDateString();
    }

    function buildFooterNav(isRec) {
        const nav = document.getElementById('footer-nav-scroll');
        nav.innerHTML = '';
        const items = isRec ? [
            { icon:'fa-house', label:'Home', href:'#' },
            { icon:'fa-id-card', label:'Profile', href:BASE+'recruiter.html' },
            { icon:'fa-user-graduate', label:'Teachers', href:BASE+'searchteachers.html' },
            { icon:'fa-envelope', label:'Inbox', href:BASE+'recruiterinbox.html' },
        ] : [
            { icon:'fa-house', label:'Home', href:'#' },
            { icon:'fa-id-card', label:'Profile', href:BASE+'teacherprofile.html' },
            { icon:'fa-magnifying-glass', label:'Jobs', href:BASE+'jobs.html' },
            { icon:'fa-inbox', label:'Inbox', href:BASE+'inbox.html' },
        ];
        items.forEach(item => {
            const a = document.createElement('a');
            a.href = item.href;
            a.innerHTML = `<i class="fa-solid ${item.icon}"></i><span>${item.label}</span>`;
            nav.appendChild(a);
        });
        const logout = document.createElement('a');
        logout.href = '#'; logout.className = 'nav-item sign-out';
        logout.innerHTML = '<i class="fa-solid fa-right-from-bracket"></i><span>Logout</span>';
        logout.onclick = (e) => { e.preventDefault(); handleGlobalSignOut(); };
        nav.appendChild(logout);
    }

    // Auth observer - does NOT show toast, only updates dashboard
    window.fb.onAuthStateChanged(window.auth, async (user) => {
        if (user) {
            const userDoc = await window.fb.getDoc(window.fb.doc(window.db, "users", user.uid));
            if (userDoc.exists()) {
                const data = userDoc.data();
                window.currentUser = { uid: user.uid, ...data };
                window.activeRole = data.role || 'teacher';
                showDashboard(data);
            }
        } else {
            if (document.getElementById('dashboard-area').style.display === 'flex') hideDashboard();
        }
    });

    // Password reset mode check
    (function() {
        const params = new URLSearchParams(window.location.search);
        if (params.get('mode') === 'resetPassword' && params.get('oobCode')) {
            document.getElementById('auth-panel').style.display = 'none';
            document.getElementById('reset-password-panel').style.display = 'block';
            window.resetOobCode = params.get('oobCode');
        }
    })();
</script>
</body>
</html>
